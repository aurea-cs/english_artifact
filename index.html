const G5 = {"PT":{"sofia":{"t":"A New Home in Chicago","x":"When Sofía was ten, her family left their small town in Oaxaca, Mexico, and moved to Chicago. Her father had found a job in a bakery, and her parents believed the move was a great opportunity for the whole family.\nThe first months were hard. Sofía did not speak much English, and the winter was colder than anything she had ever felt. At school, she sat quietly because she was afraid of making mistakes. Her biggest obstacle was the language.\nLittle by little, Sofía began to adapt. A classmate named Grace helped her with new words, and Sofía taught Grace how to make tortillas. Sofía discovered that her class had great diversity: her classmates' families came from Poland, India, Nigeria and Vietnam.\nBy the end of the year, Sofía was reading chapter books in English. She still speaks Spanish at home, and every Sunday her grandmother calls from Oaxaca to transmit family stories and traditions. \"I have two homes now,\" Sofía says, \"and two cultures that make me who I am.\"","q":[["What is the main idea of the text?","Sofía faced challenges in a new country, but she adapted and kept her culture.","Chicago has very cold winters.","Sofía's father works in a bakery.","Todo el texto trata de cómo Sofía se adapta sin perder su cultura."],["What was Sofía's biggest obstacle?","The language","The food","The bakery","“Her biggest obstacle was the language.”"],["Why did Sofía sit quietly at school?","She was afraid of making mistakes.","She was very tired.","The teacher asked her to.","Causa → efecto: tenía miedo de equivocarse."],["What happened by the end of the year?","Sofía was reading chapter books in English.","Sofía moved back to Oaxaca.","Sofía stopped speaking Spanish.","Es el final de la secuencia."],["Which is the best summary?","Sofía moved from Oaxaca to Chicago, struggled with English at first, adapted with a friend's help and kept her culture.","Sofía likes tortillas and her friend Grace.","Chicago is a big city with people from many countries.","Un buen resumen dice quién, qué, por qué y cómo termina."]]},"amir":{"t":"Amir's First Winter","x":"Amir was eleven when his family arrived in Toronto, Canada. They came from Syria, a country affected by war, and they hoped to find a safe place to live. The transition was not easy. Amir's parents had to look for new jobs, and the family lived in a small apartment while they learned about their new society.\nOn his first day of school, Amir could only say \"hello\" and \"thank you\" in English. Some children assumed he did not understand anything, but Amir was a fast learner. He joined the school soccer team, and soon he was talking with his teammates during every practice.\nThe cold weather was another challenge. Amir had never seen snow before. At first, he did not like it, but his teammate Lucas taught him to skate, and winter became his favourite season.\nAmir still misses his grandparents and the food of his country. He keeps his culture alive by cooking traditional dishes with his mother and by teaching his new friends a few words in Arabic.","q":[["Why did Amir's family move to Canada?","To find a safe place to live","To work in a bakery","To learn to skate","“they hoped to find a safe place to live”."],["What helped Amir make friends?","Joining the school soccer team","Cooking with his mother","Living in a small apartment","Se unió al equipo de fútbol."],["In the text, “assumed” means…","thought something without proof","said something loudly","learned something quickly","Pista: creyeron que no entendía, pero se equivocaban."],["How did Amir feel about winter at the end?","It became his favourite season.","He still hated it.","He never saw snow.","Lucas le enseñó a patinar."],["What is the main idea of the text?","Amir faced a difficult transition but adapted to his new country and kept his culture.","Toronto has a lot of snow.","Amir's parents found new jobs.","Resume todo el texto."]]},"suns":{"t":"Ten Suns: A Chinese Myth","x":"Long ago, Di Jun, the Emperor of the East, and the goddess Xi He had ten sons. Each son was a sun. Every morning, their mother drove one sun across the sky in her chariot, while the other nine rested in a giant mulberry tree at the edge of the world. In this way, the Earth received just the right amount of light and energy.\nBut the ten suns became bored. \"Why should only one of us play in the sky?\" they asked. One morning, they disobeyed their mother and rose into the sky all together. The heat was terrible. Rivers dried up, crops burned, and people and animals suffered.\nThe people prayed for help, and Emperor Yao asked the gods for a hero. Di Jun sent Yi, the greatest archer in heaven, with a red bow and white arrows. He told Yi to frighten his sons, not to hurt them. Yi asked the suns to go home, but they laughed at him.\nAngry at their cruelty, Yi shot his arrows. One by one, nine suns fell from the sky and turned into three-legged golden birds. Slowly, the heat began to decrease. The people cheered, but Yi kept one sun in the sky so that the world would not be dark and cold.\nDi Jun was furious that his sons had been killed. As a punishment, he did not allow Yi to return to heaven. Yi had saved the Earth, but he had to live among humans for the rest of his life.","q":[["Why did the ten suns rise together?","They were bored and disobeyed their mother.","Yi asked them to.","The people needed more light.","“the ten suns became bored… they disobeyed”."],["What happened when all the suns were in the sky?","Rivers dried up and crops burned.","It snowed for a week.","The people had a party.","Efecto de los diez soles."],["What did Di Jun tell Yi to do?","To frighten his sons, not to hurt them","To shoot all ten suns","To become the new emperor","Es el conflicto de Yi."],["What happened to the nine suns that fell?","They turned into three-legged golden birds.","They became stars.","They returned to the tree.","Detalle del texto."],["How did the story end for Yi?","He could not return to heaven.","He became a sun.","He became the Emperor of the East.","Consecuencia de su decisión."]]},"monarchs":{"t":"The Great Monarch Journey","x":"Every autumn, millions of monarch butterflies begin an amazing journey. They fly from Canada and the United States to the mountain forests of Michoacán, in Mexico. Some of them travel more than 4,000 kilometres!\nWhy do they migrate? Monarchs cannot survive cold winters. When the days become shorter and the temperature begins to decrease, they fly south to find a warmer place. In the forests of Mexico, the fir trees protect them from wind and rain, so they can rest until spring.\nThe journey is full of obstacles. Storms, strong winds and a lack of flowers make the trip difficult. To save energy, monarchs glide on warm air currents instead of flapping their wings all the time.\nScientists are still looking for an explanation for one mystery: no butterfly makes the whole round trip. The monarchs that return north in spring are their children and grandchildren. Somehow, the route is transmitted from one generation to the next.\nToday, the number of monarchs is decreasing because forests are being cut down and milkweed plants are disappearing. Many people are planting milkweed to help them.","q":[["Why do monarchs migrate?","They cannot survive cold winters.","They want to visit Canada.","They are looking for the sea.","“Monarchs cannot survive cold winters.”"],["How do the fir trees help the monarchs?","They protect them from wind and rain.","They give them milkweed.","They show them the route.","Detalle del segundo párrafo."],["What mystery are scientists still studying?","How the route passes from one generation to the next","Why monarchs are orange","How fast monarchs fly","“the route is transmitted from one generation to the next”."],["What is the main idea of the last paragraph?","The number of monarchs is decreasing, and people are trying to help.","Monarchs travel 4,000 km.","Milkweed is a tasty plant.","Idea principal del último párrafo."]]}},"GLOSS":[["culture","cultura","the beliefs, customs, food, music and language of a group of people","Music and food are important parts of Mexican culture.","traditions",""],["immigration","inmigración","moving to live in a new country","Immigration brings people from many countries to Canada.","migration","emigration"],["opportunity","oportunidad","a good chance to do something","Moving to Chicago gave Sofía the opportunity to learn English.","chance",""],["transition","transición","a change from one situation to another","The transition to a new school was hard at first.","change",""],["adapt","adaptar o adaptarse","to change so you can fit a new place or situation","Amir adapted to the cold winter.","adjust","resist"],["diversity","diversidad","many different kinds of people or things","Our class has great diversity: we speak six languages.","variety","sameness"],["identity","identidad","who a person is: the culture, language, values and experiences that make you yourself","Speaking two languages is part of Sofía's identity.","self",""],["society","sociedad","a large group of people who live together and share rules","Everyone has a role in society.","community",""],["assume","suponer o asumir","to think something is true without proof","Don't assume the new student can't speak English.","suppose","prove"],["event","acontecimiento o evento","something that happens, often something important","The first event in the myth is the suns' disobedience.","happening",""],["explanation","explicación","words that make something clear","The teacher gave a clear explanation of the myth.","reason",""],["transmit","transmitir","to send or pass something from one person or place to another","Grandparents transmit stories to their grandchildren.","pass on","receive"],["energy","energía","the power to move or do work","Monarchs glide to save energy.","power",""],["obstacle","obstáculo","something that blocks your way or makes things difficult","The language was Sofía's biggest obstacle.","barrier","advantage"],["decrease","disminuir","to become smaller or less","After Yi's arrows, the heat began to decrease.","reduce","increase"]],"U":[{"id":"g5-1","t":"Reading Comprehension & Main Ideas","es":"Comprensión lectora e ideas principales","can":"I read accurately, at an appropriate rate and with expression. I identify the main ideas and use my own words to summarize information.","tips":["Re-read the texts from Units 1 and 2.","Practice identifying the main idea, key details, the sequence of events and cause-and-effect relationships.","After reading, explain the most important information in your own words."],"tg":["Activa conocimientos: pregunta qué hacen cuando no entienden un texto y anota estrategias en el pizarrón.","Modela con «A New Home in Chicago»: lee en voz alta, subraya la idea principal y dos detalles; marca palabras de secuencia y de causa-efecto.","Práctica guiada: proyecta la parada «Sequence & cause» y resuélvanla en equipos.","Fluidez: en parejas, uno lee un párrafo y el otro mide el tiempo con la parada «Fluency». Cierren con un resumen oral de 3 oraciones."],"g":["Reading strategies",[["Main idea","<p>The <b>main idea</b> is what the whole text is mostly about. Ask: <i>Who or what is the text about? What is the most important thing the author says?</i></p><p class=\"es\">La idea principal es de qué trata todo el texto.</p>","<b>Main idea:</b> Sofía faced challenges in a new country, but she adapted."],["Key details","<p><b>Details</b> support the main idea: names, places, numbers, examples and reasons.</p><p class=\"es\">Los detalles apoyan la idea principal.</p>","<b>Detail:</b> Grace helped Sofía with new words."],["Sequence of events","<p>The <b>sequence</b> is the order in which events happen. Signal words: <b>first, then, next, after that, finally, by the end</b>.</p><p class=\"es\">La secuencia es el orden de los sucesos.</p>","<b>First</b> the family moved. <b>Then</b> Sofía felt shy. <b>Finally</b> she read chapter books."],["Cause and effect","<p>A <b>cause</b> is why something happens; the <b>effect</b> is what happens. Signal words: <b>because, so, as a result, since</b>.</p><p class=\"es\">Causa: por qué pasa. Efecto: lo que pasa.</p>","The temperature decreases (<b>cause</b>), <b>so</b> monarchs fly south (<b>effect</b>)."],["Summarize in your own words","<p>A <b>summary</b> tells only the most important ideas, in order and in <b>your own words</b>. Answer: <b>Who? What? Why? How does it end?</b></p><p class=\"es\">Resumir es contar lo importante con tus palabras.</p>","Sofía moved to Chicago, struggled with English, adapted with a friend's help and kept her culture."]]],"v":"main idea:idea principal|detail:detalle|sequence:secuencia|cause:causa|effect:efecto|summary:resumen|opportunity:oportunidad|obstacle:obstáculo","q":[["mc","Signal words like “first”, “then” and “finally” show…","sequence",["cause and effect","the main idea"],"<b>first, then, finally</b> indican secuencia."],["mc","“The rivers dried up because ten suns were in the sky.” What is the cause?","Ten suns were in the sky.",["The rivers dried up.","The people prayed."],"La causa es lo que provoca el efecto."],["mc","Which detail supports the main idea “Sofía adapted to her new life”?","She read chapter books in English by the end of the year.",["Her father worked in a bakery.","Her grandmother lives in Oaxaca."],"Ese detalle demuestra que se adaptó."],["mc","A good summary…","tells the most important ideas in your own words.",["copies every sentence of the text.","gives your opinion about the author."],"Resumir = ideas importantes + tus palabras."],["mc","Why do monarchs glide on warm air currents?","To save energy.",["To find milkweed.","To escape from storms."],"“To save energy, monarchs glide…”"],["mc","What is the main idea of “The Great Monarch Journey”?","Monarchs make a long, difficult migration to survive the winter.",["Monarchs are orange and black.","Milkweed is a plant."],"Todo el texto trata del viaje."],["seq","Put the events of Sofía's story in order.",["Sofía's family moves from Oaxaca to Chicago.","Sofía is afraid to speak at school.","Grace helps Sofía with new words.","Sofía reads chapter books in English."],"Sigue las pistas: the first months → little by little → by the end of the year."],["match","Match each cause with its effect.",[["The temperature decreases in autumn.","Monarchs fly south."],["Forests are being cut down.","The number of monarchs decreases."],["Sofía was afraid of making mistakes.","She sat quietly in class."],["Grace helped Sofía with new words.","Sofía's English improved."]],"Cada causa provoca un efecto."],["gap","The ___ idea is what the whole text is mostly about.","main","<b>main idea</b> = idea principal."]],"st":[{"k":"read1","t":"read","n":"Reading: Sofía","text":"sofia"},{"k":"read2","t":"read","n":"Reading: Monarchs","text":"monarchs"},{"k":"seq","t":"quiz","n":"Sequence & cause","qs":[["seq","Put the events of the myth in order.",["The ten suns take turns crossing the sky.","The suns rise together and the Earth burns.","Di Jun sends Yi to help.","Yi shoots down nine suns.","Di Jun punishes Yi."],"Orden del mito."],["seq","Put the monarchs' journey in order.",["The days get shorter and colder.","Monarchs fly south to Mexico.","They rest in the fir forests all winter.","Their children and grandchildren fly north in spring."],"Orden del viaje."],["match","Match each cause with its effect.",[["The ten suns rose together.","Rivers dried up and crops burned."],["Yi shot nine suns.","The heat began to decrease."],["Amir joined the soccer team.","He started talking with his teammates."],["Lucas taught Amir to skate.","Winter became Amir's favourite season."]],"Causa → efecto."],["match","Match each signal word with its job.",[["first","starts a sequence"],["because","gives a cause"],["as a result","gives an effect"],["finally","ends a sequence"]],"Palabras señal."],["mc","“It was very cold, so Amir wore three sweaters.” What is the effect?","Amir wore three sweaters.",["It was very cold.","Amir learned to skate."],"Después de <b>so</b> viene el efecto."],["mc","Which question helps you find the main idea?","What is the whole text mostly about?",["How many paragraphs are there?","What colour is the cover?"],"Pregunta clave de la idea principal."]]},{"k":"sum","t":"write","n":"Summary","tasks":["Write a summary of “A New Home in Chicago” in your own words: who, what, why and how it ends.","Write a summary of “The Great Monarch Journey” in your own words."],"words":[40,90]}]},{"id":"g5-2","t":"Compare and Contrast","es":"Comparación y contraste de ideas","can":"I connect, compare and contrast ideas, topics and situations in different texts.","tips":["Review the texts about migration and cultural experiences.","Practice finding similarities and differences between characters, experiences, settings and ideas.","Use a Venn diagram or a comparison chart to organize the information."],"tg":["Dibuja un diagrama de Venn gigante en el pizarrón con los nombres Sofía y Amir.","Lean «A New Home in Chicago» y «Amir's First Winter» (parada «Two readings») y pidan a cada equipo tres datos de cada niño.","Proyecta la parada «Venn diagram» y clasifiquen las ideas en grupo; discutan las que generen dudas.","Cierre: escriban un párrafo con both, also, however y unlike (parada «Compare paragraph»)."],"g":["Comparing texts",[["Compare and contrast","<p>To <b>compare</b> is to find how things are <b>alike</b> (similarities). To <b>contrast</b> is to find how they are <b>different</b> (differences).</p><p class=\"es\">Comparar: semejanzas. Contrastar: diferencias.</p>","Sofía <b>and</b> Amir both moved to a new country. <b>However</b>, Sofía moved for a job and Amir moved to be safe."],["What can you compare?","<ul><li><b>Characters:</b> age, feelings, goals</li><li><b>Experiences:</b> problems and solutions</li><li><b>Settings:</b> where and when</li><li><b>Ideas:</b> the message of each text</li></ul>","Setting: Chicago, USA vs. Toronto, Canada."],["Venn diagram","<p>Two circles that overlap. Write the differences in the outer parts and the similarities in the middle. A <b>comparison chart</b> uses columns instead.</p><p class=\"es\">En el centro va lo que comparten.</p>","Middle: <i>both found English difficult at first</i>."],["Signal words","<p>Alike: <b>both, also, too, similarly, in the same way</b>. Different: <b>but, however, on the other hand, while, unlike</b>.</p>","<b>Unlike</b> Sofía, Amir joined a soccer team."]]],"v":"culture:cultura|immigration:inmigración|diversity:diversidad|transition:transición|society:sociedad|similar:parecido|different:diferente|both:ambos","q":[["mc","How are Sofía and Amir alike?","Both found English difficult at first.",["Both moved to Canada.","Both joined a soccer team."],"Es una semejanza entre los dos textos."],["mc","How are their reasons for moving different?","Sofía's family moved for a job; Amir's family moved to be safe from war.",["Both families moved because of war.","Both families moved for a job."],"Contraste: oportunidad vs. seguridad."],["mc","Which signal word shows a difference?","however",["both","also"],"<b>however</b> = contraste."],["mc","Which signal word shows a similarity?","similarly",["unlike","but"],"<b>similarly</b> = semejanza."],["mc","In a Venn diagram, where do you write the similarities?","In the middle, where the circles overlap.",["In the left circle only.","Outside the circles."],"El centro es lo que comparten."],["mc","Who helped Amir adapt to winter?","His teammate Lucas",["His classmate Grace","His grandmother"],"Lucas le enseñó a patinar."],["mc","How do both children keep their culture alive?","Sofía hears family stories; Amir cooks traditional food and teaches Arabic words.",["Both stopped speaking their first language.","Both visit their country every month."],"Ambos conservan su cultura."],["mc","Which setting is different in the two texts?","Chicago in the USA and Toronto in Canada",["Both live in Chicago","Both live in Oaxaca"],"Contraste de escenario."],["gap","___ Sofía, Amir joined a sports team.","Unlike","<b>Unlike</b> = a diferencia de."]],"st":[{"k":"read","t":"read","n":"Two readings","texts":["sofia","amir"]},{"k":"venn","t":"quiz","n":"Venn diagram","qs":[["venn","Sofía or Amir? Sort each idea into the Venn diagram.",["Only Sofía","Both","Only Amir"],[["Moved from Mexico to the United States",0],["Found English difficult at first",1],["Left his country because of war",2],["Got help from a classmate",1],["Taught a classmate to make tortillas",0],["Joined the school soccer team",2]],"Las diferencias van afuera y las semejanzas en el centro."],["venn","Sort these ideas, too.",["Only Sofía","Both","Only Amir"],[["Her father found a job in a bakery",0],["Had to get used to a cold winter",1],["Learned to skate",2],["Keeps their culture alive",1],["Hears family stories from her grandmother",0],["Teaches friends words in Arabic",2]],"Revisa los dos textos."],["sort","Comparison chart: is it about the setting, a character or an experience?",["Setting","Character","Experience"],[["Toronto, Canada",0],["Sofía is ten years old",1],["Learning a new language",2],["Chicago in winter",0],["Amir is a fast learner",1],["Starting at a new school",2]],"Una tabla organiza la comparación por categorías."]]},{"k":"cmp","t":"quiz","n":"Alike or different?"},{"k":"write","t":"write","n":"Compare paragraph","tasks":["Write a paragraph comparing and contrasting Sofía and Amir. Include two similarities and two differences.","Compare your own experience at a new school or place with Sofía's or Amir's experience."],"words":[50,110]}]},{"id":"g5-3","t":"Character Analysis","es":"Análisis de personajes","can":"I analyze characters' traits, relationships, conflicts, roles and changes throughout a story.","tips":["Review the reading “Ten Suns: A Chinese Myth”.","Review the character activities you did in class.","Practice identifying: character, role, function and conflict.","Explain how the characters' actions or decisions affect the events of the story."],"tg":["Pregunta: ¿qué hace que un personaje sea héroe o villano? Anota ideas.","Lean juntos «Ten Suns: A Chinese Myth» con la voz del lector en la parada «Reading: Ten Suns».","Construyan en el pizarrón la tabla Character · Role · Function · Conflict y compárenla con la parada «Character map».","Discusión: ¿fue justa la decisión de Di Jun? Cada alumno escribe cómo una decisión de Yi cambió la historia."],"g":["Characters in a story",[["Character","<p>A <b>character</b> is a person, animal or creature in a story. Describe characters with <b>traits</b>: brave, proud, angry, wise…</p><p class=\"es\">Personaje y rasgos.</p>","<b>Yi</b> is brave and skilful."],["Role","<p>The <b>role</b> is the character's place in the story: <b>protagonist</b> (main character), <b>antagonist</b> (causes problems for the protagonist) or <b>secondary character</b>.</p><p class=\"es\">Papel o rol.</p>","In “Ten Suns”, Yi is the protagonist."],["Function","<p>The <b>function</b> is what the character <b>does</b> for the plot: starts the problem, helps, solves it, teaches a lesson…</p><p class=\"es\">Función en la historia.</p>","The ten suns <b>start the problem</b>; Yi <b>solves</b> it."],["Conflict","<p>The <b>conflict</b> is the problem or struggle. It can be between characters, with nature or inside a character.</p><p class=\"es\">Conflicto.</p>","Yi must save the people, but Di Jun told him not to hurt his sons."],["Actions and change","<p>Characters' <b>actions and decisions</b> cause events. Notice how characters <b>change</b> from the beginning to the end.</p><p class=\"es\">Las decisiones cambian la historia.</p>","Yi's decision saved the Earth, but he could never return to heaven."]]],"v":"character:personaje|role:papel, rol|protagonist:protagonista|conflict:conflicto|trait:rasgo|myth:mito|archer:arquero|punishment:castigo","q":[["mc","Who is the protagonist of “Ten Suns”?","Yi",["Di Jun","Emperor Yao"],"Yi es el héroe y el personaje principal."],["mc","What is the main conflict of the myth?","Ten suns burn the Earth and someone must stop them.",["Yi wants to become an emperor.","Xi He loses her chariot."],"Es el problema central."],["mc","What is the function of the ten suns in the story?","They cause the problem by disobeying.",["They save the people.","They punish Yi."],"Su función: iniciar el problema."],["mc","Why did Yi keep one sun in the sky?","So the world would not be dark and cold.",["Because he ran out of arrows.","Because Di Jun asked him to."],"Detalle del texto."],["mc","How did Yi's decision affect the end of the story?","He saved the Earth, but he could not return to heaven.",["He became the Emperor of the East.","The suns thanked him."],"Acción → consecuencia."],["mc","How do the suns change in the story?","They go from obedient to disobedient.",["They go from angry to kind.","They do not change."],"Al inicio obedecen; luego desobedecen."],["mc","Which trait best describes Yi?","brave",["lazy","cruel"],"Se enfrentó a los soles."],["mc","What inner conflict does Di Jun have?","He wants to help the people, but he loves his sons.",["He is afraid of Yi's bow.","He cannot find the mulberry tree."],"Conflicto interno."],["match","Match each character with their function.",[["Yi","Solves the problem by shooting nine suns"],["The ten suns","Cause the problem by rising together"],["Di Jun","Sends help and later punishes the hero"],["Xi He","Keeps order: one sun crosses the sky each day"],["Emperor Yao","Asks the gods for help for his people"]],"La función es lo que hace cada personaje por la trama."]],"st":[{"k":"read","t":"read","n":"Reading: Ten Suns","text":"suns"},{"k":"map","t":"quiz","n":"Character map","qs":[["sort","Is each character a protagonist, an antagonist or a secondary character?",["Protagonist","Antagonist","Secondary"],[["Yi",0],["The ten suns",1],["Di Jun",2],["Xi He",2],["Emperor Yao",2]],"El protagonista resuelve; el antagonista causa el problema."],["match","Match each character with their function.",[["Yi","Solves the problem by shooting nine suns"],["The ten suns","Cause the problem by rising together"],["Di Jun","Sends help and later punishes the hero"],["Xi He","Keeps order: one sun crosses the sky each day"],["Emperor Yao","Asks the gods for help for his people"]],"Función de cada personaje."],["match","Match each character with a trait from the text.",[["Yi","brave and skilful"],["The ten suns","bored and disobedient"],["Di Jun","proud and furious"],["The people","suffering and hopeful"]],"Rasgos con evidencia del texto."],["sort","What kind of conflict is it?",["Between characters","With nature","Inside a character"],[["Yi against the ten suns",0],["People against the terrible heat",1],["Di Jun: love for his sons or help for the people?",2],["Di Jun punishes Yi",0]],"Tipos de conflicto."]]},{"k":"act","t":"quiz","n":"Actions & effects"},{"k":"write","t":"write","n":"Character paragraph","tasks":["Describe Yi: his role, his function, his conflict and how his actions changed the story.","Choose one character from the myth and explain how their decisions affected the events."],"words":[50,110]}]},{"id":"g5-4","t":"Vocabulary & Word Meaning","es":"Vocabulario y significado de palabras","can":"I determine the meaning of unknown words and use academic and topic-specific vocabulary accurately.","tips":["Review the key words from Units 1 and 2.","Use the glossary.","Pay special attention to the 15 key words of the term.","Work out meanings from context, recognize synonyms and antonyms, and use the words in sentences."],"tg":["Reparte las 15 palabras en tarjetas; cada equipo busca la oración del texto donde aparece.","Modela pistas de contexto con «decrease» en «Ten Suns» (the heat began to decrease → cooled down).","Juego: Match Pairs o Speed Round del trimestre en pantalla grande (Arcade · 5.º Term 1).","Cierre: cada alumno escribe 5 oraciones propias con palabras clave (parada «My sentences»)."],"g":["Word detectives",[["Context clues","<p>When you find an unknown word, look at the words <b>around</b> it. Clues can be a <b>definition</b>, an <b>example</b>, a <b>synonym</b> or an <b>opposite</b>.</p><p class=\"es\">Pistas de contexto.</p>","The heat began to <b>decrease</b>; it became <i>less and less</i> hot."],["Synonyms and antonyms","<p><b>Synonyms</b> have the same or a similar meaning (decrease = reduce). <b>Antonyms</b> have opposite meanings (decrease ↔ increase).</p><p class=\"es\">Sinónimos y antónimos.</p>","adapt = adjust · transmit ↔ receive"],["Use the glossary","<p>The glossary at the back of <i>Reach Higher 5A</i> gives each key word's meaning. Read the definition, then make your own sentence.</p><p class=\"es\">Usa el glosario.</p>","<b>obstacle</b> (noun): something that blocks your way."],["Academic words","<p>Words like <b>identify, assume, explanation</b> and <b>event</b> appear in many subjects: science, history and reading.</p><p class=\"es\">Vocabulario académico.</p>","Can you <b>identify</b> the main event of the story?"]]],"v":"culture:cultura|immigration:inmigración|opportunity:oportunidad|transition:transición|adapt:adaptar o adaptarse|diversity:diversidad|identify:identificar|society:sociedad|assume:suponer o asumir|event:acontecimiento o evento|explanation:explicación|transmit:transmitir|energy:energía|obstacle:obstáculo|decrease:disminuir","q":[["mc","“Sofía's biggest obstacle was the language; it made school hard.” An obstacle is…","something that makes things difficult",["a new friend","a kind of food"],"Pista: <i>made school hard</i>."],["mc","“After Yi shot nine suns, the heat began to decrease, and the Earth cooled down.” Decrease means…","become less",["become more","stay the same"],"Pista: <i>cooled down</i>."],["mc","“Our class has great diversity: students come from six countries.” Diversity means…","many different kinds of people or things",["people who are all the same","a big classroom"],"Pista: <i>six countries</i>."],["mc","“Some children assumed Amir did not understand, but they had no proof.” Assume means…","think something is true without proof",["learn quickly","explain clearly"],"Pista: <i>no proof</i>."],["mc","“Grandparents transmit stories to their grandchildren, who later tell them to their own children.” Transmit means…","pass on",["forget","write"],"Pista: <i>later tell them</i>."],["mc","“The move was a great opportunity: a better job and a good school.” Opportunity means…","a good chance",["a problem","a trip"],"Pista: <i>better job, good school</i>."],["mc","Which word is a synonym of “society”?","community",["energy","event"],"society ≈ community."],["mc","Which word is an antonym of “adapt”?","resist",["adjust","change"],"Lo contrario de adaptarse es resistirse."],["gap","Plants need ___ from the sun to grow.","energy","<b>energy</b> = energía."],["gap","Rules help people live together in ___.","society","<b>society</b> = sociedad."],["match","Match each word with its synonym.",[["decrease","reduce"],["adapt","adjust"],["opportunity","chance"],["obstacle","barrier"],["identify","recognize"]],"Sinónimos."]],"st":[{"k":"ctx","t":"quiz","n":"Context clues","qs":[["mc","“The transition from summer to winter was hard for Amir, who had never seen snow.” Transition means…","a change from one situation to another",["a type of weather","a school subject"],"Pista: de verano a invierno."],["mc","“Monarchs glide on warm air to save energy for the long trip.” Energy means…","the power to move or do work",["a type of tree","the speed of the wind"],"Pista: <i>save … for the long trip</i>."],["mc","“The teacher gave a clear explanation, so everyone understood the myth.” Explanation means…","words that make something clear",["a long trip","a type of book"],"Pista: <i>everyone understood</i>."],["mc","“Can you identify the protagonist? Point to him and say his name.” Identify means…","recognize and name",["draw","forget"],"Pista: <i>point to him and say his name</i>."],["mc","“Immigration has brought people from Poland, India and Nigeria to Chicago.” Immigration means…","moving to live in a new country",["going on holiday","building a city"],"Pista: gente de otros países que llega."],["mc","“The first event in the story is the suns' disobedience; the next is the drought.” Event means…","something that happens",["a person","a place"],"Pista: <i>first… next…</i>."]]},{"k":"syn","t":"quiz","n":"Synonyms & antonyms","qs":[["match","Match each word with its synonym.",[["decrease","reduce"],["adapt","adjust"],["opportunity","chance"],["obstacle","barrier"],["identify","recognize"]],"Sinónimos: significado parecido."],["match","Match each word with its antonym.",[["decrease","increase"],["transmit","receive"],["diversity","sameness"],["assume","prove"]],"Antónimos: significado opuesto."],["sort","Synonym or antonym of “decrease”?",["Synonym","Antonym"],[["reduce",0],["lower",0],["drop",0],["increase",1],["grow",1],["rise",1]],"decrease = bajar."],["mc","Which word is a synonym of “transmit”?","pass on",["receive","forget"],"transmit ≈ pass on."]]},{"k":"use","t":"quiz","n":"Words in sentences","qs":[["gap","Moving to a new school is a big ___. Everything changes!","transition","<b>transition</b> = cambio de una situación a otra."],["gap","Mexican ___ includes music, food, language and traditions.","culture","<b>culture</b> = cultura."],["gap","Can you ___ the main idea of this paragraph?","identify","<b>identify</b> = identificar."],["gap","The teacher gave a clear ___ of the myth.","explanation","<b>explanation</b> = explicación."],["gap","The first ___ in the story is the family's trip to Chicago.","event","<b>event</b> = acontecimiento."],["gap","___ is when people move to live in a new country.","Immigration","<b>Immigration</b> = inmigración."],["gap","It takes time to ___ to a cold climate.","adapt","<b>adapt</b> = adaptarse."],["gap","A big rock in the road is an ___.","obstacle","<b>obstacle</b> = obstáculo."]]},{"k":"write","t":"write","n":"My sentences","tasks":["Write five sentences of your own, each one with a different key word of the term.","Write a short text about moving to a new place using at least five key words."],"words":[30,90]}]},{"id":"g5-5","t":"English Grammar","es":"Gramática inglesa","can":"I understand and correctly apply the rules of English grammar in sentences.","tips":["Review: complete subject, complete predicate, subject–verb agreement, kinds of sentences, questions with do/does, conjunctions, prepositions and interjections.","Practice identifying these elements and correcting sentences with grammar mistakes."],"tg":["Escribe una oración del mito y pide que separen con una línea el sujeto completo y el predicado completo.","Repasa las 8 tarjetas de la parada «Grammar cards» en pantalla grande; los alumnos dan un ejemplo de cada una.","Juego por equipos con «Find & fix»: el equipo que encuentre el error y lo corrija en voz alta gana el punto.","Cierre: «Sentence lab» en parejas y salida con una oración interrogativa con does."],"g":["Grammar cards",[["Complete subject · Sujeto completo","<p>The <b>complete subject</b> is <b>all the words</b> that tell <b>who or what</b> the sentence is about.</p>","<b>The ten bright suns</b> rose together."],["Complete predicate · Predicado completo","<p>The <b>complete predicate</b> is the verb and <b>all the words</b> that tell what the subject <b>does or is</b>.</p>","The ten bright suns <b>rose together in the sky</b>."],["Subject–verb agreement · Concordancia","<p>A <b>singular</b> subject (he, she, it, my family) takes a verb with <b>-s</b>. A <b>plural</b> subject (they, the children, Amir and Lucas) takes the verb <b>without -s</b>.</p>","My family <b>lives</b> in Chicago. The children <b>play</b> soccer."],["Kinds of sentences · Tipos de oraciones","<ul><li><b>Declarative</b>: tells something (.)</li><li><b>Interrogative</b>: asks (?)</li><li><b>Imperative</b>: gives an order or request (. or !)</li><li><b>Exclamatory</b>: shows strong feeling (!)</li></ul>","What an amazing journey<b>!</b>"],["Questions with do/does · Preguntas","<p><b>Do</b> + I/you/we/they. <b>Does</b> + he/she/it. After do/does, the verb has <b>no -s</b>.</p>","<b>Does</b> Sofía <b>speak</b> Spanish? Yes, she does."],["Conjunctions · Conjunciones","<p>Conjunctions join words or ideas: <b>and</b> (add), <b>but</b> (contrast), <b>or</b> (choice), <b>so</b> (result), <b>because</b> (reason).</p>","Amir was cold, <b>but</b> he loved skating."],["Prepositions · Preposiciones","<p>Prepositions show <b>place</b> (in, on, under, between), <b>time</b> (at, on, in, before, after) and <b>direction</b> (to, from, across, through).</p>","The suns rested <b>in</b> a giant tree."],["Interjections · Interjecciones","<p>An <b>interjection</b> shows a feeling: <b>Wow! Oh! Ouch! Hooray! Oops!</b> Use an exclamation mark or a comma after it.</p>","<b>Wow!</b> That butterfly is beautiful."]]],"v":"subject:sujeto|predicate:predicado|verb:verbo|agreement:concordancia|conjunction:conjunción|preposition:preposición|interjection:interjección|sentence:oración","q":[["mc","What is the complete subject? “My little brother from Monterrey loves soccer.”","My little brother from Monterrey",["brother","loves soccer"],"Todas las palabras que dicen de quién se habla."],["mc","What is the complete predicate? “Sofía's grandmother calls every Sunday.”","calls every Sunday",["Sofía's grandmother","grandmother calls"],"El verbo y todo lo que lo acompaña."],["mc","What kind of sentence is “Plant milkweed in your garden.”?","imperative",["declarative","interrogative"],"Da una instrucción."],["mc","What kind of sentence is “What a hot day!”?","exclamatory",["interrogative","imperative"],"Expresa una emoción fuerte."],["mc","“It was hot, ___ the rivers dried up.”","so",["but","or"],"<b>so</b> = resultado."],["mc","“Amir was cold, ___ he loved skating.”","but",["so","or"],"<b>but</b> = contraste."],["mc","“The suns rested ___ a giant mulberry tree.”","in",["at","on"],"Dentro de algo: <b>in</b>."],["mc","“School starts ___ 8 o'clock.”","at",["on","in"],"Horas: <b>at</b>."],["mc","Which word is an interjection? “Ouch! I hit my knee.”","Ouch",["hit","knee"],"Expresa dolor."],["mc","“___ Sofía speak Spanish at home?”","Does",["Do","Is"],"Sofía = she → <b>Does</b>."],["mc","“___ your friends play soccer?”","Do",["Does","Are"],"Plural → <b>Do</b>."],["mc","Which sentence has correct subject–verb agreement?","The children play in the park.",["The children plays in the park.","The child play in the park."],"Plural sin -s."],["spot","My brother play soccer every day.",2,"plays","Sujeto singular → <b>plays</b>."],["spot","Does Amir likes snow?",2,"like","Después de <b>does</b>, verbo sin -s."],["ord","Does Amir like the snow?","Does + sujeto + verbo base?"]],"st":[{"k":"id","t":"quiz","n":"Identify"},{"k":"fix","t":"quiz","n":"Find & fix","qs":[["spot","My brother play soccer every day.",2,"plays","Sujeto singular → <b>plays</b>."],["spot","The children plays in the park.",2,"play","Sujeto plural → <b>play</b>."],["spot","Does Amir likes snow?",2,"like","Después de <b>does</b>, verbo base: <b>like</b>."],["spot","the ten suns rose together.",0,"The","Mayúscula al inicio."],["spot","Amir and Lucas is good friends.",3,"are","Sujeto plural → <b>are</b>."],["spot","Do Sofía speak Spanish at home?",0,"Does","Sofía = she → <b>Does</b>."],["spot","We have English class at Monday.",4,"on","Días de la semana → <b>on</b>."],["spot","Sofía was nervous, or she didn't speak English.",3,"because","Razón → <b>because</b>."],["spot","Where do the monarchs goes in winter?",4,"go","Después de <b>do</b>, verbo base: <b>go</b>."],["spot","My family live in Chicago.",2,"lives","<i>My family</i> es singular → <b>lives</b>."]]},{"k":"lab","t":"quiz","n":"Sentence lab","qs":[["sort","What kind of sentence is each one?",["Declarative","Interrogative","Imperative","Exclamatory"],[["Monarchs fly to Mexico.",0],["Where do monarchs go in winter?",1],["Plant milkweed in your garden.",2],["What an amazing journey!",3],["Please close the door.",2],["Did Yi save the Earth?",1]],"Fíjate en la intención y la puntuación."],["sort","Is it a complete subject or a complete predicate?",["Subject","Predicate"],[["The monarch butterflies",0],["fly to Mexico every autumn",1],["The greatest archer in heaven",0],["shot nine suns",1],["Our diverse class",0],["speaks six languages",1]],"Sujeto: quién. Predicado: qué hace."],["sort","What does each preposition show?",["Place","Time","Direction"],[["under the bed",0],["at 8 o'clock",1],["to Mexico",2],["in a giant tree",0],["on Monday",1],["across the sky",2]],"Lugar, tiempo o dirección."],["match","Match each conjunction with its job.",[["and","adds an idea"],["but","shows contrast"],["or","gives a choice"],["so","shows a result"],["because","gives a reason"]],"Conjunciones."],["mc","Which interjection fits? “___! I dropped all my books.”","Oops",["Hooray","Yum"],"<b>Oops</b> = ups."]]}]},{"id":"g5-6","t":"Writing with Evidence","es":"Expresión escrita y redacción","can":"I write organized texts using information and evidence from the readings.","tips":["Practice writing complete sentences.","Include a clear main idea.","Add details or evidence that support that idea.","Organize your ideas logically.","Before finishing, check: complete subject and predicate, subject–verb agreement, verb tense, capital letters, punctuation and spelling."],"tg":["Muestra un párrafo modelo y colorea: oración principal (verde), detalles y evidencia (amarillo), cierre (azul).","Proyecta «Paragraph builder» y ordenen el párrafo entre todos.","Escritura individual en la parada «My paragraph»; el checklist en vivo guía la extensión, la evidencia y las mayúsculas.","Revisión entre pares con la lista: subject & predicate, agreement, tense, capitals, punctuation, spelling."],"g":["Writing a paragraph",[["Complete sentences","<p>Every sentence needs a <b>complete subject</b> and a <b>complete predicate</b>, starts with a <b>capital letter</b> and ends with <b>punctuation</b>.</p><p class=\"es\">Oraciones completas.</p>","✗ <i>Rest in Mexico.</i> ✓ <b>The monarchs rest in Mexico.</b>"],["Main idea: the topic sentence","<p>Start your paragraph with a clear <b>topic sentence</b>: it tells the main idea.</p><p class=\"es\">Oración principal.</p>","Yi was a brave hero who saved the Earth, but he paid a high price."],["Details and evidence","<p>Support the main idea with 2 or 3 <b>details</b> and <b>evidence from the text</b>. Use: <b>In the text, … / For example, … / The author says …</b></p><p class=\"es\">Detalles y evidencia de la lectura.</p>","<b>For example</b>, Yi shot nine suns so the heat would decrease."],["Logical order","<p>Organize your ideas: <b>topic sentence → details → closing sentence</b>. Use transitions: <b>first, also, then, finally, in conclusion</b>.</p><p class=\"es\">Orden lógico.</p>","<b>In conclusion</b>, Yi's choice saved the world."],["Revise before you finish","<ul><li>Complete subject and predicate</li><li>Subject–verb agreement</li><li>Verb tense</li><li>Capital letters</li><li>Punctuation</li><li>Spelling</li></ul><p class=\"es\">Revisa antes de entregar.</p>","Read your paragraph aloud and check each item."]]],"v":"topic sentence:oración principal|detail:detalle|evidence:evidencia|closing sentence:oración de cierre|capital letter:mayúscula|punctuation:puntuación|spelling:ortografía|verb tense:tiempo verbal","q":[["mc","Which is the best topic sentence for a paragraph about Yi?","Yi was a brave hero who saved the Earth, but he paid a high price.",["Yi had a red bow.","There were ten suns."],"Expresa la idea principal del párrafo."],["mc","Which sentence gives evidence from the text?","In the text, the rivers dried up and the crops burned.",["I think the suns were bad.","Myths are my favourite stories."],"La evidencia viene de la lectura."],["mc","Which is a complete sentence?","The monarchs rest in Mexico.",["Rest in Mexico.","The monarchs in Mexico."],"Sujeto + predicado."],["mc","Which sentence uses capital letters and punctuation correctly?","Sofía lives in Chicago, Illinois.",["sofía lives in chicago, illinois","Sofía lives in chicago illinois."],"Nombres propios con mayúscula y punto final."],["mc","Which sentence uses the correct verb tense? (The story happened in the past.)","Yi shot nine suns.",["Yi shoots nine suns yesterday.","Yi will shoot nine suns last year."],"Pasado: <b>shot</b>."],["mc","Which is the best closing sentence?","In conclusion, Sofía and Amir both found a new home and kept their cultures.",["Amir likes snow.","First, Sofía moved to Chicago."],"Cierra y resume."],["spot","Yesterday Amir learn to skate.",2,"learned","Pasado: <b>learned</b>."],["spot","The monarchs travel to mexico.",4,"Mexico.","Los nombres propios llevan mayúscula."],["spot","Sofía's grandmother tell stories every Sunday.",2,"tells","Sujeto singular → <b>tells</b>."]],"st":[{"k":"build","t":"quiz","n":"Paragraph builder","qs":[["seq","Put the paragraph in a logical order.",["Sofía and Amir had similar experiences when they moved to a new country.","First, both of them found English difficult at the beginning.","For example, Amir could only say “hello” and “thank you” on his first day.","Also, a classmate helped each of them adapt.","In conclusion, both children faced obstacles but found a new home."],"Oración principal → detalles con evidencia → cierre."],["mc","Which is the best topic sentence for a paragraph about Yi?","Yi was a brave hero who saved the Earth, but he paid a high price.",["Yi had a red bow.","There were ten suns."],"Expresa la idea principal."],["mc","Which sentence gives evidence from the text?","In the text, the rivers dried up and the crops burned.",["I think the suns were bad.","Myths are my favourite stories."],"Evidencia = información de la lectura."],["mc","Which is the best closing sentence?","In conclusion, Sofía and Amir both found a new home and kept their cultures.",["Amir likes snow.","First, Sofía moved to Chicago."],"El cierre resume."],["sort","What part of the paragraph is it?",["Topic sentence","Detail / evidence","Closing sentence"],[["Monarchs make an amazing journey every autumn.",0],["Some of them travel more than 4,000 kilometres.",1],["In the text, fir trees protect them from wind and rain.",1],["In conclusion, we must help monarchs survive.",2]],"Estructura del párrafo."]]},{"k":"rev","t":"quiz","n":"Revision lab"},{"k":"write","t":"write","n":"My paragraph","tasks":["Write a paragraph comparing Sofía and Amir. Use evidence from both texts.","Write a paragraph explaining how Yi's actions changed the events of “Ten Suns”.","Write a paragraph about why monarch butterflies migrate. Use evidence from the article."],"words":[60,130]}]}]};

/* Banderines (bunting) dibujados en canvas como fondo */
function buntingURL() {
  const W = 336, H = 52, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const cols = ['#d7263d', '#ffffff', '#1d3a70', '#d7263d', '#ffffff', '#1d3a70'];
  x.strokeStyle = 'rgba(29,58,112,.45)'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 4); for (let i = 0; i <= 6; i++) x.quadraticCurveTo(i * 56 - 28, 12, i * 56, 4); x.stroke();
  for (let i = 0; i < 6; i++) { const x0 = i * 56 + 6, w = 44; x.fillStyle = cols[i]; x.strokeStyle = 'rgba(29,58,112,.18)'; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(x0, 7); x.lineTo(x0 + w, 7); x.lineTo(x0 + w / 2, 46); x.closePath(); x.fill(); x.stroke(); }
  return c.toDataURL();
}

let AC = null;
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .12, type = 'sine', v = .1, when = 0, f2) {
  if (!CFG.snd) return; const a = actx(); if (!a) return; const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const SFX = {
  ok() { tone(660, .12, 'triangle', .13); tone(990, .2, 'triangle', .13, .1); }, bad() { tone(220, .25, 'sawtooth', .06, 0, 140); }, pop() { tone(520, .07, 'triangle', .1, 0, 880); },
  coin() { tone(988, .08, 'square', .05); tone(1318, .16, 'square', .05, .07); }, tap() { tone(440, .05, 'triangle', .07); }, whoosh() { tone(300, .25, 'sine', .07, 0, 900); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .12, i * .11)); tone(1047, .5, 'triangle', .1, .45); },
};

/* =================== Voz: pronunciación con la síntesis del navegador =================== */
const HAS_TTS = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
let VOICES = [];
function loadVoices() { try { VOICES = speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; } }
if (HAS_TTS) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) { } }
function voiceFor(lang) {
  const L = lang.toLowerCase(), base = L.slice(0, 2), list = VOICES.filter(v => (v.lang || '').replace('_', '-').toLowerCase() === L);
  return list.find(v => /natural|online|google|premium|enhanced/i.test(v.name)) || list[0] || VOICES.find(v => (v.lang || '').toLowerCase().startsWith(base));
}
// Encadena frases en inglés o en español; onend se llama al terminar la última
function speakSeq(parts, onend) {
  if (!HAS_TTS) { if (onend) setTimeout(onend, 600); return false; }
  try { speechSynthesis.cancel(); } catch (e) { }
  const list = parts.filter(p => p && p.text && p.text.trim()); if (!list.length) { if (onend) onend(); return true; }
  list.forEach((p, i) => { const u = new SpeechSynthesisUtterance(plain(p.text)); const lang = p.lang === 'es' ? 'es-MX' : CFG.acc; u.lang = lang; const v = voiceFor(lang); if (v) u.voice = v; u.rate = (p.rate || 1) * (p.lang === 'es' ? 1 : CFG.rate);
    if (i === list.length - 1 && onend) { u.onend = onend; u.onerror = e => { if (e && e.error !== 'interrupted' && e.error !== 'canceled') onend(); }; } speechSynthesis.speak(u); });
  return true;
}
function say(text, slow) { if (!HAS_TTS) { toast('Tu navegador no tiene voz sintetizada. Prueba con Chrome, Edge o Safari.'); return; } speakSeq([{ text, lang: 'en', rate: slow ? .7 : 1 }]); }
function stopVoice() { if (HAS_TTS) try { speechSynthesis.cancel(); } catch (e) { } }
const sayBtn = (text, cls = '') => HAS_TTS ? `<button class="say ${cls}" type="button" data-say="${esc(plain(text))}" aria-label="Escuchar: ${esc(plain(text))}" title="Escuchar">${ic('sound')}</button>` : '';
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) { e.stopPropagation(); say(b.dataset.say, b.dataset.slow); } }, true);

let toastT = null;
function toast(html, cls = '') { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.className = 'toast ' + cls; t.innerHTML = html; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
function modal(html, cls = '') { closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card ${cls}" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-mclose]')) closeModal(); }); const f = m.querySelector('input,button'); if (f) setTimeout(() => f.focus(), 30); return m.firstElementChild; }

function confetti(n = 120) {
  const cv = $('#fx'); if (!cv || REDUCED) return; const x = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#e5383b', '#ffb703', '#0fa3b1', '#7a4ff0', '#2f6fff', '#16245f'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight * .35, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 5, c: pickR(cols), a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now(); const step = () => { x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.vx *= .99; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c;
    x.beginPath(); x.moveTo(-p.r, -p.r / 2); x.lineTo(p.r, -p.r / 2); x.lineTo(0, p.r); x.closePath(); x.fill(); x.restore(); });
    if (performance.now() - t0 < 2300) requestAnimationFrame(step); else x.clearRect(0, 0, cv.width, cv.height); }; step();
}

function glossQs(n, tag) { const G = shuffle(G5.GLOSS); return G.slice(0, n).map((g, j) => { const o = shuffle(G5.GLOSS.filter(x => x !== g)).slice(0, 2);
  return j % 2 ? { k: 'vm', w: [g[0], g[2]], opts: shuffle([g[2], ...o.map(x => x[2])]), tag } : { k: 'vr', w: [g[0], `${g[1]} · ${g[2]}`], opts: shuffle([g[0], ...o.map(x => x[0])]), tag }; }); }
function g5Build(i, kind) {

  const TCOL = ['#e5383b', '#2f6fff', '#12a05c', '#f77f00', '#7a4ff0', '#0fa3b1'], TN = ['Red', 'Blue', 'Green', 'Orange', 'Purple', 'Teal'];
  const draw = () => { box.innerHTML = `<div class="jboard">${G5IND.map((d, i) => `<div class="jcol" style="${g5c(i)}"><b class="jh">${esc(d[0])}</b>${[100, 200, 300, 400].map((v, k) => `<button class="jcell" type="button" data-j="${i}-${k}" ${JB.used[i + '-' + k] ? 'disabled' : ''}>${JB.used[i + '-' + k] ? '✓' : v}</button>`).join('')}</div>`).join('')}</div>
      <div class="teams">${KIT.teams.map((p, i) => `<div class="team" style="background:${TCOL[i]}"><b>${TN[i]} team</b><div class="pts">${p}</div></div>`).join('')}</div>
      <div class="g-row"><button class="btn sm blanco" type="button" data-jnew>${ic('reset')} Nuevo tablero</button><button class="btn sm blanco" type="button" data-jzero>Reiniciar puntos</button><button class="btn sm blanco" type="button" data-kit>${ic('clock')} Kit de clase</button></div>
      <p class="hint-l" style="text-align:center">Los equipos eligen categoría y valor. Lee la pregunta en voz alta, da 30 segundos y toca «Show answer». Suma los puntos al equipo que acertó.</p>`; };
  draw();
  box.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.j) { const [i, k] = b.dataset.j.split('-').map(Number), q = JB.cells[i][k]; if (!q) { toast('No hay más preguntas en esta categoría.'); return; } showJQ(i, k, q, (k + 1) * 100, TCOL, TN, draw); }
    if ('jnew' in b.dataset) { JB = null; openJeopardy(true); } if ('jzero' in b.dataset) { KIT.teams = KIT.teams.map(() => 0); DB.set('teams', KIT.teams); draw(); } if ('kit' in b.dataset) openKit(); };
}
function showJQ(i, k, q, val, TCOL, TN, redraw) {
  const ans = q[0] === 'gap' ? q[2] : q[0] === 'spot' ? q[1].split(' ').map((x, j) => j === q[2] ? q[3] : x).join(' ') : q[0] === 'ord' ? q[1] : q[2];
  const body = q[0] === 'spot' ? `<p class="g-q">Find and fix the mistake:</p><p class="jq">${esc(q[1])}</p>` : q[0] === 'ord' ? `<p class="g-q">Put the words in order:</p><p class="jq">${esc(shuffle(q[1].replace(/[.?!]$/, '').split(' ')).join(' / '))}</p>`
    : q[0] === 'rd' ? `<p class="g-sub">From «${esc(q[5])}»</p><p class="jq">${esc(q[1])}</p><div class="opts">${shuffle([q[2], ...q[3]]).map(o => `<div class="opt">${esc(o)}</div>`).join('')}</div>` : q[0] === 'mc' ? `<p class="jq">${blank(q[1])}</p><div class="opts">${shuffle([q[2], ...q[3]]).map(o => `<div class="opt">${esc(o)}</div>`).join('')}</div>` : `<p class="jq">${blank(q[1])}</p>`;
  const c = modal(`<div class="jmodal" style="${g5c(i)}"><p class="kicker" style="color:var(--c)">${esc(G5IND[i][0])} · ${val} points</p>${body}
    <div class="row" style="margin:12px 0"><button class="btn cempa" type="button" data-show>${ic('eye')} Show answer</button>${sayBtn(q[0] === 'rd' ? q[1] : q[1].replace(/_{2,}/, 'blank'))}</div><div class="ans-box" hidden><b>${esc(ans)}</b> <span>${q[4] || ''}</span></div>
    <p class="g-sub">¿Qué equipo acertó?</p><div class="row">${KIT.teams.map((_, t) => `<button class="btn sm" style="--c:${TCOL[t]};--cd:${TCOL[t]}" type="button" data-win="${t}">${TN[t]}</button>`).join('')}<button class="btn sm blanco" type="button" data-win="-1">Nadie</button></div></div>`, 'wide');
  c.onclick = e => { const b = e.target.closest('button'); if (!b) return; if ('show' in b.dataset) { $('.ans-box', c).hidden = false; SFX.pop(); }
    if (b.dataset.win != null) { const t = +b.dataset.win; if (t >= 0) { KIT.teams[t] += val; DB.set('teams', KIT.teams); SFX.coin(); confetti(50); } JB.used[i + '-' + k] = 1; closeModal(); redraw(); } };
}

/* ---------- Tarjetas del glosario (flashcards) ---------- */
function g5Flash() {
  const box = gOpen('flash', 'Glossary flashcards · 5.º', 'voc'); let deck = shuffle(G5.GLOSS), i = 0, known = 0, again = []; gChips('');
  const draw = (flip) => { if (i >= deck.length) { if (again.length) { deck = shuffle(again); again = []; i = 0; toast('Repasemos las que faltaron.'); } else { box.innerHTML = `<div class="g-card g-end">${pip('wow')}<div class="big">${known}/${G5.GLOSS.length}</div><p class="g-sub">¡Repasaste las ${G5.GLOSS.length} palabras clave del trimestre!</p><div class="g-row"><button class="btn rosa" type="button" data-re>${ic('spin')} Otra vez</button><button class="btn blanco" type="button" data-list>Ver glosario completo</button></div></div>`; qAdd('game'); addXP(10, 'Glossary 5.º', 3); return; } }
    const g = deck[i]; gChips(chip('', `${i + 1} / ${deck.length}`));
    box.innerHTML = `<div class="flash ${flip ? 'flip' : ''}" role="button" tabindex="0" data-flip><div class="fin"><div class="ff front"><small>Key word</small><b>${esc(g[0])}</b><span>Toca para ver el significado</span></div>
      <div class="ff back"><b>${esc(g[0])}</b><p class="es">${esc(g[1])}</p><p>${esc(g[2])}</p><p class="ex">«${esc(g[3])}»</p><div class="phr">${g[4] ? `<span>Synonym: ${esc(g[4])}</span>` : ''}${g[5] ? `<span style="background:var(--bad-bg);color:var(--bad-d)">Antonym: ${esc(g[5])}</span>` : ''}</div></div></div></div>
      <div class="g-row">${sayBtn(g[0], 'big')}<button class="btn bad" type="button" data-no>↻ Repasar</button><button class="btn ok" type="button" data-yes>✓ Lo sabía</button></div>`;
    if (HAS_TTS && !flip) setTimeout(() => say(g[0]), 200); };
  box.onclick = e => { if (e.target.closest('[data-say]')) return; if (e.target.closest('[data-flip]')) { $('.flash', box).classList.toggle('flip'); SFX.tap(); return; }
    if (e.target.closest('[data-yes]')) { known++; i++; SFX.ok(); draw(); } if (e.target.closest('[data-no]')) { again.push(deck[i]); i++; SFX.bad(); draw(); }
    if (e.target.closest('[data-re]')) g5Flash(); if (e.target.closest('[data-list]')) g5Glossary(); };
  draw();
}
function g5Glossary() { modal(`<div class="row" style="justify-content:space-between"><h2>Glossary · Key Words</h2><button class="ib" type="button" data-mclose aria-label="Cerrar">${ic('close')}</button></div>
  <div class="tbl"><table class="gtable"><thead><tr><th>English</th><th>Español</th><th>Meaning · Example</th><th>Syn. / Ant.</th></tr></thead><tbody>${G5.GLOSS.map(g => `<tr><td><b>${esc(g[0])}</b> ${sayBtn(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}<br><i>${esc(g[3])}</i></td><td>${esc(g[4] || '—')} / ${esc(g[5] || '—')}</td></tr>`).join('')}</tbody></table></div>`, 'wide'); }

/* ---------- Sala de lectura y fluidez ---------- */
function g5Reading(id, fluency) {
  const T = G5.PT[id], words = T.x.split(/\s+/).length; const box = gOpen('read5', T.t, 'rw'); gChips(''); let t0 = 0, run = false, tm = 0;
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  box.innerHTML = `<div class="g-card" style="display:grid;gap:12px"><div class="read-h"><h3>${esc(T.t)}</h3>${HAS_TTS ? `<button class="btn sm turq" type="button" data-model>${ic('sound')} Escuchar modelo</button><button class="btn sm blanco" type="button" data-stopv>${ic('pause')}</button>` : ''}</div>
      <div class="texto en-txt big-read">${esc(T.x)}</div><p class="g-sub">${words} palabras</p></div>
    <div class="g-card" style="display:grid;gap:12px"><h3 style="font-size:22px">${ic('mic')} Fluency check · Lectura en voz alta</h3><p class="g-sub">Lee el texto en voz alta con buena expresión. Toca «Start» al empezar y «Stop» al terminar.</p>
      <div class="timer" id="fl-t">0:00</div><div class="g-row"><button class="btn cempa lg" type="button" data-fl>Start</button></div><div id="fl-r"></div>
      <ul class="checklist">${['Leí sin saltarme palabras (accuracy)', 'Leí a buen ritmo, ni muy rápido ni muy lento (rate)', 'Hice pausas en comas y puntos', 'Cambié la voz en diálogos y preguntas (expression)'].map(c => `<li><label><input type="checkbox"> ${esc(c)}</label></li>`).join('')}</ul></div>
    <div class="g-card" style="display:grid;gap:10px;text-align:center"><h3 style="font-size:22px">Comprehension questions</h3><p class="g-sub">Main idea, details, sequence, cause and effect.</p><div class="g-row"><button class="btn ok lg" type="button" data-qs>${ic('play')} Responder ${T.q.length} preguntas</button></div></div>`;
  box.onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.say) return;
    if ('model' in b.dataset) speakSeq(T.x.split('\n').map(p => ({ text: p, lang: 'en', rate: .95 }))); if ('stopv' in b.dataset) stopVoice();
    if ('qs' in b.dataset) { const i = G5.U.findIndex(u => g5Reads(u).includes(id)); runDuo({ Q: rdQ(id, Math.max(0, i)), css: g5c(Math.max(0, i)), custom: { noHearts: true, badge: '', back: () => openGuia5(), again: () => g5Reading(id),
      finish: s => { addXP(10, 'Reading: ' + T.t, 3); return `${pip('wow', 'mascota big')}<h1>Reading complete!</h1><p>${esc(T.t)}</p><div class="end-stats"><div class="es green"><small>Accuracy</small><b>${s.acc}%</b></div><div class="es blue"><small>Time</small><b>${fmt(s.secs)}</b></div><div class="es gold"><small>XP</small><b>10</b></div></div><div class="row" style="justify-content:center"><button class="btn ok lg" type="button" data-cont>Continue</button></div>`; } } }); }
    if ('fl' in b.dataset) { if (!run) { run = true; t0 = Date.now(); b.textContent = 'Stop'; tm = setInterval(() => { $('#fl-t').textContent = fmt(Math.round((Date.now() - t0) / 1000)); }, 250); GS.timers.push(tm); }
      else { run = false; clearInterval(tm); b.textContent = 'Start'; const sec = Math.max(1, (Date.now() - t0) / 1000), wpm = Math.round(words / (sec / 60)); g5st(); PR.g5flu = Math.max(PR.g5flu || 0, wpm); prSave();
        $('#fl-r').innerHTML = `<div class="fb ${wpm >= 90 && wpm <= 150 ? 'ok' : ''}" style="${wpm >= 90 && wpm <= 150 ? '' : 'background:var(--hint);color:var(--hint-fg)'}"><b>${wpm} palabras por minuto</b> · ${wpm < 70 ? 'Sigue practicando: vuelve a leer el texto dos veces más.' : wpm < 90 ? '¡Vas bien! Practica para ganar ritmo.' : wpm <= 150 ? '¡Muy buen ritmo! Cuida la expresión y las pausas.' : 'Muy rápido: baja la velocidad y cuida la expresión.'} <small>(Referencia orientativa: 90–150 ppm)</small></div>`; if (!PR.best['flu:' + id]) { PR.best['flu:' + id] = 1; addXP(8, 'Fluency', 2); } } } };
}

/* ---------- Página del apartado de 5.º ---------- */
function openGuia5() {
  if (!PR) return; setTab('guia5'); crumb('<b>5.º de primaria</b> · Study Guide'); stopVoice(); const st = g5st();
  const prog = G5.U.map((u, i) => { const N = g5Nodes(u, i); return [N.filter(([k]) => st[u.id] && st[u.id][k]).length, N.length]; });
  const all = prog.reduce((a, p) => a + p[0], 0), tot = prog.reduce((a, p) => a + p[1], 0), best = (PR.g5ex || []).reduce((a, x) => Math.max(a, x.g), 0);
  let gi = 0;
  const units = G5.U.map((u, i) => { const N = g5Nodes(u, i); let cur = N.find(([k]) => !(st[u.id] && st[u.id][k]));
    return `<section class="unit-b" style="${g5c(i)}"><header class="unit"><div><small>Indicator ${i + 1} · ${esc(G5IND[i][1])}</small><h3>${esc(u.t)}</h3><p>${esc(G5IND[i][3])}</p></div><button class="guide" type="button" data-g5tips="${i}">${ic('voc')}<span>Study tips</span></button>${prog[i][0] === prog[i][1] ? '<span class="crown">🏆</span>' : ''}</header>
      <div class="nodes">${N.map(([k, n, icn]) => { const done = st[u.id] && st[u.id][k], isCur = cur && cur[0] === k, x = OFFS[gi++ % 8];
        return `<div class="node-w" style="transform:translateX(${x}px)">${isCur ? '<span class="start-tip">START</span>' : ''}<button class="node ${done ? 'done' : ''} ${isCur ? 'cur' : ''} ${k === 'boss' ? 'trophy' : ''}" type="button" data-g5="${i}|${k}" aria-label="${esc(n)}"><span class="nlab">${esc(n)}</span>${ic(done && k !== 'boss' ? 'check' : icn)}</button></div>`; }).join('')}
        <div class="deco ${i % 2 ? 'left' : 'right'}">${G5ART[i] === 'flag' ? pip('feliz', 'mascota deco-pip') : ART[G5ART[i]]('deco-art')}</div></div></section>`; }).join('');
  page('guia5', `<div class="duo"><div class="duo-main">
    <section class="g5-hero"><div class="g5-paper"><p class="kicker">Study Guide · English</p><h1>5th Grade <span class="script">1st Trimester</span></h1><p class="g5-yr">Ciclo escolar 2026–2027</p>
      <p class="g5-mat"><b>Material:</b> Reach Higher 5A Student's Book · Reach Higher 5A Practice Book · English Notebook</p>
      <div class="sec-prog"><span class="bar"><i style="width:${all / tot * 100}%"></i></span><em>${all} / ${tot} actividades</em></div>
      <div class="row" style="gap:8px"><button class="btn ok lg" type="button" data-g5exam>${ic('grad')} Examen de práctica</button><button class="btn blanco" type="button" data-g5table>${ic('prog')} Ver la guía</button></div>
      ${best ? `<p class="g5-best">Mejor calificación en el examen de práctica: <b>${best.toFixed(1)}</b> / 10</p>` : ''}</div>${ART.scene('scene g5-scene')}</section>
    <section class="g5-tools">
      ${[['flash', 'Glossary flashcards', '15 Key Words con audio, significado, sinónimos y antónimos', 'voc', 3], ['read', 'Reading room', '4 lecturas con audio, preguntas y medidor de fluidez', 'book', 0], ['jeop', 'Quiz show por equipos', 'Tablero tipo Jeopardy de los 6 indicadores para jugar en clase', 'trophy', 4], ['exam', 'Examen de práctica', '20 preguntas, calificación sobre 10 y qué repasar', 'grad', 5]].map(([k, n, d, icn, ci]) => `<button class="tool" type="button" data-tool="${k}" style="${g5c(ci)}"><span class="ti">${ic(icn)}</span><b>${n}</b><small>${d}</small></button>`).join('')}
    </section>
    <h2 class="hub-h">Ruta de estudio por indicador</h2>
    <div class="path">${units}</div>
  </div>${railHTML()}</div>`);
  $('#home').onclick = e => {
    const n = e.target.closest('[data-g5]'); if (n) { const [i, k] = n.dataset.g5.split('|'); g5Start(+i, k); return; }
    const tp = e.target.closest('[data-g5tips]'); if (tp) { g5Tips(+tp.dataset.g5tips); return; }
    if (e.target.closest('[data-g5exam]')) { g5Exam(); return; } if (e.target.closest('[data-g5table]')) { g5Table(); return; }
    const t = e.target.closest('[data-tool]'); if (t) { const k = t.dataset.tool; if (k === 'flash') g5Flash(); else if (k === 'jeop') openJeopardy(); else if (k === 'exam') g5Exam(); else g5ReadMenu(); return; }
    railClick(e); };
}
function g5ReadMenu() { const c = modal(`<div class="row" style="justify-content:space-between"><h2>Reading room</h2><button class="ib" type="button" data-mclose aria-label="Cerrar">${ic('close')}</button></div><p style="color:var(--muted)">Textos de práctica sobre los temas de las Unidades 1 y 2 (migración, experiencias culturales, mitos). Repasa también las lecturas originales de tu libro Reach Higher 5A.</p>
  <div class="g-menu">${Object.entries(G5.PT).map(([id, T], j) => `<button class="g-item" type="button" data-rd="${id}" style="${g5c([0, 1, 2, 0][j] || 0)}"><span class="gi">${ic('book')}</span><span><b>${esc(T.t)}</b><small>${T.x.split(/\s+/).length} palabras · ${T.q.length} preguntas</small></span></button>`).join('')}</div>`, 'wide');
  c.onclick = e => { const b = e.target.closest('[data-rd]'); if (b) g5Reading(b.dataset.rd); }; }
function g5Tips(i) { const u = G5.U[i]; modal(`<div style="${g5c(i)}"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><p class="kicker" style="color:var(--c)">Indicator ${i + 1}</p><h2>${esc(G5IND[i][1])}</h2></div><button class="ib" type="button" data-mclose aria-label="Cerrar">${ic('close')}</button></div>
  <p><b>${esc(G5IND[i][3])}</b></p><div class="sab"><strong>Study suggestions</strong>${esc(G5IND[i][4])}</div>
  <h3 class="hub-h">Tips</h3><ul class="tips">${u.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
  <h3 class="hub-h">Study cards</h3><div class="reglas">${u.g[1].map(c => `<div class="regla"><p class="rule-h">${esc(c[0])}</p><div class="rule-b">${c[1]}</div><div class="ej si"><i>✓</i><span>${c[2]}</span>${sayBtn(c[2])}</div></div>`).join('')}</div>
  <h3 class="hub-h">Dinámica para la clase (docente)</h3><ol class="preg">${u.tg.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>`, 'wide'); }
function g5Table() { const st = g5st(); modal(`<div class="row" style="justify-content:space-between"><div><p class="kicker">English · 5th Grade · 1st Trimester</p><h2>Indicators & study suggestions</h2></div><button class="ib" type="button" data-mclose aria-label="Cerrar">${ic('close')}</button></div>
  <div class="tbl"><table class="gtable"><thead><tr><th>Indicator</th><th>Study suggestions</th><th>Avance</th></tr></thead><tbody>${G5IND.map((d, i) => { const u = G5.U[i], N = g5Nodes(u, i), n = N.filter(([k]) => st[u.id] && st[u.id][k]).length;
    return `<tr><td>${esc(d[3])}</td><td>${esc(d[4])}</td><td style="white-space:nowrap"><b style="color:${d[2]}">${n}/${N.length}</b></td></tr>`; }).join('')}</tbody></table></div>`, 'wide'); }

// Aviso en el camino principal para entrar al apartado de 5.º
function g5Banner() { if (!PR || !(ME.g === 5 || !ME.g)) return '';
  return `<button class="g5-banner" type="button" data-rgo="guia5">${ART.flag(54)}<span><small>Guía de estudio · 1er trimestre</small><b>5.º de primaria: repasa para tu examen</b><em>6 indicadores · lecturas · glosario · examen de práctica · quiz show</em></span>${ic('next')}</button>`; }
})();
</script>
