tema({ id: 'essay', isla: 'rw', n: 'Opinion essay', g: '¶', lv: ['b2', 'c1'],
  intro: 'El ensayo es la tarea obligatoria de B2 First (140–190 palabras) y C1 Advanced (220–260). Se escribe sobre un tema dado, con dos ideas que te proporcionan y una tercera propia. Se valora un registro neutro o formal, argumentos claros, ejemplos y una conclusión con tu opinión.',
  reglas: [
    { h: 'Estructura en 4 párrafos', t: 'Introducción → idea 1 → idea 2 (o tu idea) → conclusión con opinión.', ok: ['Introduction / First, … / On the other hand, … / In conclusion, …'], no: ['Un solo párrafo largo.'] },
    { h: 'Introducción', t: 'Presenta el tema con tus palabras, sin copiar la pregunta.', ok: ['Nowadays, more and more young people…', 'It is often argued that…'], no: ['Copiar literalmente el enunciado.'] },
    { h: 'Argumentos con apoyo', t: 'Una idea principal por párrafo + razón + ejemplo.', ok: ['<b>Firstly</b>, … This is because … <b>For instance</b>, …'], no: [] },
    { h: 'Registro neutro', t: 'Evita contracciones y expresiones muy informales.', ok: ['It is', 'a great deal of', 'children'], no: ["It's super cool", 'loads of', 'kids'] },
    { h: 'Conclusión', t: 'Resume y da tu opinión final, sin ideas nuevas.', ok: ['<b>In conclusion</b>, although…, I believe that…'], no: [] },
  ],
  err: [['In my opinion I think that…', 'In my opinion, … / I think that…', 'Redundante.'], ['Nowadays the people use…', 'Nowadays people use…', 'En general, sin «the».']],
  ej: [
    ['mc', 'Which is a good way to start an essay?', 'Nowadays, many people believe that…', ['Hello reader!', 'I am going to write about…'], 'Inicio neutro y general.'],
    ['mc', 'Which is NOT suitable for an essay?', "Kids are super into it.", ['Young people are very interested in it.', 'It is widely believed that…'], 'Demasiado informal.'],
    ['mc', 'What should the conclusion include?', 'a summary and your opinion', ['a completely new idea', 'a joke'], 'Resumen + opinión.'],
    ['mc', 'To give an example, use…', 'For instance,', ['However,', 'In conclusion,'], '<b>For instance</b> = por ejemplo.'],
    ['mc', 'How many words are required for the B2 First essay?', '140–190', ['50–80', '300–350'], 'B2: 140–190; C1: 220–260.'],
    ['gap', 'On the one hand, it is cheap. On the other ___, it is not very reliable.', 'hand', '<b>On the other hand</b>.'],
    ['kwt', 'I think young people should learn to cook.', 'OPINION', 'In ___ should learn to cook.', 'my opinion young people/my opinion, young people', '<b>In my opinion</b>.'],
  ],
  texto: { t: 'Model essay (B2 First)', x: `Should all teenagers do volunteer work?
Nowadays, many schools encourage students to take part in volunteer activities. While some people believe this should be compulsory, others feel it should remain a personal choice.
Firstly, volunteering helps young people develop skills that are not taught in the classroom. For instance, working at an animal shelter teaches responsibility and teamwork. Moreover, it can help them discover possible careers.
On the other hand, teenagers already have a heavy workload. If volunteering became compulsory, some students might do it reluctantly, which would not benefit anyone.
In conclusion, although making volunteer work compulsory may not be the best solution, I believe schools should offer attractive opportunities so that every student wants to get involved.`, q: [['What is the purpose of the first paragraph?', 'To introduce the topic and both views', 'To give the writer\'s final opinion', 'To tell a personal story', 'Presenta el tema y las dos posturas.'], ['What example does the writer give?', 'Working at an animal shelter', 'Cleaning the classroom', 'Doing homework', '«working at an animal shelter».'], ['What is the writer\'s final opinion?', 'Schools should offer attractive opportunities, not force students.', 'Volunteering should be compulsory.', 'Volunteering is a waste of time.', 'Conclusión.'], ['Which linker adds an idea?', 'Moreover', 'On the other hand', 'In conclusion', '<b>Moreover</b> = además.']] },
  voc: 'argument:argumento|compulsory:obligatorio|benefit:beneficio|drawback:desventaja|encourage:fomentar|evidence:evidencia|outweigh:superar, pesar más|conclusion:conclusión',
  preg: ['Should homework be banned? Why or why not?', 'Is technology making us less sociable?', 'Should public transport be free for students?'],
  lis: ['It is often argued that technology isolates young people.', 'On the other hand, it allows us to stay in touch with friends.', 'In conclusion, the advantages outweigh the disadvantages.', 'For instance, many students learn languages online.'],
  wri: ['Escribe tu opinión: ¿los niños deberían tener celular? Da dos razones.', 'Essay (140–190 words): «Every student should learn to play a musical instrument.» Write about (1) creativity, (2) time, (3) your own idea.', 'Essay (220–260 words): «Which is more effective in reducing traffic in cities: improving public transport or charging drivers?» Explain which you consider more important, giving reasons.'],
  sab: 'En B2 First la calificación de Writing usa cuatro criterios: Content, Communicative Achievement, Organisation y Language. Cada uno vale de 0 a 5 puntos.',
  manos: 'Ensayo colectivo: el grupo vota un tema. Cada equipo escribe un párrafo distinto (introducción, argumento a favor, en contra, conclusión) y luego los unen y revisan con la checklist del atlas.',
  cam: 'B2 First Writing Part 1 (ensayo obligatorio, 140–190) · C1 Advanced Writing Part 1 (ensayo, 220–260) · C2 Proficiency Part 1 (ensayo que resume dos textos).',
  jue: ['quiz', 'speaking'] });

tema({ id: 'readstrat', isla: 'rw', n: 'Reading strategies', g: '🔍', lv: ['a2', 'b1', 'b2'],
  intro: 'Leer en un examen no es lo mismo que leer por gusto. Las estrategias clave son: skimming (leer rápido para la idea general), scanning (buscar un dato específico), deducir palabras por el contexto e identificar paráfrasis: en el texto y en las preguntas casi nunca aparecen las mismas palabras.',
  reglas: [
    { h: 'Skimming', t: 'Lee el título, la primera y la última oración de cada párrafo para captar la idea general.', ok: ['¿De qué trata el texto? ¿Para qué se escribió?'], no: ['Leer palabra por palabra desde el inicio.'] },
    { h: 'Scanning', t: 'Busca nombres, números, fechas o palabras clave sin leer todo.', ok: ['What time does the museum open? → busca números.'], no: [] },
    { h: 'Paráfrasis', t: 'La respuesta usa otras palabras con el mismo significado.', ok: ['Texto: «It wasn\'t cheap» = Pregunta: «It was expensive».'], no: ['Elegir la opción que repite palabras exactas del texto (¡suele ser una trampa!).'] },
    { h: 'Contexto', t: 'Si no conoces una palabra, mira qué tipo de palabra es y qué dicen las oraciones de alrededor.', ok: ['«The path was so <b>steep</b> that we had to stop every few minutes» → steep = empinado.'], no: [] },
    { h: 'Elimina opciones', t: 'Descarta las opciones que el texto contradice o que no menciona.', ok: [], no: [] },
  ],
  ej: [
    ['mc', 'Reading quickly to get the general idea is called…', 'skimming', ['scanning', 'spelling'], '<b>Skimming</b>.'],
    ['mc', 'Looking for a specific date or number is called…', 'scanning', ['skimming', 'summarising'], '<b>Scanning</b>.'],
    ['mc', 'Text: «The trip wasn\'t as long as we expected.» This means…', 'The trip was shorter than expected.', ['The trip was very long.', 'The trip was cancelled.'], 'Paráfrasis.'],
    ['mc', '«She was exhausted after the marathon.» Exhausted means…', 'very tired', ['very happy', 'very fast'], 'Contexto: después de un maratón.'],
    ['mc', 'An option repeats exact words from the text. It is…', 'often a trap', ['always correct', 'never possible'], 'Cuidado con las trampas.'],
    ['mc', 'Where do you usually find the main idea of a paragraph?', 'In the first sentence', ['In the last word', 'In the title only'], 'La «topic sentence».'],
  ],
  texto: { t: 'The library that travels', x: `In a small town in the mountains of Oaxaca, children don't have to wait for a bus to visit a library: the library visits them. Every Friday, a bright green van full of books arrives in the main square. It is driven by Rosa, a retired teacher who started the project in 2019 with just forty books donated by her neighbours.
Today the van carries more than two thousand books, as well as tablets with audiobooks for children who are still learning to read. "At first, many families didn't believe a library could be free," Rosa says. "Now some of the children are the ones who choose which books we buy."
The project has not always been easy. Last year, heavy rains closed the road for three weeks. Instead of cancelling the visits, Rosa and two volunteers carried boxes of books on foot.`,
    q: [['What is the text mainly about?', 'A library that travels to children', 'A teacher who writes books', 'A town without schools', 'Skimming: idea general.'], ['When did the project start?', 'In 2019', 'Last year', 'Every Friday', 'Scanning: busca la fecha.'], ['What does «retired» probably mean?', 'no longer working', 'very tired', 'very young', 'Contexto: una maestra que ya no trabaja.'], ['What happened when the road was closed?', 'They took the books on foot.', 'They cancelled the visits.', 'They bought a new van.', '«carried boxes of books on foot».']] },
  voc: 'skim:leer por encima|scan:buscar un dato|main idea:idea principal|detail:detalle|paraphrase:paráfrasis|infer:inferir|context:contexto|distractor:distractor',
  preg: ['What do you do when you find a word you don\'t know?', 'Do you prefer reading on paper or on a screen?', 'What is the best book you have read in English?'],
  lis: ['Read the title and the first sentence of each paragraph.', 'Look for numbers, names and dates.', 'The answer is often a paraphrase of the text.', 'Don\'t choose an option just because it repeats a word.'],
  wri: ['Escribe 3 preguntas sobre un texto para que un compañero las responda.', 'Write a summary of «The library that travels» in 50 words.', 'Write a paraphrase of five sentences from a news article.'],
  sab: 'En el examen B2 First tienes 75 minutos para 7 partes de Reading & Use of English: unos 10 minutos por parte. Saber hacer skimming y scanning no es opcional: es cuestión de tiempo.',
  manos: 'Carrera de scanning: el docente proyecta un texto largo y dice un dato («a number with three digits», «a city»). El primer equipo que lo encuentra y lo lee en voz alta gana un punto.',
  cam: 'A2 Key Reading Parts 1–5 · B1 Preliminary Reading Parts 1–6 · B2 First Reading Parts 5–7.',
  jue: ['quiz', 'vf'] });

tema({ id: 'academic', isla: 'rw', n: 'Academic register', g: 'Ac.', lv: ['c1'], from: 'c1-4',
  intro: 'El registro académico es el estilo de los ensayos, informes y artículos científicos. Usa hedging (lenguaje prudente: tend to, it appears that), colocaciones precisas (conduct research, a significant increase) y conectores formales. En C1 y C2 la adecuación del registro es parte de la calificación.',
  err: [['This proves that homework is useless.', 'This suggests that homework may be less effective than expected.', 'Matiza las afirmaciones.'], ['make research', 'conduct / carry out research', 'Colocación correcta.']],
  sab: 'Los artículos científicos en inglés usan muchísimo el hedging: «may», «suggest», «appear». Afirmar algo con total certeza sin pruebas se considera poco profesional.',
  manos: 'Del chat al paper: el docente da cinco frases informales sobre un tema escolar («Homework is super boring and pointless»). Los equipos las reescriben en registro académico y comparan versiones.',
  cam: 'C1 Advanced y C2 Proficiency · Writing (ensayo, informe, propuesta) y Reading & Use of English.',
  jue: ['quiz'] });

tema({ id: 'greetings', isla: 'oral', n: 'Greetings & introductions', g: 'Hello', lv: ['a1'],
  intro: 'Saludar, presentarse y despedirse son las primeras funciones comunicativas. En inglés hay saludos formales (Good morning, How do you do?) e informales (Hi, Hey, What\'s up?). «How are you?» muchas veces es solo un saludo y se responde brevemente.',
  reglas: [
    { h: 'Saludos según la hora', t: 'Good morning (hasta mediodía), good afternoon (hasta las 6 pm aprox.), good evening (en la noche). «Good night» es solo para despedirse.', ok: ['<b>Good evening</b>, everyone!', '<b>Good night</b>, see you tomorrow.'], no: ['Good night! (al llegar a una fiesta)'] },
    { h: 'Presentarse', t: 'Nombre, de dónde eres y algo de ti.', ok: ["Hi, I'm Daniela. I'm from Hermosillo.", 'Nice to meet you!'], no: ['My name are Daniela.'] },
    { h: 'Presentar a alguien', t: '«This is…» y una respuesta amable.', ok: ['Mum, <b>this is</b> Pablo. — <b>Nice to meet you</b>, Pablo.'], no: ['He is Pablo. (al presentar en persona)'] },
    { h: 'How are you?', t: 'Respuesta corta y devuelve la pregunta.', ok: ["I'm fine, thanks. And you?", 'Not bad, thanks. How about you?'], no: ['Contar todo tu día.'] },
    { h: 'Despedidas', t: 'Bye, see you later, see you tomorrow, have a nice day, take care.', ok: ['<b>See you</b> on Monday!', '<b>Have a nice</b> weekend!'], no: [] },
  ],
  err: [['Good night! (llegando)', 'Good evening!', 'Good night solo al despedirse.'], ['Nice to meet you too. (al conocer)', 'Nice to meet you. — Nice to meet you, too.', 'Primero se dice sin «too».']],
  ej: [
    ['mc', 'It\'s 9 am. You say…', 'Good morning!', ['Good night!', 'Good evening!'], 'En la mañana: <b>Good morning</b>.'],
    ['mc', '«Nice to meet you.» You answer…', 'Nice to meet you, too.', ['Me too meet.', 'Yes, I am.'], 'Respuesta: <b>Nice to meet you, too</b>.'],
    ['mc', '«How are you?» You answer…', "I'm fine, thanks. And you?", ["I'm twelve.", "I'm from Mexico."], 'Respuesta breve y devuelve la pregunta.'],
    ['mc', 'You introduce your friend. You say…', 'This is my friend, Leo.', ['He is name Leo.', 'Leo is this.'], '<b>This is…</b>'],
    ['mc', 'You leave a party at 11 pm. You say…', 'Good night!', ['Good morning!', 'Good afternoon!'], 'Despedida nocturna: <b>Good night</b>.'],
    ['gap', 'See you ___ Monday!', 'on', 'Días con <b>on</b>.'],
    ['ord', 'Where are you from', 'Wh- + are + you + from.'],
  ],
  voc: 'hello:hola|goodbye:adiós|nice to meet you:mucho gusto|see you later:nos vemos|take care:cuídate|how are you?:¿cómo estás?|this is…:te presento a…|welcome:bienvenido',
  preg: ['What\'s your name? How do you spell it?', 'Where are you from? Where do you live?', 'Introduce the person next to you to the class.'],
  lis: ['Good morning, everyone. Welcome to the English class.', 'Hi, I\'m Tom. Nice to meet you.', 'This is my friend Maria. She\'s from Mexico.', 'See you tomorrow. Have a nice day!'],
  wri: ['Escribe un diálogo de saludo y presentación entre dos personajes.', 'Write a short self-introduction for a video call with a school in another country.', 'Write the opening of a presentation in which you introduce yourself and your team.'],
  sab: '«How do you do?» es un saludo muy formal y antiguo. La respuesta correcta no es contar cómo estás, sino repetir: «How do you do?».',
  manos: 'Mingle: todos se levantan con música. Cuando se detiene, saludan a la persona más cercana, se presentan y hacen una pregunta. Cada ronda cambian de pareja y de saludo (formal, informal).',
  cam: 'Pre A1 Starters a A2 Key · Speaking Part 1 (el examinador saluda y pregunta tu nombre y de dónde eres).',
  jue: ['speaking', 'dictado'] });

tema({ id: 'directions', isla: 'oral', n: 'Asking for & giving directions', g: '↱', lv: ['a2'],
  intro: 'Pedir y dar indicaciones es una situación real de viaje y un clásico de A2 Key y B1 Preliminary. Se usan imperativos (turn left, go straight on), preposiciones de lugar y preguntas amables como «Excuse me, how do I get to…?».',
  reglas: [
    { h: 'Preguntar con cortesía', t: 'Empieza con «Excuse me».', ok: ['<b>Excuse me</b>, how do I get to the station?', 'Is there a bank near here?'], no: ['Where is the station? (sin saludo puede sonar brusco)'] },
    { h: 'Dar indicaciones', t: 'Imperativos: go straight on, turn left / right, take the second street on the left, cross the road.', ok: ['<b>Go straight on</b> and <b>turn left</b> at the traffic lights.'], no: ['You go to the left the street.'] },
    { h: 'Ubicar el lugar', t: 'on the corner, next to, opposite, between, at the end of.', ok: ["It's <b>opposite</b> the park.", "It's <b>on the corner</b> of Juárez Street and Hidalgo Avenue."], no: ["It's in front of the park. (si está del otro lado de la calle)"] },
    { h: 'Confirmar', t: 'Repite para confirmar y agradece.', ok: ['So, second left and then straight on? <b>Thanks a lot!</b>'], no: [] },
  ],
  err: [['In front of the bank. (enfrente, cruzando la calle)', 'Opposite the bank.', 'In front of = delante de.'], ['Turn to the left side.', 'Turn left.', 'Más simple y natural.']],
  ej: [
    ['mc', 'Polite way to ask:', 'Excuse me, how do I get to the museum?', ['Museum where?', 'Tell me the museum.'], 'Con <b>Excuse me</b>.'],
    ['mc', 'Go ___ on until you see the church.', 'straight', ['right', 'across'], '<b>go straight on</b> = sigue derecho.'],
    ['mc', 'The bank is across the street from the park. It is ___ the park.', 'opposite', ['in front of', 'behind'], '<b>opposite</b> = enfrente, cruzando la calle.'],
    ['mc', 'Take the second street ___ the right.', 'on', ['at', 'in'], '<b>on the right</b>.'],
    ['mc', 'The café is ___ the bank and the pharmacy.', 'between', ['next', 'opposite to'], '<b>between</b> = entre.'],
    ['gap', 'Turn ___ at the traffic lights. (izquierda)', 'left', '<b>turn left</b>.'],
    ['ord', 'How do I get to the station', 'How do I get to + lugar.'],
  ],
  voc: 'turn left:da vuelta a la izquierda|go straight on:sigue derecho|traffic lights:semáforo|corner:esquina|opposite:enfrente de|roundabout:glorieta|cross:cruzar|block:cuadra',
  preg: ['How do you get from your house to school?', 'Explain how to get from our classroom to the library.', 'What is the best place to visit in your town? How do you get there?'],
  lis: ['Excuse me, is there a pharmacy near here?', 'Go straight on and take the first street on the left.', 'The museum is opposite the cathedral.', 'Turn right at the roundabout. You can\'t miss it.'],
  wri: ['Dibuja un mapa de tu colonia y escribe cómo llegar a tu casa.', 'Write a message to a friend explaining how to get from the bus station to your house.', 'Write a short guide for tourists: a walking route around your city centre.'],
  sab: 'En Reino Unido una cuadra no se dice «block»; se dice «Take the second turning / street on the left». «Block» es muy usado en Estados Unidos.',
  manos: 'GPS humano: venden los ojos a un voluntario (con cuidado) y su equipo lo guía por el salón hasta un objeto solo con indicaciones en inglés: «Go straight on, stop, turn left, two steps…».',
  cam: 'A2 Key Listening Part 1–2 · B1 Preliminary Listening Part 1 · A1 Movers Listening (seguir rutas en un mapa).',
  jue: ['speaking', 'dictado'] });

tema({ id: 'suggestions', isla: 'oral', n: 'Invitations & suggestions', g: "Let's", lv: ['a2', 'b1'],
  intro: 'Para hacer planes con otras personas hay que saber sugerir, invitar, aceptar y rechazar con amabilidad. Estas funciones son el corazón de la Speaking Part 3 de B1 Preliminary y B2 First, donde tienes que llegar a una decisión con tu compañero.',
  reglas: [
    { h: 'Sugerir', t: "Let's + verbo · Why don't we…? · How about / What about + -ing? · Shall we…?", ok: ["<b>Let's</b> go to the cinema.", '<b>How about going</b> to the park?', '<b>Why don\'t we</b> make a poster?'], no: ['How about go to the park?'] },
    { h: 'Invitar', t: 'Would you like to…? · Do you want to…?', ok: ['<b>Would you like to</b> come to my party?'], no: ['Do you like to come to my party? (= ¿te gusta…?)'] },
    { h: 'Aceptar', t: "That's a great idea! · Sure, why not? · I'd love to!", ok: ["<b>I'd love to!</b> What time?"], no: [] },
    { h: 'Rechazar con amabilidad', t: 'Agradece, da una razón y propone otra cosa.', ok: ["I'd love to, <b>but</b> I have to study. <b>Maybe</b> next week?"], no: ['No.'] },
  ],
  err: [['How about to go…?', 'How about going…?', 'How about + -ing.'], ['Do you like to come?', 'Would you like to come?', 'Invitar = would you like.']],
  ej: [
    ['mc', 'How about ___ a picnic on Sunday?', 'having', ['have', 'to have'], 'How about + <b>-ing</b>.'],
    ['mc', "___ go to the beach this weekend!", "Let's", ['Lets', 'Let we'], "<b>Let's</b> + verbo base."],
    ['mc', 'To invite someone, you say…', 'Would you like to come?', ['Do you like come?', 'You come?'], '<b>Would you like to…?</b>'],
    ['mc', 'A polite way to say no:', "I'd love to, but I'm busy.", ['No, I don\'t want.', 'Never.'], 'Agradece y da una razón.'],
    ['mc', 'Why don\'t we ___ pizza?', 'order', ['ordering', 'to order'], "Why don't we + <b>verbo base</b>."],
    ['gap', '___ we meet at six? — Yes, good idea.', 'Shall', '<b>Shall we…?</b>'],
    ['ord', 'Would you like to come to my party?', 'Would you like to + verbo.'],
  ],
  voc: "let's:vamos a|how about…?:¿qué tal si…?|shall we…?:¿y si…?|would you like…?:¿te gustaría…?|I'd love to:me encantaría|maybe:tal vez|plan:plan|decide:decidir",
  preg: ['Invite your partner to do something this weekend.', 'Your class has some money for an end-of-year activity. Make three suggestions.', 'How do you say no politely in English?'],
  lis: ["Let's meet in front of the cinema at five.", 'How about going to the museum on Saturday?', "I'd love to, but I've got a lot of homework.", 'Would you like to come to my birthday party?'],

tema({ id: 'opinions', isla: 'oral', n: 'Giving opinions, agreeing & disagreeing', g: 'I think', lv: ['b1', 'b2'],
  intro: 'Dar opiniones y reaccionar a las de otros es esencial en una conversación y en los exámenes desde B1. Lo importante no es tener «la respuesta correcta», sino justificar con razones y ejemplos, y mostrar acuerdo o desacuerdo con cortesía.',
  reglas: [
    { h: 'Dar tu opinión', t: 'In my opinion, … · I think / believe that… · As far as I\'m concerned, …', ok: ['<b>In my opinion</b>, school should start later.'], no: ['In my opinion I think that… (redundante)'] },
    { h: 'Justificar', t: 'Agrega because + razón + for example.', ok: ["I think it's useful <b>because</b> you can practise anywhere. <b>For example</b>, …"], no: ['I think yes.'] },
    { h: 'Estar de acuerdo', t: "I agree (with you). · That's true. · Absolutely! · You're right.", ok: ['<b>I agree with you</b>.'], no: ['I am agree.'] },
    { h: 'Estar en desacuerdo con cortesía', t: "I see your point, but… · I'm not sure about that. · I'm afraid I disagree.", ok: ["<b>I see what you mean, but</b> I think it's expensive."], no: ["You're wrong."] },
    { h: 'Incluir al compañero', t: 'En el examen se valora la interacción.', ok: ['What do you think?', 'Do you agree?', 'What about you?'], no: ['Hablar solo sin preguntar.'] },
  ],
  err: [['I am agree.', 'I agree.', '«Agree» es verbo.'], ['I think yes.', 'I think so.', 'Expresión fija.'], ['According to me…', 'In my opinion…', '«According to» se usa para otras fuentes.']],
  ej: [
    ['mc', 'Which is correct?', 'I agree with you.', ['I am agree with you.', 'I agree you.'], '<b>Agree</b> es verbo.'],
    ['mc', 'A polite way to disagree:', "I see your point, but I'm not sure.", ["You're totally wrong.", 'No.'], 'Desacuerdo amable.'],
    ['mc', '«Do you think it will rain?» — «Yes, I think ___.»', 'so', ['yes', 'it'], '<b>I think so</b>.'],
    ['mc', 'Which phrase invites your partner to speak?', 'What do you think?', ['In my opinion,', 'I strongly believe'], 'Interacción.'],
    ['mc', '___ far as I\'m concerned, it\'s a great idea.', 'As', ['So', 'How'], '<b>As far as I\'m concerned</b>.'],
    ['gap', 'That\'s a good ___, but I still think it\'s too expensive.', 'point', '<b>That\'s a good point</b>.'],
    ['ord', 'I see what you mean but I disagree', 'Reconoce + but + desacuerdo.'],
  ],
  voc: 'agree:estar de acuerdo|disagree:estar en desacuerdo|point:argumento, punto|opinion:opinión|reason:razón|convince:convencer|on the other hand:por otro lado|absolutely:totalmente',
  preg: ['Should mobile phones be allowed in class? Why or why not?', 'Is it better to study alone or in a group?', 'Do you think video games are good for young people?'],
  lis: ['In my opinion, uniforms are a good idea.', 'I see your point, but I think they are uncomfortable.', 'I totally agree with you.', 'What do you think about online classes?'],
  wri: ['Escribe 3 opiniones sobre tu escuela con «I think… because…».', 'Write a forum post giving your opinion about school uniforms (about 100 words).', 'Write a reply to a classmate\'s opinion, politely disagreeing and giving two reasons.'],
  sab: 'Los británicos suelen suavizar el desacuerdo: «I\'m not sure I agree» o «That\'s an interesting idea…» muchas veces significan «No estoy de acuerdo».',
  manos: 'Línea de opinión: el docente lee una afirmación («Homework should be banned»). Los alumnos se paran en una línea del salón entre «Strongly agree» y «Strongly disagree», y justifican su lugar con frases del atlas.',
  cam: 'B1 Preliminary Speaking Part 3–4 · B2 First Speaking Part 3–4 · C1 Advanced Speaking Part 4.',
  jue: ['speaking', 'quiz'] });

tema({ id: 'photos', isla: 'oral', n: 'Describing & comparing photos', g: '📷', lv: ['b1', 'b2'],
  intro: 'En B1 Preliminary describes una foto durante 1 minuto (Part 2). En B2 First comparas dos fotos y respondes una pregunta (1 minuto). La clave: no quedarse callado, describir personas, lugar, acciones y sentimientos, y especular cuando no estás seguro.',
  reglas: [
    { h: 'Ubicar', t: 'In the picture / In the foreground / In the background / On the left / On the right.', ok: ['<b>In the background</b>, there are some mountains.'], no: ['In the photo of the left…'] },
    { h: 'Acciones', t: 'Presente continuo para lo que pasa.', ok: ['Two girls <b>are cooking</b> in a kitchen.'], no: ['Two girls cook in a kitchen.'] },
    { h: 'Especular', t: 'It looks like… · They might be… · She seems to be… · Maybe…', ok: ['<b>They might be</b> brothers.', 'It <b>looks like</b> a birthday party.'], no: ['I don\'t know. (y callarse)'] },
    { h: 'Comparar (B2)', t: 'Both pictures show… · whereas · while · In the first picture…, but in the second…', ok: ['<b>Both pictures show</b> people travelling, <b>whereas</b> the first one is more relaxing.'], no: ['Describir cada foto por separado sin comparar.'] },
    { h: 'Si te falta una palabra', t: 'Parafrasea: a kind of…, something you use to…, it\'s like a…', ok: ["He's holding <b>a kind of</b> tool you use to fix bikes."], no: ['Quedarse en silencio.'] },
  ],
  err: [['In the photo I can see that there is people.', 'In the photo, there are some people.', '«People» es plural.'], ['She looks like happy.', 'She looks happy.', 'Look + adjetivo; look like + sustantivo.']],
  ej: [
    ['mc', 'Something far away in the photo is…', 'in the background', ['in the foreground', 'on the top'], '<b>background</b> = fondo.'],
    ['mc', 'Choose the correct one.', 'She looks tired.', ['She looks like tired.', 'She is looking like tired.'], 'Look + adjetivo.'],
    ['mc', 'You are not sure. You say…', 'They might be on holiday.', ['They are on holiday 100%.', 'I don\'t know.'], 'Especular con <b>might</b>.'],
    ['mc', 'To compare two photos, you can say…', 'Both pictures show…', ['This picture is a picture.', 'The first picture.'], '<b>Both pictures show…</b>'],
    ['mc', 'You forgot the word «ladle». You say…', "It's a kind of big spoon.", ['I forgot.', 'Spoonbig.'], 'Parafrasea.'],
    ['gap', 'It looks ___ a wedding. Everybody is dressed up.', 'like', 'Look like + sustantivo.'],
    ['gap', 'In the first photo the people are inside, ___ in the second they are outside.', 'whereas/while', 'Contraste: <b>whereas</b>.'],
  ],
  voc: 'foreground:primer plano|background:fondo|on the left:a la izquierda|seem:parecer|might:podría|whereas:mientras que|both:ambos|dressed up:arreglado',
  preg: ['Describe a photo on your phone to your partner without showing it.', 'Compare two places where you like to study.', 'What do you think the people in your favourite photo are feeling?'],

  sab: 'En B1 Preliminary Part 2 el examinador te deja hablar un minuto completo. Si terminas en 20 segundos pierdes la oportunidad de mostrar tu vocabulario: describe colores, ropa, clima y sentimientos.',

  cam: 'B1 Preliminary Speaking Part 2 · B2 First Speaking Part 2 · C1 Advanced Speaking Part 2 (comparar dos de tres fotos).',
  jue: ['speaking', 'tiempos'] });

tema({ id: 'listenstrat', isla: 'oral', n: 'Listening strategies', g: '🎧', lv: ['a2', 'b1', 'b2'],
  intro: 'En los exámenes Cambridge cada audio se escucha dos veces. Las estrategias más útiles son: leer las preguntas antes y predecir, subrayar palabras clave, no detenerse en una palabra que no entendiste y cuidarse de los distractores: el audio suele mencionar todas las opciones, pero solo una es correcta.',
  reglas: [
    { h: 'Antes de escuchar', t: 'Lee las preguntas, subraya palabras clave y predice qué tipo de información necesitas (un número, un lugar, un sentimiento).', ok: ['What time…? → espera una hora.'], no: ['Esperar al audio sin leer.'] },
    { h: 'Distractores', t: 'El audio menciona varias opciones y luego corrige: «It was going to be on Monday, but in the end it\'s on Wednesday».', ok: ['Escucha palabras como but, actually, in the end, I changed my mind.'], no: ['Marcar la primera opción que escuchas.'] },
    { h: 'Primera y segunda vez', t: 'La primera vez, contesta lo que puedas; la segunda, confirma y completa.', ok: [], no: [] },
    { h: 'Deletreo y números', t: 'En A2 Key y en los YLE hay nombres deletreados y números: practica los pares difíciles 13 / 30, 15 / 50.', ok: ['thir<b>TEEN</b> (13) vs <b>THIR</b>ty (30)'], no: [] },
  ],
  ej: [
    ['mc', 'Before listening, you should…', 'read the questions and predict', ['close your eyes', 'write the answers randomly'], 'Leer y predecir.'],
    ['mc', '«It was on Monday… oh no, actually it\'s on Friday.» The answer is…', 'Friday', ['Monday', 'Both'], 'Cuidado con «actually».'],
    ['mc', 'How many times do you hear each recording in Cambridge exams?', 'twice', ['once', 'three times'], 'Dos veces.'],
    ['mc', 'Which pair is difficult to hear?', 'fifteen / fifty', ['one / two', 'red / blue'], 'Acento: fif<b>TEEN</b> / <b>FIF</b>ty.'],
    ['mc', 'The question asks «How did she feel?». You listen for…', 'adjectives of emotion', ['numbers', 'place names'], 'Predice el tipo de información.'],
    ['mc', 'If you miss an answer, you should…', 'move on and try again the second time', ['stop and panic', 'leave the room'], 'Sigue adelante.'],
  ],
  voc: 'recording:grabación|predict:predecir|key word:palabra clave|distractor:distractor|twice:dos veces|actually:en realidad|in the end:al final|change your mind:cambiar de opinión',
  preg: ['What do you find most difficult when you listen to English?', 'What do you listen to in English outside school?', 'How can songs and series help you improve your listening?'],
  lis: ['The concert was going to be on Saturday, but now it is on Sunday.', 'The tickets cost fifteen pounds, not fifty.', 'My surname is Hughes: H-U-G-H-E-S.', 'Actually, I changed my mind. I\'ll have the chicken.'],
  wri: ['Escribe 3 consejos para escuchar mejor en inglés.', 'Write a short review of a podcast or channel that helps you practise listening.', 'Write a study plan to improve your listening skills in one month.'],
  sab: 'En los exámenes Cambridge English, de Starters a C2 Proficiency, escuchas cada grabación dos veces. ¡La segunda vez es para confirmar, no para empezar!',
  manos: 'Distractor detective: el docente lee en voz alta mini diálogos con distractores (o usa el dictado del atlas). Los equipos escriben la respuesta y la palabra que «cambió» la respuesta (but, actually…).',
  cam: 'A2 Key Listening (5 partes) · B1 Preliminary (4 partes) · B2 First y C1 Advanced (4 partes).',
  jue: ['dictado', 'pares', 'spelling'] });

tema({ id: 'presentations', isla: 'oral', n: 'Presentations & discussions', g: '🎤', lv: ['b2', 'c1'],
  intro: 'En niveles avanzados se espera que hables de forma extendida y organizada: presentar un tema, desarrollar ideas y discutir temas abstractos. En C1 Advanced Part 4 y C2 Proficiency se valoran la gama de vocabulario, la cohesión del discurso y la capacidad de matizar.',
  reglas: [
    { h: 'Señalizar la estructura', t: 'Anuncia lo que vas a decir y conecta las partes.', ok: ['<b>I\'d like to start by</b>… / <b>Moving on to</b>… / <b>To sum up</b>, …'], no: [] },
    { h: 'Ganar tiempo con naturalidad', t: 'Frases de relleno útiles en vez de silencios.', ok: ["That's an interesting question. Let me think…", "Well, it depends on…"], no: ['Ehhh… mmm…'] },
    { h: 'Matizar', t: 'Evita absolutos; usa tendencias y condiciones.', ok: ['It <b>tends to</b> be…', '<b>To some extent</b>, I agree.', 'It <b>largely depends on</b>…'], no: ['Everybody always does this.'] },
    { h: 'Desarrollar ideas', t: 'Idea + explicación + ejemplo + consecuencia.', ok: ['…<b>which means that</b>… / <b>A case in point is</b>…'], no: [] },
    { h: 'Interactuar', t: 'Retoma lo que dijo tu compañero.', ok: ['<b>Going back to what you said about</b>… / <b>Building on that</b>…'], no: [] },
  ],
  err: [['I will talk about of climate change.', 'I will talk about climate change.', 'Sin «of».'], ['In resume, …', 'To sum up, … / In summary, …', 'Falso amigo.']],
  ej: [
    ['mc', 'To change topic in a presentation, say…', 'Moving on to…', ['Stop.', 'In resume…'], '<b>Moving on to…</b>'],
    ['mc', 'To conclude, say…', 'To sum up,', ['In resume,', 'Finally finally,'], '<b>To sum up</b>.'],
    ['mc', 'Which phrase shows partial agreement?', 'To some extent, I agree.', ["You're wrong.", 'I agree 100%.'], 'Matizar.'],
    ['mc', 'Which phrase gives you time to think naturally?', "That's an interesting question.", ['Ehhh…', 'Next question.'], 'Relleno natural.'],
    ['mc', '«A case in point is…» introduces…', 'an example', ['a conclusion', 'a question'], 'Ejemplo.'],
    ['gap', 'Building ___ what Ana said, I think…', 'on', '<b>Building on</b>.'],
    ['gap', 'It largely ___ on the situation.', 'depends', '<b>depends on</b>.'],
  ],
  voc: 'to sum up:en resumen|moving on:pasando a|to some extent:hasta cierto punto|a case in point:un claro ejemplo|tend to:tender a|outline:esquema|audience:público|rhetorical question:pregunta retórica',
  preg: ['Is it more important to be talented or hard-working?', 'How will artificial intelligence change education?', 'Should governments invest more in space exploration or in solving problems on Earth?'],
  lis: ["I'd like to start by giving you some background.", 'Moving on to my second point, …', 'To some extent, I agree, but it largely depends on the context.', 'To sum up, there is no easy answer.'],
  wri: ['Prepara una tarjeta con 3 ideas para presentar tu pasatiempo.', 'Prepare a 2-minute presentation outline about a problem in your community.', 'Write the script of a 3-minute talk on a controversial topic, signposting each section.'],
  sab: 'La regla 10-20-30, popularizada por Guy Kawasaki para presentaciones, sugiere: 10 diapositivas, 20 minutos y letra de al menos 30 puntos.',
  manos: 'Charlas relámpago: cada alumno presenta un tema durante 2 minutos con el cronómetro del Kit de clase. El grupo hace dos preguntas y evalúa con tres criterios: organización, vocabulario e interacción.',
  cam: 'C1 Advanced Speaking Part 2 y 4 · C2 Proficiency Speaking Part 3 (turno largo de 2 minutos).',
  jue: ['speaking'] });
