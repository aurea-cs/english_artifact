<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atlas de Inglés (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Atlas interactivo de inglés alineado al MCER y a Cambridge English para escuelas particulares de México: fichas con audio, juegos, retos y herramientas para el docente.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,700;0,800;0,900;1,600&family=Pacifico&display=swap">
<style>
/* ================= Atlas de Inglés · EpicGroup Lab =================
   Concepto: un cuaderno de cuadrícula con sellos de pasaporte y banderines (bunting) de colores.
   Un color por área. Tema claro deliberado, pensado para proyectar en el salón. */
:root {
  color-scheme: light;
  --cobalto: #16245f; --cobalto-d: #0d1745; --tinta: #161c42; --muted: #5a6188; --linea: #dfe4f3; --suave: #eef2fc;
  --papel: #f7f9fe; --azulejo: #ffffff;
  --rosa: #e5383b; --rosa-d: #b3242a; --cempa: #ffb703; --cempa-d: #c98a00; --turquesa: #0fa3b1; --turquesa-d: #0b7d88;
  --ok: #12a05c; --ok-bg: #e2f7eb; --bad: #e23b4e; --bad-bg: #fde6e9; --hint: #fff3d9; --hint-fg: #7a4d00;
  --gram: #7a4ff0; --gram-d: #5b31cc; --gram-l: #efe9ff;
  --voc: #f77f00; --voc-d: #bf5f00; --voc-l: #fff0df;
  --pron: #0fa3b1; --pron-d: #0b7d88; --pron-l: #dcf6f8;
  --rw: #2f6fff; --rw-d: #1b52cf; --rw-l: #e3ecff;
  --oral: #e63e7a; --oral-d: #b9225a; --oral-l: #ffe4ee;
  --com: #f77f00;
  --f-head: 'Baloo 2', 'Atkinson Hyperlegible', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 22px; --sh: 0 1px 2px rgba(20, 28, 90, .08), 0 14px 34px -12px rgba(20, 28, 110, .28); --sh-s: 0 1px 2px rgba(20, 28, 90, .06), 0 6px 16px -8px rgba(20, 28, 110, .28);
  --top-h: 68px; --dock-h: 86px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background-color: var(--papel); background-image: linear-gradient(rgba(22, 36, 95, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(22, 36, 95, .045) 1px, transparent 1px); background-size: 28px 28px; color: var(--tinta); font-family: var(--f-body); font-size: 17px; line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #fff; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--rosa); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-head); line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
img { max-width: 100%; }
.big-text { font-size: 19px; }

/* ---------- Banderines ---------- */
.picado { height: 26px; background-repeat: repeat-x; background-size: 168px 26px; pointer-events: none; }

/* ---------- Barra superior ---------- */
.top { position: fixed; z-index: 40; top: 0; left: 0; right: 0; padding-top: env(safe-area-inset-top, 0px); pointer-events: none; }
.top-in { display: flex; align-items: center; gap: 10px; height: var(--top-h); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--linea); pointer-events: auto; }
.top .picado { margin-top: -1px; background-color: rgba(255, 255, 255, .9); }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; border-radius: 14px; background: var(--cobalto); color: #fff; box-shadow: 0 4px 0 var(--cobalto-d); flex: none; }
.brand img { height: 26px; width: auto; display: block; }
.brand b { font-family: var(--f-head); font-weight: 800; font-size: 19px; white-space: nowrap; padding-left: 10px; border-left: 1.5px solid rgba(255, 255, 255, .35); line-height: 1; padding-top: 3px; }
.crumb { font-family: var(--f-head); font-weight: 700; font-size: 17px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb b { color: var(--tinta); }
.top .sp { flex: 1; min-width: 0; }
.search { position: relative; flex: 0 1 340px; min-width: 0; }
.search input { width: 100%; height: 46px; border-radius: 14px; border: 2px solid var(--linea); background: var(--suave); color: var(--tinta); padding: 0 14px 0 42px; font: inherit; font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--cobalto); background: #fff; outline: 0; }
.search .s-ic { position: absolute; left: 13px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.results { position: absolute; top: 52px; left: 0; right: 0; min-width: 280px; max-height: min(60vh, 460px); overflow: auto; background: #fff; border-radius: 16px; box-shadow: var(--sh); padding: 6px; border: 1px solid var(--linea); }
.res { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px; }
.res:hover, .res.on { background: var(--suave); }
.res small { display: block; color: var(--muted); font-size: 13px; }
.pill { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 14px; background: #fff; border: 2px solid var(--linea); font-family: var(--f-head); font-weight: 800; font-size: 17px; flex: none; }
.pill svg { width: 22px; height: 22px; }
.lang-btn { display: flex; height: 44px; border-radius: 14px; border: 2px solid var(--linea); background: #fff; padding: 3px; gap: 2px; flex: none; }
.lang-btn span { display: grid; place-items: center; min-width: 36px; border-radius: 10px; color: var(--muted); font-weight: 700; font-size: 14px; font-family: var(--f-head); }
.lang-btn span.on { background: var(--cobalto); color: #fff; }
.perfil { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 4px; border-radius: 16px; background: #fff; border: 2px solid var(--linea); flex: none; text-align: left; }
.perfil .av { width: 38px; height: 38px; }
.perfil b { font-family: var(--f-head); font-size: 16px; display: block; line-height: 1.05; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.perfil small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 700; line-height: 1.1; }

/* ---------- Botones ---------- */
.btn { --c: var(--cobalto); --cd: var(--cobalto-d); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 16px;
  background: var(--c); color: #fff; font-family: var(--f-head); font-weight: 700; font-size: 18px; line-height: 1; box-shadow: 0 4px 0 var(--cd); transition: transform .08s, box-shadow .08s, filter .15s; user-select: none; text-align: center; }
.btn:hover { filter: brightness(1.07); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--cd); }
.btn:disabled { filter: grayscale(.7) opacity(.5); cursor: default; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.rosa { --c: var(--rosa); --cd: var(--rosa-d); } .btn.cempa { --c: var(--cempa); --cd: var(--cempa-d); color: #3a2200; } .btn.turq { --c: var(--turquesa); --cd: var(--turquesa-d); }
.btn.ok { --c: var(--ok); --cd: #0b7a44; } .btn.bad { --c: var(--bad); --cd: #b32335; }
.btn.blanco { --c: #fff; --cd: #d4dbef; color: var(--tinta); border: 2px solid var(--linea); }
.btn.sm { min-height: 40px; font-size: 15.5px; padding: 0 14px; border-radius: 12px; box-shadow: 0 3px 0 var(--cd); }
.btn.lg { min-height: 60px; font-size: 21px; padding: 0 28px; border-radius: 18px; }
.ib { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: #fff; border: 2px solid var(--linea); flex: none; color: var(--tinta); }
.ib svg { width: 20px; height: 20px; }
.ib:hover { border-color: var(--cobalto); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Azulejo de letra: la pieza gráfica del atlas */
.az { --c: var(--cobalto); position: relative; display: grid; place-items: center; width: 64px; height: 64px; flex: none; border-radius: 14px; background: #fff; border: 3px solid var(--c);
  box-shadow: 0 4px 0 var(--c), inset 0 0 0 4px #fff, inset 0 0 0 6px color-mix(in srgb, var(--c) 22%, #fff); font-family: var(--f-head); font-weight: 800; color: var(--c); font-size: 22px; line-height: 1; overflow: hidden; text-align: center; }
.az::before, .az::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 35%, #fff) 30%, transparent 32%); }
.az::before { left: 2px; top: 2px; } .az::after { right: 2px; bottom: 2px; }
.az span { position: relative; z-index: 1; padding: 0 4px; }
.az.sm { width: 46px; height: 46px; font-size: 16px; border-radius: 11px; border-width: 2.5px; box-shadow: 0 3px 0 var(--c), inset 0 0 0 3px #fff, inset 0 0 0 5px color-mix(in srgb, var(--c) 22%, #fff); }
.az.lg { width: 96px; height: 96px; font-size: 34px; border-radius: 20px; }
.az.lg.long { font-size: 24px; }

/* Chips de nivel */
.nv { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, #fff); white-space: nowrap; }
.nv::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.nvs { display: flex; gap: 5px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chipb { min-height: 44px; padding: 0 16px; border-radius: 14px; background: #fff; border: 2px solid var(--linea); font-family: var(--f-head); font-weight: 700; font-size: 16px; color: var(--tinta); }
.chipb[aria-pressed="true"] { background: var(--c, var(--cobalto)); border-color: var(--c, var(--cobalto)); color: #fff; box-shadow: 0 3px 0 var(--cd, var(--cobalto-d)); }
.chipb small { display: block; font-size: 11.5px; font-weight: 700; opacity: .8; margin-top: -3px; font-family: var(--f-body); }

/* ---------- Dock (menú inferior) ---------- */
.dock { position: fixed; z-index: 34; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 6px; border-radius: 22px;
  background: rgba(255, 255, 255, .94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: var(--sh); border: 1px solid var(--linea); max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 76px; height: 62px; border-radius: 16px; color: var(--muted); font-weight: 700; font-size: 13px; flex: none; padding: 0 6px; }
.tab svg { width: 26px; height: 26px; }
.tab:hover { background: var(--suave); color: var(--tinta); }
.tab[aria-current="true"] { background: var(--cobalto); color: #fff; box-shadow: 0 3px 0 var(--cobalto-d); }
.login-on .dock, .viewer-on .dock, .lesson-on .dock, .game-on .dock, .present-on .dock { display: none; }
.tab { min-width: 70px; }

/* ---------- Cabeceras de panel (visor) ---------- */
.p-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 14px 10px 18px; flex: none; }
.p-head > div { flex: 1; min-width: 0; }
.eyebrow { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.p-head h2 { font-size: 26px; margin-top: 2px; }
.isla-h { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; font-family: var(--f-head); font-weight: 800; font-size: 17px; color: var(--cd); }
.isla-h i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); transform: rotate(45deg); }
/* ---------- Ficha del tema: página completa ---------- */
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.ficha { display: grid; gap: 18px; animation: rise .3s ease-out; }
.f-top { position: relative; padding: 24px 26px; background: var(--c); color: #fff; border-radius: 30px; overflow: hidden; box-shadow: 0 6px 0 var(--cd); display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.f-top::before { content: ""; position: absolute; inset: 0; opacity: .16; background-image: radial-gradient(circle at 25% 25%, #fff 0 9%, transparent 10%), radial-gradient(circle at 75% 75%, #fff 0 9%, transparent 10%), linear-gradient(45deg, transparent 46%, #fff 46% 54%, transparent 54%), linear-gradient(-45deg, transparent 46%, #fff 46% 54%, transparent 54%); background-size: 56px 56px; pointer-events: none; }
.f-top > * { position: relative; }
.f-row { display: flex; gap: 18px; align-items: center; flex: 1 1 420px; min-width: 0; }
.f-row > div { flex: 1; min-width: 0; }
.f-back { display: inline-flex; align-items: center; gap: 6px; color: #fff; font-weight: 700; font-size: 15px; padding: 4px 10px 4px 6px; border-radius: 10px; background: rgba(255, 255, 255, .18); }
.f-back:hover { background: rgba(255, 255, 255, .3); }
.f-back svg { width: 18px; height: 18px; }
.f-top h1 { font-size: clamp(32px, 4.6vw, 54px); margin: 8px 0 10px; line-height: 1; }
.f-top .nv { background: rgba(255, 255, 255, .94); }
.f-hacts { display: flex; gap: 8px; flex-wrap: wrap; }
.f-grid { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.f-nav { position: sticky; top: calc(var(--top-h) + 42px + env(safe-area-inset-top, 0px)); display: grid; gap: 4px; background: #fff; border-radius: 22px; padding: 10px; border: 1px solid var(--linea); box-shadow: var(--sh-s); }
.f-nav button { display: flex; align-items: center; gap: 9px; text-align: left; min-height: 42px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--tinta); }
.f-nav button svg { width: 19px; height: 19px; flex: none; color: var(--cd); }
.f-nav button:hover { background: var(--cl); }
.f-nav button.on { background: var(--c); color: #fff; }
.f-nav button.on svg { color: #fff; }
.f-body { display: grid; gap: 16px; min-width: 0; }
.f-sec { background: #fff; border-radius: 26px; padding: 22px 24px; border: 1px solid var(--linea); box-shadow: var(--sh-s); scroll-margin-top: calc(var(--top-h) + 44px); }
.f-sec > h2 { font-size: 26px; color: var(--cd); display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.f-sec > h2 svg { width: 28px; height: 28px; flex: none; padding: 4px; border-radius: 9px; background: var(--cl); }
.f-body p { margin: 6px 0; max-width: 70ch; }
.lead { font-size: 19px; line-height: 1.6; }
.reglas { display: grid; gap: 12px; }
.regla { border: 2px solid var(--linea); border-radius: 18px; padding: 14px 16px; }
.regla > p { margin: 0 0 10px; font-weight: 700; display: flex; gap: 10px; align-items: flex-start; max-width: none; }
.rn { flex: none; width: 28px; height: 28px; border-radius: 9px; background: var(--c); color: #fff; display: grid; place-items: center; font-family: var(--f-head); font-size: 15px; margin-top: -1px; }
.ej-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 18px; }
.ej { display: flex; gap: 8px; align-items: flex-start; margin: 5px 0; line-height: 1.45; }
.ej i { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 14px; margin-top: 1px; }
.ej.si i { background: var(--ok-bg); color: var(--ok); }
.ej.no i { background: var(--bad-bg); color: var(--bad); }
.ej.no span { text-decoration: line-through; text-decoration-color: rgba(226, 59, 78, .55); text-decoration-thickness: 2px; color: #7b3a43; }
.ej span { min-width: 0; overflow-wrap: anywhere; }
.hint-l { color: var(--muted); font-weight: 700; }
.ejs { display: grid; gap: 14px; margin-top: 8px; }
.ejq { border-radius: 18px; background: var(--cl); padding: 14px 16px; }
.ejp { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; font-size: 18px; margin: 0 0 10px !important; max-width: none !important; }
.ejp b { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-family: var(--f-head); font-size: 16px; }
.ejq .opts { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ejq .opt { min-height: 52px; font-size: 17px; }
.ejq .fb { margin-top: 10px; }
.ej-score:not(:empty) { margin-top: 14px; }
.sub-h { font-size: 20px; margin: 22px 0 10px; color: var(--cd); }
.match { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 10px; }
.m-col { display: grid; gap: 8px; align-content: start; }
.m-it { text-align: left; min-height: 48px; padding: 8px 12px; border-radius: 14px; border: 2.5px solid var(--linea); background: #fff; font-weight: 700; line-height: 1.35; transition: transform .1s; }
.m-it:not(.def) { font-family: var(--f-head); font-size: 17px; }
.m-it.def { font-weight: 400; font-size: 15px; }
.m-it:hover:not(:disabled) { border-color: var(--c); }
.m-it.sel { border-color: var(--c); background: var(--cl); transform: translateX(4px); }
.m-it.ok { border-color: var(--ok); background: var(--ok-bg); color: #0b6b3c; cursor: default; }
.m-it.bad { border-color: var(--bad); background: var(--bad-bg); }
.sab { background: var(--hint); color: var(--hint-fg); border-radius: 18px; padding: 16px 18px; line-height: 1.6; font-size: 18px; }
.sab strong { display: block; font-family: var(--f-head); font-size: 19px; margin-bottom: 2px; }
.voc { margin: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.voc div { background: var(--suave); border-radius: 16px; padding: 12px 14px; }
.voc dt { font-weight: 700; font-family: var(--f-head); font-size: 18px; color: var(--cd); }
.voc dd { margin: 0; color: var(--muted); line-height: 1.45; }
.preg { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: q; }
.preg li { background: var(--suave); border-radius: 14px; padding: 11px 14px 11px 48px; position: relative; counter-increment: q; }
.preg li::before { content: counter(q); position: absolute; left: 12px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.manos { border: 2.5px dashed var(--c); border-radius: 18px; padding: 16px 18px; background: color-mix(in srgb, var(--c) 6%, #fff); font-size: 18px; line-height: 1.55; }
.mas { display: grid; gap: 10px; }
.mas .eyebrow { margin-top: 6px; }
.prog { background: var(--suave); border-radius: 16px; padding: 14px 16px; font-size: 16px; line-height: 1.55; }
.texto { background: #fffaf2; border: 1px solid #f1e2c8; border-radius: 16px; padding: 14px 18px; font-size: 18px; line-height: 1.75; white-space: pre-line; color: #3b2a14; margin-top: 12px; }
.texto b { display: block; font-family: var(--f-head); color: var(--cd); font-size: 16px; margin-bottom: 4px; white-space: normal; }
.f-acts { display: grid; gap: 12px; padding: 6px 0 10px; }
.f-acts > .btn { width: 100%; }
.f-pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f-pager .btn { min-width: 0; }
.f-pager .btn:last-child:not(:first-child) { justify-content: flex-end; }
.f-pager .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.area-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: -2px 0 16px; }
.area-nav .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--c); transform: rotate(45deg); margin-right: 8px; display: inline-block; }
.isla { scroll-margin-top: calc(var(--top-h) + 44px); }

/* ---------- Inicio y entrada ---------- */
.home { position: fixed; inset: 0; z-index: 10; overflow: auto; overscroll-behavior: contain; }
.home-in { max-width: 1180px; margin: 0 auto; padding-top: calc(var(--top-h) + 40px + env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--dock-h) + 40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.login-on .home-in { padding-bottom: 60px; }

/* ---------- Lecciones narradas: pantalla de video con diapositivas ---------- */
.lesson { position: fixed; inset: 0; z-index: 35; overflow: auto; overscroll-behavior: contain; background: var(--papel);
  padding: calc(var(--top-h) + 40px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.l-wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; animation: rise .25s ease-out; }
.l-head { display: flex; gap: 12px; align-items: flex-start; }
.l-head h2 { font-size: clamp(24px, 3vw, 34px); margin-top: 2px; }
.l-head .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l-screen { border-radius: 28px; overflow: hidden; background: #fff; box-shadow: var(--sh); border: 1px solid var(--linea); }
.l-slide { height: clamp(280px, 46vh, 480px); position: relative; }
.lsl { position: absolute; inset: 0; padding: clamp(18px, 3.4vw, 40px); background: var(--c); color: #fff; overflow: hidden; animation: slideIn .45s cubic-bezier(.2, .8, .2, 1); }
.lsl::before { content: ""; position: absolute; inset: 0; opacity: .14; background-image: radial-gradient(circle at 25% 25%, #fff 0 9%, transparent 10%), radial-gradient(circle at 75% 75%, #fff 0 9%, transparent 10%), linear-gradient(45deg, transparent 46%, #fff 46% 54%, transparent 54%), linear-gradient(-45deg, transparent 46%, #fff 46% 54%, transparent 54%); background-size: 64px 64px; pointer-events: none; }
.lsl > * { position: relative; }
@keyframes slideIn { from { opacity: 0; transform: translateX(26px); } }
.lsl .eyebrow { color: rgba(255, 255, 255, .88); }
.lsl h3 { font-size: clamp(26px, 3.6vw, 46px); line-height: 1.02; margin: 4px 0 8px; }
.lsl .nv { background: rgba(255, 255, 255, .94); }
.sl-tema { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.4fr); gap: clamp(16px, 3vw, 36px); align-items: center; }
.sl-side { display: grid; justify-items: start; gap: 6px; }
.az.xl { width: clamp(90px, 12vw, 150px); height: clamp(90px, 12vw, 150px); font-size: clamp(30px, 4vw, 52px); border-radius: 24px; border-width: 5px; margin-bottom: 8px; animation: bob 4s ease-in-out infinite; }
.az.xl.long { font-size: clamp(22px, 2.8vw, 36px); }
.sl-main { background: #fff; color: var(--tinta); border-radius: 24px; padding: clamp(14px, 2.4vw, 26px); box-shadow: 0 6px 0 var(--cd); }
.sl-rule { margin: 0 0 14px; font-family: var(--f-head); font-weight: 700; font-size: clamp(19px, 2.2vw, 27px); line-height: 1.2; }
.sl-ej { display: flex; flex-wrap: wrap; gap: 8px; }
.sl-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; font-weight: 700; font-size: clamp(15px, 1.6vw, 19px); line-height: 1.3; animation: rise .4s ease-out backwards; animation-delay: calc(.5s + var(--k) * .35s); }
.sl-chip i { font-style: normal; flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 14px; }
.sl-chip.si { background: var(--ok-bg); color: #0b6b3c; } .sl-chip.si i { background: var(--ok); }
.sl-chip.no { background: var(--bad-bg); color: #8d2a36; text-decoration: line-through; text-decoration-color: rgba(226, 59, 78, .5); } .sl-chip.no i { background: var(--bad); }
.sl-area { display: grid; align-content: center; gap: 4px; }
.sl-area p { margin: 0 0 14px; font-size: clamp(16px, 1.8vw, 21px); color: rgba(255, 255, 255, .92); }
.sl-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sl-tile { display: flex; align-items: center; gap: 10px; background: #fff; color: var(--tinta); border-radius: 16px; padding: 8px; animation: rise .4s ease-out backwards; animation-delay: calc(.3s + var(--k) * .12s); }
.sl-tile .az { width: 44px; height: 44px; font-size: 15px; border-width: 2.5px; border-radius: 10px; }
.sl-tile b { font-size: 14.5px; line-height: 1.2; }
.sl-cover { display: flex; align-items: center; gap: clamp(14px, 3vw, 40px); }

.l-cap { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px 18px; border-top: 1px solid var(--linea); }
.l-xochi .mascota { width: 58px; height: 58px; }
.l-cap b { font-family: var(--f-head); font-size: 20px; color: var(--cd); }
.l-say { margin: 2px 0 0; font-size: 19px; line-height: 1.6; max-width: 80ch; }

.l-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Galería tipo video */
.lessons-card { width: min(1060px, 100%); }

@media (max-width: 760px) {

/* ================= Atlas de Inglés: piezas nuevas ================= */

.ejq .orig { font-style: italic; margin: 0 0 8px; color: var(--muted); }

.team .pts { font-family: var(--f-head); font-weight: 800; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.team .row { justify-content: center; gap: 6px; }
.team button { width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, .25); font-weight: 800; font-size: 20px; color: #fff; }
.kit-full { position: fixed; inset: 0; z-index: 72; background: var(--cobalto); color: #fff; display: grid; place-content: center; justify-items: center; gap: 20px; padding: 20px; text-align: center; }
.kit-full .timer { color: #fff; font-size: clamp(110px, 24vw, 280px); }
.kit-full .timer.low { color: #ffb4ba; }
.kit-full .picked { color: #fff; font-size: clamp(56px, 11vw, 140px); }

/* Pronunciación: pares mínimos */
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pairs .opt { min-height: 96px; font-size: clamp(26px, 4vw, 40px); font-family: var(--f-head); }
.ipa { font-family: 'Atkinson Hyperlegible', 'Segoe UI', sans-serif; color: var(--muted); font-weight: 400; font-size: .7em; display: block; }
.lab-in { width: 100%; min-height: 90px; font: inherit; font-size: 22px; padding: 12px 14px; border-radius: 16px; border: 3px solid var(--linea); color: var(--tinta); resize: vertical; }
.lab-words { display: flex; flex-wrap: wrap; gap: 8px; }
.lab-words button { padding: 6px 12px; border-radius: 12px; background: var(--suave); font-weight: 700; font-size: 18px; border: 2px solid transparent; }
.lab-words button:hover { border-color: var(--c); }
.slider-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 700; }
.slider-row input { flex: 1; min-width: 160px; accent-color: var(--rosa); }

/* Diapositivas de práctica */
.slide .opts { margin-top: 18px; }
.slide .opt { font-size: clamp(20px, 2.2vw, 28px); min-height: 72px; }
.slide .reveal { margin-top: 18px; }
.slide .ans { display: none; margin-top: 16px; background: var(--ok-bg); color: #0b6b3c; border-radius: 18px; padding: 14px 18px; font-size: clamp(20px, 2.2vw, 28px); }
.slide .ans.on { display: block; animation: pop .25s ease-out; }
.slide .q-big { font-family: var(--f-head); font-weight: 800; font-size: clamp(30px, 4vw, 56px); line-height: 1.12; margin: 6px 0 4px; }
.slide .say.big { vertical-align: middle; }

/* Lecciones: miniaturas sin imagen */
.vthumb.gen { display: grid; place-items: center; background: var(--c); }
.vthumb.gen::before { content: ""; position: absolute; inset: 0; opacity: .16; background-image: linear-gradient(rgba(255,255,255,.9) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.9) 1px, transparent 1px); background-size: 22px 22px; }
.vthumb.gen .az { position: relative; width: 70px; height: 70px; font-size: 22px; }
.l-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.l-en { font-style: italic; }

/* Insignia de acento */
.acc-btn { display: flex; height: 44px; border-radius: 14px; border: 2px solid var(--linea); background: #fff; padding: 3px; gap: 2px; flex: none; }
.acc-btn span { display: grid; place-items: center; min-width: 40px; border-radius: 10px; color: var(--muted); font-weight: 700; font-size: 14px; font-family: var(--f-head); }
.acc-btn span.on { background: var(--cobalto); color: #fff; }
@media (max-width: 760px) {
  .ladder { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .plan-step { grid-template-columns: 54px minmax(0, 1fr); }
  .plan-step .min { font-size: 20px; }
  .acc-btn { display: none; }
  .pairs .opt { min-height: 78px; }
}
.blank { display: inline-block; min-width: 54px; color: var(--cd, var(--cobalto)); font-weight: 800; letter-spacing: -.05em; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
.chipb svg { width: 20px; height: 20px; vertical-align: -4px; margin-right: 4px; }
.kit { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.kit label.row { display: flex; flex-wrap: nowrap; }
.vthumb.gen .vplay { left: auto; top: auto; right: 10px; bottom: 34px; margin: 0; width: 44px; height: 44px; }
.vthumb.gen .vplay svg { width: 22px; height: 22px; }
.vthumb.gen .az { width: 84px; height: 84px; font-size: 24px; }
.vthumb.gen .az.long { font-size: 17px; }
.f-body { grid-template-columns: minmax(0, 1fr); }
.lis-row { display: flex; flex-wrap: wrap; }
.lis-row .gap-in { flex: 1 1 180px; }
.lis-row .fb { flex-basis: 100%; }
.ejs, .reglas, .wtasks, .plan, .lis, .exams, .doc-sec { grid-template-columns: minmax(0, 1fr); }
.ejq .opts { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
@media (max-width: 760px) { .ejq .opts { grid-template-columns: minmax(0, 1fr); } .ej-cols { grid-template-columns: minmax(0, 1fr); } .voc { grid-template-columns: minmax(0, 1fr); } }

/* ================= Rediseño: póster de Londres + experiencia tipo Duolingo =================
   Papel crema de póster, azul marino de Tower Bridge, rojo de autobús y cabina, vino para los títulos en letra script.
   Tema claro deliberado (single look), pensado para proyectar y para que los niños lo sientan como un juego. */
:root {
  color-scheme: light;
  --papel: #fbf0dc; --card: #fffdf8; --tinta: #1f2547; --muted: #6b6680; --linea: #ecdcc0; --suave: #f7ead2;
  --cobalto: #1d3a70; --cobalto-d: #12264d; --rosa: #d7263d; --rosa-d: #a8172a; --cempa: #f2b33d; --cempa-d: #c98a00; --turquesa: #1ba9b5; --turquesa-d: #13848d;
  --wine: #7b1e2e; --sky: #8ec5e8; --stone: #e6c27f;
  --ok: #58cc02; --ok-d: #58a700; --ok-bg: #d7ffb8; --bad: #ff4b4b; --bad-d: #ea2b2b; --bad-bg: #ffdfe0; --hint: #fff1cf; --hint-fg: #7a4d00;
  --gram: #7b5cd6; --gram-d: #5b3fb3; --gram-l: #efe9ff; --voc: #f08a24; --voc-d: #c0650c; --voc-l: #fff0df;
  --pron: #1ba9b5; --pron-d: #13848d; --pron-l: #dcf6f8; --rw: #2f6fe4; --rw-d: #1b52bf; --rw-l: #e3ecff; --oral: #e2445c; --oral-d: #b72640; --oral-l: #ffe4ea;
  --f-head: 'Fredoka', 'Nunito', 'Trebuchet MS', system-ui, sans-serif; --f-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif; --f-script: 'Pacifico', 'Brush Script MT', cursive;
  --side-w: 236px; --top-h: 64px;
  --sh: 0 2px 0 rgba(123, 30, 46, .06), 0 16px 34px -18px rgba(29, 58, 112, .35); --sh-s: 0 2px 0 rgba(123, 30, 46, .05), 0 8px 18px -12px rgba(29, 58, 112, .3);
}
body { background-color: var(--papel); background-image: radial-gradient(rgba(123, 30, 46, .07) 1.2px, transparent 1.6px); background-size: 22px 22px; color: var(--tinta); font-family: var(--f-body); font-weight: 600; }
h1, h2, h3, h4 { font-family: var(--f-head); font-weight: 700; letter-spacing: 0; }
.script { font-family: var(--f-script); font-weight: 400; color: var(--wine); letter-spacing: .01em; }
.kicker { margin: 0; font-family: var(--f-head); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: 13px; color: var(--rosa); }

/* Botones gruesos con sombra sólida, al estilo Duolingo */
.btn { border-radius: 16px; font-family: var(--f-head); font-weight: 700; letter-spacing: .02em; box-shadow: 0 4px 0 var(--cd); }
.btn.ok { --c: var(--ok); --cd: var(--ok-d); }
.btn.bad { --c: var(--bad); --cd: var(--bad-d); }
.btn.blanco { --c: var(--card); --cd: var(--linea); color: var(--tinta); border: 2px solid var(--linea); }
.btn.gem-btn { --c: #1f8fd6; --cd: #146ca5; }
.btn.gem-btn svg { width: 20px; height: 20px; }
.btn:disabled { filter: none; background: #e5e0d6; box-shadow: 0 4px 0 #cfc8bb; color: #a49d8f; border-color: transparent; }

/* ---------- Barra superior ---------- */
.top-in { background: rgba(255, 253, 248, .94); border-bottom: 2px solid var(--linea); }
.top .picado { background-color: transparent; height: 22px; background-size: 150px 24px; }
.brand { background: var(--rosa); box-shadow: 0 4px 0 var(--rosa-d); }
.brand b { font-family: var(--f-script); font-weight: 400; font-size: 20px; }
.crumb { font-family: var(--f-head); }
.pill { border-radius: 14px; border: 2px solid var(--linea); background: var(--card); font-family: var(--f-head); }
.pill.gem { color: #1f8fd6; } .pill.heart { color: var(--bad); }
.pill.big { height: 50px; font-size: 20px; padding: 0 16px; display: inline-flex; margin-top: 8px; }
.pill svg { width: 22px; height: 22px; }
.acc-btn span { gap: 4px; display: inline-flex; align-items: center; padding: 0 8px; }
.acc-btn span svg { border-radius: 3px; }
.search input { background: var(--suave); border-color: var(--linea); }
.perfil { border-color: var(--linea); background: var(--card); }

/* ---------- Menú: lateral en escritorio, inferior en celular ---------- */
.dock { background: var(--card); border: 2px solid var(--linea); }
.tab { color: var(--muted); font-family: var(--f-head); font-weight: 700; position: relative; border: 2px solid transparent; }
.tab svg { color: var(--tc); }
.tab:hover { background: var(--suave); }
.tab[aria-current="true"] { background: color-mix(in srgb, var(--tc) 12%, #fff); color: var(--tc); border-color: color-mix(in srgb, var(--tc) 45%, #fff); box-shadow: none; }
.tab .dot-n { position: absolute; top: 6px; right: 12px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--rosa); color: #fff; font-style: normal; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
.side-logo { display: none; }
.tab.d-only { display: none; }
@media (min-width: 1000px) {
  .dock { left: 0; top: 0; bottom: 0; transform: none; width: var(--side-w); max-width: none; border-radius: 0; border-width: 0 2px 0 0; flex-direction: column; gap: 6px; overflow-y: auto; box-shadow: none;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 14px calc(18px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
  .side-logo { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 4px 10px 16px; line-height: 1; }
  .side-logo .script { font-family: var(--f-script); font-size: 34px; color: var(--wine); }
  .side-logo small { grid-column: 1; font-family: var(--f-head); font-weight: 700; color: var(--cobalto); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
  .side-logo svg { grid-row: 1 / span 2; grid-column: 2; border-radius: 4px; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
  .tab, .tab.d-only { display: flex; flex-direction: row; justify-content: flex-start; gap: 14px; width: 100%; height: 52px; min-width: 0; padding: 0 14px; font-size: 15.5px; text-transform: uppercase; letter-spacing: .05em; border-radius: 14px; }
  .tab svg { width: 28px; height: 28px; }
  .tab.m-only { display: none; }
  .top { left: var(--side-w); }
  .top .brand { display: none; }
  .home { left: var(--side-w); }
  .home-in { padding-bottom: 60px; }
  .login-on .home, .login-on .top { left: 0; }
  .login-on .top .brand { display: flex; }
  .lesson { left: var(--side-w); }
}
@media (max-width: 999px) { .tab.m-only { display: flex; } }
.login-on .dock { display: none; }

/* ---------- Portada (login): póster de Londres ---------- */
.poster { position: relative; border-radius: 32px; overflow: hidden; background: linear-gradient(#fbe6c0, #f8dcae 70%, #f3cf98); min-height: 460px; box-shadow: var(--sh); border: 3px solid #f0d3a2; isolation: isolate; }
.poster-txt { position: relative; z-index: 3; text-align: center; padding: 34px 16px 0; display: grid; justify-items: center; gap: 4px; }
.poster h1.script { font-size: clamp(54px, 10vw, 112px); line-height: 1.12; color: var(--wine); text-shadow: 0 3px 0 rgba(255, 255, 255, .7); margin: 0; }
.poster-sub { margin: 0; font-family: var(--f-head); font-weight: 600; color: var(--cobalto); font-size: clamp(16px, 2vw, 21px); background: rgba(255, 253, 248, .78); padding: 6px 16px; border-radius: 999px; }
.scene { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.scene .sc { position: absolute; display: block; }
.scene .sun { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(#fff6dc, rgba(255, 246, 220, 0) 68%); left: 50%; top: 20px; transform: translateX(-50%); }
.scene .spark { color: #fff; font-size: 26px; text-shadow: 0 0 10px rgba(255, 255, 255, .9); animation: twinkle 3s ease-in-out infinite; }
.scene .s1 { left: 30%; top: 26px; } .scene .s2 { right: 28%; top: 60px; animation-delay: 1s; } .scene .s3 { left: 57%; top: 150px; font-size: 18px; animation-delay: 2s; }
@keyframes twinkle { 50% { opacity: .3; transform: scale(.7); } }
.scene .eye { width: 34%; max-width: 330px; right: 16%; bottom: 40px; opacity: .9; }
.scene .bigben { height: 92%; left: 3%; bottom: 20px; }
.scene .bridge { width: 64%; left: 18%; bottom: 30px; }
.scene .flag1 { width: 110px; left: 9%; top: 120px; transform: rotate(-12deg); animation: flagw 3s ease-in-out infinite; transform-origin: 6% 100%; }
.scene .flag2 { width: 110px; right: 4%; top: 110px; transform: scaleX(-1) rotate(-12deg); animation: flagw2 3.4s ease-in-out infinite; transform-origin: 6% 100%; }
@keyframes flagw { 50% { transform: rotate(-4deg); } } @keyframes flagw2 { 50% { transform: scaleX(-1) rotate(-4deg); } }
.scene .bus { width: 150px; left: 8%; bottom: 14px; animation: busgo 9s ease-in-out infinite; }
@keyframes busgo { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(40px); } }
.scene .guard { height: 190px; left: 47%; bottom: 10px; }
.scene .phone { height: 180px; right: 10%; bottom: 10px; }
.scene .ground { left: 0; right: 0; bottom: 0; height: 26px; background: repeating-linear-gradient(90deg, #c9a46a 0 26px, #d8b47a 26px 52px); }
.login-sheet .sec-h { margin-bottom: 18px; }
.login-sheet .sec-h p { font-weight: 600; }
.mascota.mini { width: 74px; height: 74px; flex: none; }
.mascota.big { width: 170px; height: 170px; }
.player { background: var(--card); border-color: var(--linea); box-shadow: 0 5px 0 var(--linea); }
.player.doc { background: var(--cobalto); border-color: var(--cobalto); box-shadow: 0 5px 0 var(--cobalto-d); }
.player.doc small { color: #d6e2ff; }
.player.new { background: rgba(255, 253, 248, .7); }

/* ---------- Distribución de 2 columnas (camino + columna derecha) ---------- */
.duo { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 30px; align-items: start; width: 100%; max-width: 1080px; margin: 0 auto; }
.duo-main { display: grid; gap: 22px; min-width: 0; }
.duo-rail { position: sticky; top: 8px; display: grid; gap: 16px; }
@media (max-width: 1180px) { .duo { grid-template-columns: minmax(0, 1fr); } .duo-rail { display: none; } }
.rail-stats { display: flex; gap: 8px; justify-content: space-between; }
.rail-stats .pill { flex: 1; justify-content: center; padding: 0 6px; }
.rcard { background: var(--card); border: 2px solid var(--linea); border-radius: 20px; padding: 16px; }
.rcard h3 { font-size: 19px; }
.rc-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.link { color: var(--rw); font-weight: 800; font-family: var(--f-head); text-transform: uppercase; font-size: 13px; letter-spacing: .06em; }
.league-mini, .cam-mini { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; cursor: pointer; }
.league-mini p, .cam-mini p { margin: 4px 0 0; font-size: 14.5px; color: var(--muted); }
.shield { width: 60px; height: 70px; }
.cm-art { height: 120px; width: auto; justify-self: center; }
.cam-mini .btn { margin-top: 8px; }
.goal { display: flex; gap: 12px; align-items: center; }
.goal .ring { width: 58px; height: 58px; flex: none; }
.goal b { display: block; font-family: var(--f-head); font-size: 18px; }
.goal small { color: var(--muted); font-weight: 700; }
.quest { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; border-bottom: 2px solid var(--suave); }
.quest:last-of-type { border-bottom: 0; }
.quest .qi { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--hint); color: var(--cempa-d); }
.quest .qi svg { width: 24px; height: 24px; }
.quest.done .qi { background: var(--ok-bg); color: var(--ok-d); }
.quest b { font-family: var(--f-head); font-size: 16px; }
.quest.sm b { font-size: 14.5px; }
.qbar { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.qbar .bar { flex: 1; height: 14px; border-radius: 7px; background: var(--suave); overflow: hidden; }
.qbar .bar i { display: block; height: 100%; background: var(--cempa); border-radius: 7px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .08); }
.quest.done .qbar .bar i { background: var(--ok); }
.qbar em { font-style: normal; font-weight: 800; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Camino de aprendizaje ---------- */
.sec-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.sec-tabs::-webkit-scrollbar { display: none; }
.sec-tabs button { flex: none; display: grid; text-align: left; padding: 8px 14px; border-radius: 14px; border: 2px solid var(--linea); background: var(--card); font-family: var(--f-head); line-height: 1.15; }
.sec-tabs button b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sec-tabs button span { font-size: 17px; font-weight: 700; color: var(--tinta); }
.sec-tabs button[aria-pressed="true"] { background: var(--c); border-color: var(--c); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 70%, #000); }
.sec-tabs button[aria-pressed="true"] b, .sec-tabs button[aria-pressed="true"] span { color: #fff; }
.sec-hero { position: relative; display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: center; padding: 20px 22px; border-radius: 26px; background: var(--c); color: #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 68%, #000); overflow: hidden; }
.sec-hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .16) 1.5px, transparent 2px); background-size: 18px 18px; pointer-events: none; }
.sec-hero > * { position: relative; }
.sec-hero .kicker { color: rgba(255, 255, 255, .85); }
.sec-hero h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.05; margin: 4px 0; }
.sec-hero h1 .script { color: #fff6dc; font-size: .78em; margin-left: 6px; }
.sec-hero p { margin: 0 0 8px; font-weight: 700; }
.sec-art { width: 100%; max-height: 170px; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .15)); background: #fff6e4; border-radius: 22px; padding: 10px; }
.sec-prog { display: flex; gap: 10px; align-items: center; margin: 4px 0 12px; max-width: 420px; }
.sec-prog .bar { flex: 1; height: 16px; border-radius: 8px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.sec-prog .bar i { display: block; height: 100%; background: var(--cempa); border-radius: 8px; }
.sec-prog em { font-style: normal; font-weight: 800; font-size: 14px; white-space: nowrap; }
.path { display: grid; gap: 8px; }
.unit-b { position: relative; }
.unit { position: relative; display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 20px; background: var(--c); color: #fff; box-shadow: 0 5px 0 var(--cd); }
.unit > div { flex: 1; min-width: 0; }
.unit small { font-family: var(--f-head); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .85; font-size: 12.5px; }
.unit h3 { font-size: 23px; margin: 2px 0; }
.unit p { margin: 0; font-size: 14.5px; opacity: .92; line-height: 1.35; }
.unit .guide { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 12px; border-radius: 14px; border: 2px solid rgba(255, 255, 255, .45); color: #fff; font-family: var(--f-head); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
.unit .guide:hover { background: rgba(255, 255, 255, .15); }
.unit .guide svg { width: 24px; height: 24px; }
.unit .crown { position: absolute; top: -12px; right: -6px; font-size: 26px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .2)); }
.nodes { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 30px 0 40px; }
.node-w { position: relative; display: grid; justify-items: center; }
.node { width: 74px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: #e5e0d6; color: #b3ab9b; box-shadow: 0 7px 0 #cfc8bb; transition: transform .1s; }
.node svg { width: 34px; height: 34px; }
.node:hover { transform: translateY(-2px); }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 #cfc8bb; }
.node.done { background: var(--c); color: #fff; box-shadow: 0 7px 0 var(--cd); }
.node.cur { background: var(--c); color: #fff; box-shadow: 0 7px 0 var(--cd), 0 0 0 8px var(--card), 0 0 0 12px color-mix(in srgb, var(--c) 35%, #fff); }
.node.trophy { border-radius: 22px; width: 80px; }
.node.trophy.done { background: var(--cempa); box-shadow: 0 7px 0 var(--cempa-d); }

U("a1-1", "A1", "Hello! All about me", "Puedo presentarme: nombre, edad, país y familia.", {
  g: ["Verb to be", [
    ["am, is, are", "<p>El verbo <b>to be</b> significa <i>ser</i> o <i>estar</i>.</p><ul><li><b>I am</b> (I'm)</li><li><b>He / She / It is</b> (he's, she's, it's)</li><li><b>You / We / They are</b> (you're, we're, they're)</li></ul>", "I <b>am</b> eleven. My sister <b>is</b> six."],

    ["mc", "They ___ my cousins.", "are", ["is", "am"], "Con <b>they</b> usamos <b>are</b>."],
    ["mc", "___ you from Mexico?", "Are", ["Is", "Am"], "Pregunta con <i>you</i>: <b>Are you…?</b>"],
    ["mc", "She ___ tall. She is short.", "isn't", ["aren't", "amn't"], "Negativo de <i>she is</i>: <b>isn't</b>."],
    ["gap", "We ___ in the same class.", "are", "<i>We</i> va con <b>are</b>."],
    ["gap", "How ___ are you? I'm ten.", "old", "La edad se pregunta con <b>How old</b>."],
    ["ord", "Where are you from?", "Pregunta: palabra interrogativa + verbo + persona."],
    ["ord", "My brother is very tall.", "Persona + verbo + descripción."],
    ["mc", "Is he your teacher? Yes, he ___.", "is", ["isn't", "are"], "Respuesta corta afirmativa: <b>Yes, he is.</b>"]],
  r: { t: "Meet Leo", x: `Hi! My name is Leo. I'm ten years old and I'm from Monterrey, in Mexico. I've got a big family. My mum is a teacher and my dad is a doctor. My sister's name is Ana. She is six and she is very funny.

      ["What is his mum's job?", "She is a teacher.", "She is a doctor.", "She is a student.", "“My mum is a teacher”."],

    ["Preposiciones de lugar", "<ul><li><b>in</b> · dentro de</li><li><b>on</b> · sobre</li><li><b>under</b> · debajo de</li><li><b>next to</b> · al lado de</li><li><b>behind</b> · detrás de</li></ul>", "The cat is <b>under</b> the bed."]]],

    ["Adverbios de frecuencia", "<p><b>always</b> (100%) · <b>usually</b> · <b>often</b> · <b>sometimes</b> · <b>never</b> (0%). Van antes del verbo, pero después de <b>be</b>.</p>", "I <b>always</b> have breakfast. I'm <b>never</b> late."]]],

    ["mc", "We ___ lunch at two o'clock.", "have", ["has", "haves"], "Con <b>we</b> el verbo no cambia."],
    ["mc", "Tom ___ his homework after school.", "does", ["do", "dos"], "<i>do</i> con he/she/it → <b>does</b>."],

  r: { t: "How fake news spreads", x: `A study carried out by university researchers found that false stories on social media are shared more quickly than true ones. Around 126,000 stories, which had been posted by about three million people, were analysed. The researchers found that a false story reached 1,500 people about six times faster than a true story.

  r: { t: "Lessons I learnt the hard way", x: `When I was sixteen, I was offered a place on a summer exchange programme in Ireland. I turned it down. I told everyone it was because I wanted to work and save money, but the truth was simpler: I was scared. I had never travelled alone, and I was worried that my English wasn't good enough.

  r: { t: "Graduation speech (extract)", x: `Not once during my first year at this school did I imagine I would be standing here today. I was, by my own admission, the student who sat at the back and said nothing. Only when a teacher asked me to take part in a debate competition did I begin to discover what I was capable of.

  r: { t: "Why some students thrive", x: `What separates students who thrive from those who merely survive? It isn't, as many assume, raw intelligence. A long-term study of secondary school pupils found that it was students' habits, rather than their test scores at the age of eleven, that best predicted their success at eighteen.

  r: { t: "The mystery of the Mary Celeste", x: `In December 1872, the crew of a British ship spotted another vessel drifting in the Atlantic. It was the Mary Celeste, which had left New York a month earlier. When they boarded, they found it completely deserted. The cargo was almost untouched, there was food and water for six months, and the crew's belongings were still on board. The only lifeboat, however, was missing.

  r: { t: "Does homework work?", x: `The value of homework has long been a subject of debate among educators, and the evidence remains, to some extent, inconclusive. A number of large-scale reviews suggest that homework tends to have a positive effect on achievement in secondary school, whereas its benefits for younger children appear to be minimal.

  r: { t: "On learning languages late", x: `There is a widely held belief that if you haven't mastered a language by adolescence, you have missed the boat. By and large, the research paints a more nuanced picture. Yes, children who are immersed early tend to achieve a native-like accent; but adults, armed with better strategies and a more developed understanding of grammar, often make faster progress in the initial stages.

  r: { t: "Letter to the editor", x: `Sir,

  r: { t: "The road not taken", x: `Counterfactual thinking, the habit of imagining how things might have turned out differently, is often dismissed as a futile form of regret. Yet psychologists increasingly regard it as one of the mind's most sophisticated tools. When we tell ourselves that, had we left five minutes earlier, we would not be stuck in traffic now, we are in effect running a simulation: isolating a cause, altering it and predicting an outcome.
The direction of the comparison matters. 'Upward' counterfactuals, imagining a better alternative, tend to make us feel worse in the short term but can motivate change: if I had prepared properly, I would be feeling confident now, so next time I will. 'Downward' counterfactuals, picturing how things could have been worse, offer comfort; Olympic bronze medallists, studies suggest, are often happier than silver medallists, who are haunted by how close they came to gold.
The danger lies not in contemplating the road not taken but in dwelling on it. It is high time, perhaps, that we stopped treating 'what if' as a weakness and started using it as a rehearsal for decisions yet to come.`,

/* ---------- Grammar ---------- */
tema({ id: 'tobe', isla: 'gram', n: 'Verb to be', g: 'am', lv: ['a1'], from: 'a1-1',
  intro: 'El verbo «to be» significa ser o estar. Es el primer verbo que aprendemos porque con él decimos nombre, edad, origen, profesión y cómo nos sentimos. Tiene tres formas en presente: am, is y are. En inglés la edad se dice con «be»: I am ten (no «I have ten»).',
  err: [['I have ten years.', 'I am ten (years old).', 'La edad va con «be», no con «have».'], ['She is teacher.', 'She is a teacher.', 'Las profesiones llevan «a / an».'], ['Is very cold.', 'It is very cold.', 'En inglés el sujeto nunca se omite.']],
  sab: 'En inglés el sujeto nunca se omite. En español decimos «Es mi amigo», pero en inglés siempre hay que decir «He is my friend». Hasta para el clima: «It is hot».',
  manos: 'Tarjetas de identidad: cada alumno crea una «ID card» (name, age, country, favourite colour) y se presenta al grupo. Después, en parejas, presentan a su compañero en tercera persona: «This is Ana. She is ten. She is from Puebla.»',
  cam: 'Pre A1 Starters y A1 Movers · Speaking (preguntas personales: What\'s your name? How old are you?) y Reading & Writing Part 4–5.',
  jue: ['oraciones', 'memorama', 'speaking'] });

tema({ id: 'pronombres', isla: 'gram', n: 'Pronouns & possessives', g: 'my', lv: ['a1', 'a2'],
  intro: 'Los pronombres sustituyen a los nombres para no repetirlos. En inglés hay pronombres de sujeto (I, you, he, she, it, we, they), de objeto (me, you, him, her, it, us, them) y adjetivos posesivos (my, your, his, her, its, our, their). Para decir de quién es algo también usamos el genitivo sajón: Ana\'s book (el libro de Ana).',
  reglas: [
    { h: 'Subject pronouns', t: 'Van antes del verbo: I, you, he, she, it, we, they. «It» es para cosas y animales.', ok: ['<b>She</b> is my sister.', '<b>It</b> is a big dog.'], no: ['Is my sister.'] },
    { h: 'Object pronouns', t: 'Van después del verbo o de una preposición: me, you, him, her, it, us, them.', ok: ['Can you help <b>me</b>?', 'I like <b>them</b>.'], no: ['Can you help I?'] },
    { h: 'Possessive adjectives', t: 'Van antes del sustantivo y no cambian en plural: my, your, his, her, its, our, their.', ok: ['<b>Their</b> house is blue.', '<b>His</b> sisters are tall.'], no: ['Hiss sisters are tall.', 'Theirs house is blue.'] },
    { h: "Possessive 's", t: "Agrega 's a la persona dueña. Si el plural ya termina en -s, solo agrega el apóstrofo.", ok: ["Ana<b>'s</b> bike", "my parents<b>'</b> car"], no: ['the bike of Ana'] },
    { h: 'his / her', t: '«His» si el dueño es hombre; «her» si es mujer. No depende de la cosa poseída.', ok: ['Luis and <b>his</b> mother.', 'Sofía and <b>her</b> father.'], no: ['Sofía and his father.'] },
  ],
  err: [['Sofía loves his dog.', 'Sofía loves her dog.', 'El posesivo concuerda con el dueño, no con el objeto.'], ['The book of Pedro.', "Pedro's book.", "Con personas usa 's."]],
  ej: [
    ['mc', 'Carlos is my friend. ___ is from Mérida.', 'He', ['She', 'Him'], 'Carlos es hombre y es sujeto: <b>he</b>.'],
    ['mc', 'Can you give ___ the ball, please?', 'me', ['I', 'my'], 'Después del verbo va el pronombre objeto: <b>me</b>.'],
    ['mc', 'Mariana is reading ___ book.', 'her', ['his', 'she'], 'La dueña es Mariana: <b>her</b>.'],
    ['mc', 'We love ___ new teacher.', 'our', ['us', 'we'], 'Posesivo de we: <b>our</b>.'],
    ['mc', 'This is ___ bike.', "Diego's", ['Diego', 'of Diego'], "Genitivo sajón: <b>Diego's</b>."],
    ['gap', 'The children are playing with ___ toys. (they)', 'their', 'Posesivo de they: <b>their</b>.'],
    ['gap', "I don't know ___. Who is he? (he)", 'him', 'Objeto de he: <b>him</b>.'],
    ['ord', 'Her brother is my best friend.', 'Posesivo + sustantivo + verbo + complemento.'],
  ],
  voc: 'I:yo|me:me, a mí|my:mi, mis|mine:mío, mía|his:su (de él)|her:su (de ella), la|their:su (de ellos)|our:nuestro',
  preg: ['Tell me about your family. What are their names?', "What is your best friend's favourite food?", 'Who is your favourite singer? Why do you like him or her?'],
  lis: ['This is my brother. His name is Pablo.', 'Their house is next to our school.', "Is this Laura's pencil case?", 'Can you help us, please?'],
  wri: ['Dibuja a tu familia y escribe una oración de cada persona con his o her.', 'Write a short text about your best friend and his or her family.', 'Write a profile of a person you admire: who they are and what their achievements are.'],
  sab: 'El inglés antiguo distinguía entre «thou» (tú) y «you» (usted o ustedes). Hoy solo queda «you» para todo, por eso no cambia entre singular, plural, formal o informal.',
  manos: '¿De quién es? El docente recoge un objeto de cada alumno en una caja. Saca uno y pregunta «Whose pencil is this?». El grupo responde «It\'s Tania\'s pencil. It\'s her pencil.»',
  cam: 'Pre A1 Starters y A1 Movers · Reading & Writing (completar textos) · A2 Key Part 5 (open cloze: pronombres y posesivos son respuestas frecuentes).',
  jue: ['oraciones', 'quiz'] });

tema({ id: 'articulos', isla: 'gram', n: 'a / an, the & plurals', g: 'a/an', lv: ['a1'],
  intro: 'Los artículos acompañan a los sustantivos. «A» y «an» significan un o una y se usan con cosas que se pueden contar en singular. «The» es el, la, los o las y se usa cuando ya sabemos de qué cosa hablamos. Para formar el plural casi siempre agregamos -s, pero hay plurales irregulares.',
  reglas: [
    { h: 'a / an', t: '«A» antes de sonido de consonante; «an» antes de sonido de vocal. Importa el sonido, no la letra.', ok: ['<b>a</b> dog, <b>a</b> university', '<b>an</b> apple, <b>an</b> hour'], no: ['an university', 'a hour'] },
    { h: 'the', t: 'Úsalo cuando ya sabemos de qué cosa hablamos o solo hay una.', ok: ['I have a cat. <b>The</b> cat is black.', '<b>The</b> sun is hot.'], no: [] },
    { h: 'Sin artículo', t: 'Para hablar en general de cosas en plural o incontables, no usamos «the».', ok: ['I like <b>dogs</b>.', '<b>Music</b> is fun.'], no: ['I like the dogs (en general).', 'The music is fun (en general).'] },
    { h: 'Plurales regulares', t: '+s en general; +es después de s, sh, ch, x, o; consonante + y → ies.', ok: ['cats, buses, boxes, tomatoes', 'baby → babies'], no: ['babys', 'boxs'] },
    { h: 'Plurales irregulares', t: 'Algunos cambian por completo.', ok: ['man → men, woman → women, child → children', 'foot → feet, tooth → teeth, mouse → mice'], no: ['childs', 'foots'] },
  ],
  err: [['She is doctor.', 'She is a doctor.', 'Las profesiones llevan a / an.'], ['The life is beautiful.', 'Life is beautiful.', 'En general, sin «the».']],
  ej: [
    ['mc', 'I have ___ orange in my bag.', 'an', ['a', 'the'], 'Orange empieza con sonido de vocal: <b>an</b>.'],
    ['mc', 'She is ___ teacher.', 'a', ['an', '—'], 'Profesiones con <b>a</b>.'],
    ['mc', 'I saw a film yesterday. ___ film was great.', 'The', ['A', 'An'], 'Ya sabemos qué película: <b>the</b>.'],
    ['mc', 'The plural of «child» is…', 'children', ['childs', 'childrens'], 'Plural irregular: <b>children</b>.'],
    ['mc', 'Choose the correct plural.', 'boxes', ['boxs', 'boxies'], 'Después de x: <b>-es</b>.'],
    ['gap', 'It takes ___ hour to get there.', 'an', 'La h de hour no suena: <b>an hour</b>.'],
    ['gap', 'I brush my ___ every morning. (tooth)', 'teeth', 'tooth → <b>teeth</b>.'],
    ['ord', 'There is an elephant at the zoo.', 'There is + an + sustantivo + lugar.'],
  ],
  voc: 'apple:manzana|egg:huevo|umbrella:paraguas|hour:hora|child:niño, niña|children:niños|foot:pie|feet:pies',
  preg: ['What is in your schoolbag?', 'Have you got a pet? What is it like?', 'What animals can you see at the zoo?'],
  lis: ['I have an apple and a banana.', 'The children are in the park.', 'There are three boxes on the table.', 'My feet are cold.'],
  wri: ['Escribe 6 cosas de tu mochila con a o an.', 'Write a short description of your classroom using a, an and the.', 'Write a short paragraph about your hobbies using general plurals without «the».'],
  sab: '«Sheep» (oveja), «fish» (pez) y «deer» (venado) se escriben igual en singular y en plural: one sheep, ten sheep.',
  manos: 'Kim\'s game: el docente pone 10 objetos en una mesa, los tapa con un trapo y quita uno. Los equipos escriben qué falta usando a / an: «a ruler», «an eraser». Gana quien lo diga primero y bien escrito.',
  cam: 'Pre A1 Starters · Reading & Writing Part 1 y Speaking · A2 Key Part 5 (open cloze) incluye artículos con frecuencia.',
  jue: ['memorama', 'spelling', 'quiz'] });

tema({ id: 'thereis', isla: 'gram', n: 'There is / there are & prepositions', g: 'in·on', lv: ['a1'], from: 'a1-2',
  intro: '«There is» y «there are» significan «hay». Usamos «there is» con una sola cosa y «there are» con varias. Con las preposiciones de lugar (in, on, under, next to, behind, between, in front of) decimos dónde están las cosas.',
  err: [['There is two chairs.', 'There are two chairs.', 'Plural: there are.'], ['Have a park near my house.', 'There is a park near my house.', '«Hay» no se traduce con «have».']],
  sab: '«In front of» significa «delante de», no «enfrente de». Si algo está del otro lado de la calle, en inglés se dice «opposite» o «across the street from».',
  manos: 'Dictado de dibujo: el docente describe un cuarto («There is a bed next to the window. There are two cats under the table.») y los alumnos lo dibujan. Después comparan dibujos en parejas.',
  cam: 'Pre A1 Starters y A1 Movers · Listening Part 1 y 4 (escuchar y colocar objetos) y Speaking (describir una imagen).',
  jue: ['oraciones', 'dictado', 'speaking'] });

tema({ id: 'presimple', isla: 'gram', n: 'Present simple & routines', g: '-s', lv: ['a1', 'a2'], from: 'a1-3',
  intro: 'El presente simple sirve para hablar de rutinas, hábitos y verdades generales. Con he, she e it el verbo lleva -s (she plays). Para negar y preguntar usamos los auxiliares do y does. Los adverbios de frecuencia (always, usually, often, sometimes, never) dicen qué tan seguido hacemos algo.',
  err: [['She play football.', 'She plays football.', 'He / she / it → verbo + s.'], ["He don't like fish.", "He doesn't like fish.", 'Con he / she / it: doesn\'t.'], ['Does she plays?', 'Does she play?', 'Después de does, verbo sin -s.']],
  sab: 'La -s de la tercera persona es la única terminación que le queda al presente en inglés. Hace mil años, en inglés antiguo, el verbo cambiaba con cada persona, ¡como en español!',
  manos: 'Encuesta de rutinas: cada alumno pregunta a cinco compañeros «What time do you get up?» y «How often do you…?». Luego reportan al grupo en tercera persona: «Luis gets up at 6:30. He never has breakfast.»',
  cam: 'Pre A1 Starters a A2 Key · Speaking Part 1 (rutinas y vida diaria) y Writing (mensajes sobre tu día).',
  jue: ['oraciones', 'tiempos', 'arcade'] });

tema({ id: 'prescont', isla: 'gram', n: 'Present continuous', g: '-ing', lv: ['a1', 'a2'],
  intro: 'El presente continuo describe lo que está pasando ahora mismo o en este periodo. Se forma con am / is / are + verbo con -ing. También describimos imágenes con él: «In the picture, a boy is running».',
  reglas: [
    { h: 'Forma', t: 'Sujeto + am / is / are + verbo-ing.', ok: ['I <b>am reading</b>.', 'They <b>are playing</b> football.'], no: ['I reading.', 'They are play.'] },
    { h: 'Reglas de ortografía del -ing', t: 'Si termina en -e, se quita la e. Si es corto (consonante-vocal-consonante), se duplica la última consonante.', ok: ['make → making, write → writing', 'run → running, swim → swimming, sit → sitting'], no: ['makeing', 'runing'] },
    { h: 'Negativo y preguntas', t: 'Negativo con not; en preguntas el verbo be va primero.', ok: ["She <b>isn't</b> sleeping.", '<b>Are</b> you listening?'], no: ['She not sleeping.'] },
    { h: 'Simple vs continuous', t: 'Presente simple: rutina. Presente continuo: ahora.', ok: ['I usually <b>walk</b> to school, but today I <b>am going</b> by car.'], no: [] },
    { h: 'Verbos de estado', t: 'Verbos como like, love, want, know, need, understand casi nunca van en -ing.', ok: ['I <b>know</b> the answer.', 'She <b>wants</b> a pizza.'], no: ['I am knowing the answer.'] },
  ],
  err: [['I am agree.', 'I agree.', '«Agree» es un verbo, no un adjetivo.'], ['Look! It rains.', "Look! It's raining.", 'Algo que pasa ahora: continuo.']],
  ej: [
    ['mc', 'Shh! The baby ___.', 'is sleeping', ['sleeps', 'sleeping'], 'Pasa ahora: <b>is sleeping</b>.'],
    ['mc', 'Look! Those boys ___ football in the rain.', 'are playing', ['is playing', 'play'], 'Plural + ahora: <b>are playing</b>.'],
    ['mc', '___ you watching TV?', 'Are', ['Do', 'Is'], 'Pregunta en continuo con you: <b>Are</b>.'],
    ['mc', 'I ___ the answer.', 'know', ['am knowing', 'knowing'], '«Know» es verbo de estado.'],
    ['mc', 'Spelling: swim + ing = …', 'swimming', ['swiming', 'swimeing'], 'Se duplica la m.'],
    ['gap', "She isn't ___ (write) an email. She's reading.", 'writing', 'write → <b>writing</b> (sin e).'],
    ['gap', 'We usually go by bus, but today we ___ walking.', 'are', 'Hoy, ahora: <b>are walking</b>.'],
    ['ord', 'What are you doing right now?', 'Wh- + are + sujeto + verbo-ing.'],
  ],
  voc: 'right now:ahora mismo|at the moment:en este momento|today:hoy|look!:¡mira!|listen!:¡escucha!|wear:llevar puesto|wait:esperar|smile:sonreír',
  preg: ['What are you wearing today?', 'Look out of the window. What is happening?', 'What is your family doing right now, do you think?'],
  lis: ['Look! The cat is climbing the tree.', 'We are having lunch at the moment.', "I'm not watching TV. I'm doing my homework.", 'Is it raining outside?', 'They are waiting for the bus.'],
  wri: ['Dibuja tu salón y escribe 5 oraciones de lo que está haciendo cada persona.', 'Write a message to a friend: where you are now and what people around you are doing.', 'Describe a busy photo of a street market as if you were reporting live.'],
  sab: 'En inglés británico se dice «What are you doing at the weekend?» para planes futuros. El presente continuo también funciona como futuro para citas y planes ya organizados.',
  manos: 'Mímica: un alumno actúa una acción y el grupo adivina con oraciones completas: «You are cooking!», «Are you swimming?». El que acierta pasa al frente.',
  cam: 'Pre A1 Starters a A2 Flyers · Speaking (describir lo que pasa en una imagen) · B1 Preliminary Speaking Part 2 (describir una foto).',
  jue: ['oraciones', 'tiempos', 'speaking'] });

tema({ id: 'can', isla: 'gram', n: 'Can / can\'t: abilities', g: 'can', lv: ['a1'], from: 'a1-4',
  intro: '«Can» expresa habilidad (lo que alguien sabe o puede hacer) y también permiso. Es un verbo modal: no cambia con la persona, no lleva «to» y el verbo que le sigue va en forma base.',
  err: [['She cans swim.', 'She can swim.', 'Can no lleva -s.'], ['I can to dance.', 'I can dance.', 'Después de can no va «to».'], ['Do you can help me?', 'Can you help me?', 'Can hace sus propias preguntas.']],
  sab: 'En inglés británico «can\'t» se pronuncia /kɑːnt/ y en el estadounidense /kænt/. Como la t final casi no se oye, para distinguir «can» de «can\'t» fíjate en la vocal: «can» suele sonar débil, /kən/.',
  manos: 'Bingo de habilidades: cada alumno tiene una tarjeta con acciones (swim, ride a bike, whistle, speak French…). Pregunta «Can you…?» a sus compañeros y escribe el nombre de quien responda «Yes, I can».',
  cam: 'A1 Movers · Speaking y Reading & Writing · A2 Key Speaking Part 1.',
  jue: ['oraciones', 'speaking', 'quiz'] });

tema({ id: 'countable', isla: 'gram', n: 'Countable & uncountable', g: 'some', lv: ['a2'], from: 'a2-1',
  intro: 'Los sustantivos contables se pueden contar (an apple, two apples). Los incontables no tienen plural (water, rice, money, information). Esto cambia las palabras que los acompañan: some, any, much, many, a lot of, a few y a little.',
  err: [['I need an information.', 'I need some information.', '«Information» es incontable.'], ['How much apples?', 'How many apples?', 'Contables: how many.'], ['The furnitures are new.', 'The furniture is new.', 'Furniture es incontable.']],
  sab: '«Information», «advice», «furniture» y «homework» son incontables en inglés aunque en español sí tengan plural. Por eso decimos «a piece of advice», nunca «an advice».',
  manos: 'Mercado del salón: en equipos hagan una lista de compras para una fiesta con some, any, how much y how many. Un equipo es el puesto del mercado y otro el cliente; dramaticen la compra.',
  cam: 'A2 Key · Reading Part 5 y Listening · A2 Key Writing Part 6 (mensajes para organizar comida y compras).',
  jue: ['memorama', 'quiz', 'speaking'] });

tema({ id: 'pastsimple', isla: 'gram', n: 'Past simple', g: '-ed', lv: ['a2'], from: 'a2-2',
  intro: 'El pasado simple cuenta acciones terminadas en un momento del pasado (yesterday, last week, in 2020). Los verbos regulares agregan -ed; los irregulares tienen su propia forma (go → went). En negativo y preguntas usamos did / didn\'t y el verbo regresa a su forma base.',
  err: [["I didn't went.", "I didn't go.", 'Después de didn\'t, verbo base.'], ['Did you saw it?', 'Did you see it?', 'Después de did, verbo base.'], ['Yesterday I go to the cinema.', 'Yesterday I went to the cinema.', 'Con yesterday, pasado.']],
  sab: 'Los 100 verbos más usados del inglés incluyen muchísimos irregulares: be, have, do, say, get, make, go, know, take, see… Por eso vale la pena aprenderlos de memoria con canciones o con la ruleta del atlas.',
  manos: 'Two truths and a lie: cada alumno escribe tres oraciones sobre su fin de semana en pasado, una falsa. El grupo pregunta «Did you really…?» y adivina cuál es la mentira.',
  cam: 'A2 Flyers y A2 Key · Writing Part 7 (historia con tres imágenes, en pasado) · Speaking Part 1.',
  jue: ['ruleta', 'tiempos', 'cuento'] });

tema({ id: 'comparatives', isla: 'gram', n: 'Comparatives & superlatives', g: '-er', lv: ['a2'], from: 'a2-3',
  intro: 'Los comparativos comparan dos cosas (taller than, more interesting than). Los superlativos dicen cuál es el extremo de un grupo (the tallest, the most interesting). Los adjetivos cortos agregan -er / -est; los largos usan more / most.',
  err: [['more tall', 'taller', 'Adjetivo corto: -er.'], ['She is taller that me.', 'She is taller than me.', 'Se compara con «than».'], ['the more big', 'the biggest', 'Superlativo corto: -est.']],
  sab: 'Good, bad y far son irregulares: good → better → the best; bad → worse → the worst; far → further / farther → the furthest.',
  manos: 'Top Trumps del salón: en cartas, cada equipo escribe datos de animales (size, speed, weight). Se enfrentan comparando: «A cheetah is faster than a horse!». Gana la carta con el superlativo.',
  cam: 'A2 Key · Speaking Part 2 (comparar lugares o actividades) · B1 Preliminary Speaking Part 3.',
  jue: ['memorama', 'oraciones', 'quiz'] });

tema({ id: 'future', isla: 'gram', n: 'Future: going to, will & present continuous', g: 'will', lv: ['a2', 'b1'], from: 'a2-4',
  intro: 'En inglés hay varias formas de hablar del futuro. «Going to» para planes e intenciones y predicciones con evidencia. «Will» para decisiones del momento, promesas y predicciones de opinión. El presente continuo para citas ya organizadas.',
  err: [['I will to call you.', 'I will call you.', 'Después de will, verbo base.'], ["I'm going to the cinema tomorrow with a ticket.", 'Correcto, si ya es un plan.', 'El presente continuo sirve para citas.']],
  sab: '«Gonna» es la pronunciación rápida de «going to» y aparece en canciones, pero en un examen escrito siempre escribe «going to».',
  manos: 'Agenda de la semana: en parejas, cada uno llena una agenda con citas. Luego intentan encontrar un momento libre para verse: «What are you doing on Tuesday?» «I\'m playing tennis.»',
  cam: 'A2 Key y B1 Preliminary · Writing Part 1 (email con planes) · Speaking Part 1 y 4.',
  jue: ['tiempos', 'speaking', 'quiz'] });

tema({ id: 'presperfect', isla: 'gram', n: 'Present perfect vs past simple', g: 'have', lv: ['b1'], from: 'b1-1',
  intro: 'El present perfect (have / has + participio) une el pasado con el presente: experiencias de vida, acciones recientes y situaciones que siguen. El past simple habla de un momento terminado y concreto. Si dices cuándo, usa past simple.',
  err: [['I have seen him yesterday.', 'I saw him yesterday.', 'Con un tiempo concreto, past simple.'], ['I live here since 2020.', "I've lived here since 2020.", 'Situación que sigue: present perfect.'], ['Have you ever went…?', 'Have you ever been / gone…?', 'Participio, no pasado.']],
  sab: 'El estadounidense usa más el past simple que el británico: «Did you eat yet?» es común en Estados Unidos, mientras que en Reino Unido se prefiere «Have you eaten yet?». Para Cambridge, usa la forma británica.',
  manos: 'Find someone who…: tarjeta con «…has been to the beach / has met a famous person / has never eaten sushi». Preguntan «Have you ever…?» y si dicen que sí, piden detalles en past simple: «When did you go?»',
  cam: 'B1 Preliminary · Speaking Part 1 y Writing Part 2 (artículo sobre una experiencia) · B2 First Part 4 (key word transformations con for / since / ago).',
  jue: ['ruleta', 'tiempos', 'speaking'] });

tema({ id: 'modals', isla: 'gram', n: 'Modals: obligation & advice', g: 'must', lv: ['b1'], from: 'b1-2',
  intro: 'Los modales de obligación y consejo expresan reglas y recomendaciones. «Must» y «have to» = obligación. «Mustn\'t» = prohibido. «Don\'t have to» = no es necesario. «Should» y «ought to» = consejo.',
  err: [["You don't have to smoke here.", "You mustn't smoke here.", 'Prohibido: mustn\'t.'], ['You should to study.', 'You should study.', 'Should + verbo base.'], ['She musts go.', 'She must go.', 'Los modales no llevan -s.']],
  sab: '«Mustn\'t» y «don\'t have to» parecen iguales pero son casi opuestos: «You mustn\'t come» (no vengas, está prohibido) vs «You don\'t have to come» (puedes venir, pero no es obligatorio).',
  manos: 'Reglamento del salón: en equipos redacten 6 reglas usando must, mustn\'t, have to, don\'t have to y should. Votan las mejores y hacen un póster para la pared.',
  cam: 'B1 Preliminary · Reading Part 1 (avisos y letreros) y Writing Part 1 (dar consejos por email) · B2 First Part 4.',
  jue: ['quiz', 'speaking', 'tiempos'] });

tema({ id: 'pastcont', isla: 'gram', n: 'Past continuous & narrative tenses', g: 'was', lv: ['b1'], from: 'b1-3',
  intro: 'El pasado continuo (was / were + -ing) describe una acción que estaba en progreso en el pasado. Se combina con el pasado simple para contar historias: la acción larga es el fondo y la corta es la interrupción. «When» suele ir con la acción corta y «while» con la larga.',
  err: [['When I was walking, I was seeing a dog.', 'When I was walking, I saw a dog.', 'La interrupción va en past simple.'], ['While I watched TV, the phone was ringing.', 'While I was watching TV, the phone rang.', 'Fondo en continuo, interrupción en simple.']],
  sab: 'Muchas historias en inglés empiezan con el pasado continuo para crear ambiente: «It was raining and the wind was blowing when suddenly…». Es un truco que los examinadores de Cambridge valoran en las historias.',
  manos: 'Historia en cadena: el docente dice «It was a dark night and I was walking home when…». Cada alumno agrega una oración con pasado simple o continuo. Al final escriban la historia completa.',
  cam: 'B1 Preliminary Writing Part 2 (historia) · B2 First for Schools Writing Part 2 (story).',
  jue: ['cuento', 'tiempos', 'oraciones'] });

tema({ id: 'conditionals', isla: 'gram', n: 'Zero, first & second conditional', g: 'if', lv: ['b1', 'b2'], from: 'b1-4',
  intro: 'Los condicionales expresan qué pasa si se cumple una condición. Zero: verdades generales. First: situaciones reales o probables en el futuro. Second: situaciones imaginarias o poco probables en el presente. Nunca se pone «will» en la parte del «if».',
  err: [['If it will rain, I will stay home.', 'If it rains, I will stay home.', 'Sin will después de if.'], ['If I would have money…', 'If I had money…', 'Second conditional: if + pasado.'], ['If I was you…', 'If I were you…', 'Forma recomendada para consejos.']],
  sab: 'La frase «If I were you» usa «were» aunque el sujeto sea «I». Es un resto del modo subjuntivo del inglés antiguo y es la forma recomendada en exámenes.',
  manos: 'What would you do? Saquen tarjetas con situaciones («You find a wallet with $5,000», «You can be invisible for a day») y respondan en segundo condicional. El grupo vota la respuesta más creativa.',
  cam: 'B1 Preliminary · Speaking Part 3–4 · B2 First Part 4 (key word transformations con unless, if, provided).',
  jue: ['tiempos', 'speaking', 'oraciones'] });

tema({ id: 'gerinf', isla: 'gram', n: 'Gerunds & infinitives', g: '-ing/to', lv: ['b1', 'b2'],
  intro: 'Cuando un verbo va después de otro verbo, puede ir en gerundio (-ing) o en infinitivo (to + verbo). No hay una regla única: depende del primer verbo. Algunos verbos cambian de significado según la forma.',
  reglas: [
    { h: 'Verbo + -ing', t: 'enjoy, finish, mind, avoid, suggest, keep, practise, can\'t stand, don\'t mind.', ok: ['I <b>enjoy reading</b>.', 'She <b>avoided answering</b>.'], no: ['I enjoy to read.'] },
    { h: 'Verbo + to', t: 'want, decide, hope, plan, promise, refuse, learn, agree, need, would like.', ok: ['We <b>decided to stay</b>.', 'I <b>want to learn</b> Japanese.'], no: ['We decided staying.'] },
    { h: 'Después de preposición, -ing', t: 'Si hay una preposición (in, at, of, about, without, before…), el verbo va en -ing.', ok: ["I'm good <b>at drawing</b>.", 'Thanks <b>for helping</b> me.'], no: ['Thanks for help me.', "I'm good at draw."] },
    { h: 'Cambian de significado', t: 'stop, remember, forget, try.', ok: ['I <b>stopped to buy</b> water. (me detuve para comprar)', 'I <b>stopped buying</b> soda. (dejé de comprar)', "<b>Remember to lock</b> the door. / I <b>remember locking</b> it."], no: [] },
    { h: 'Gerundio como sujeto', t: 'Cuando una acción es el sujeto de la oración, va en -ing.', ok: ['<b>Swimming</b> is good exercise.', '<b>Learning</b> English opens doors.'], no: ['Swim is good exercise.'] },
  ],
  err: [['I look forward to see you.', 'I look forward to seeing you.', '«To» aquí es preposición: -ing.'], ['I am used to wake up early.', 'I am used to waking up early.', 'Be used to + -ing.']],
  ej: [
    ['mc', 'I really enjoy ___ to music.', 'listening', ['to listen', 'listen'], 'Enjoy + <b>-ing</b>.'],
    ['mc', 'We decided ___ the bus.', 'to take', ['taking', 'take'], 'Decide + <b>to</b>.'],
    ['mc', "She's interested in ___ a vet.", 'becoming', ['to become', 'become'], 'Después de preposición, <b>-ing</b>.'],
    ['mc', 'I stopped ___ a coffee because I was tired. (para tomar)', 'to have', ['having', 'have'], 'Stop + to = detenerse <b>para</b> hacer algo.'],
    ['mc', "Don't forget ___ your homework.", 'to bring', ['bringing', 'bring'], 'Forget + to = no olvides hacerlo.'],
    ['gap', 'I look forward to ___ (hear) from you.', 'hearing', '<b>look forward to + -ing</b>.'],
    ['gap', '___ (eat) vegetables is good for you.', 'Eating', 'Gerundio como sujeto.'],
    ['wf', 'She refused ___ the question.', 'ANSWER', 'to answer', 'Refuse + <b>to</b>.'],
    ['kwt', "I don't like getting up early.", 'STAND', "I ___ up early.", "can't stand getting/cannot stand getting", "<b>can't stand + -ing</b>."],
  ],
  voc: 'enjoy:disfrutar|avoid:evitar|refuse:negarse|suggest:sugerir|promise:prometer|keep:seguir (haciendo)|mind:importar|afford:poder pagar',
  preg: ['What do you enjoy doing at the weekend?', 'What have you decided to do after school?', 'Is there anything you have stopped doing recently? Why?'],
