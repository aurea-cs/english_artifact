  lis: ['I enjoy playing the guitar with my friends.', 'She promised to call me after school.', 'Do you mind opening the window?', 'We are thinking about moving to Querétaro.', 'Remember to bring your passport.'],
  wri: ['Escribe 5 cosas que disfrutas hacer y 5 cosas que quieres aprender.', 'Write an email to a friend about a hobby you have started and why you enjoy doing it.', 'Write a short opinion paragraph: «Learning a second language should start at an early age.»'],
  sab: 'Una pista útil: los verbos que miran hacia el futuro (want, hope, plan, decide) suelen llevar «to»; los que hablan de algo que ya vives (enjoy, finish, mind) suelen llevar -ing.',
  manos: 'Enjoy / want / avoid: tres columnas en el pizarrón. Cada alumno pega notas adhesivas con oraciones sobre sí mismo («I want to visit Japan», «I avoid eating spicy food») en la columna correcta. Lean y corrijan juntos.',
  cam: 'B1 Preliminary Reading Part 5–6 · B2 First Use of English Part 2 y Part 4 (patrones verbales muy frecuentes).',
  jue: ['quiz', 'oraciones', 'speaking'] });

tema({ id: 'passive', isla: 'gram', n: 'The passive', g: 'be+V3', lv: ['b2'], from: 'b2-1',
  intro: 'La voz pasiva pone el foco en la acción o en quien la recibe, no en quien la hace. Se forma con el verbo be en el tiempo necesario + participio pasado. Si queremos mencionar quién lo hizo, usamos «by».',
  err: [['The book was wrote by…', 'The book was written by…', 'Participio, no pasado.'], ['The car is repairing.', 'The car is being repaired.', 'Pasiva continua: being + participio.']],
  sab: 'Las noticias y los textos científicos usan mucho la pasiva porque lo importante es lo que pasó, no quién: «A new species has been discovered in Chiapas».',
  manos: 'Hecho en México: busquen 6 productos o inventos mexicanos (la TV a color, el chocolate…) y escriban fichas en pasiva: «A colour television system was developed by Guillermo González Camarena in the 1940s».',
  cam: 'B2 First · Use of English Part 4 (transformar de activa a pasiva) · Reading Part 5–7 (textos informativos).',
  jue: ['tiempos', 'quiz'] });

tema({ id: 'third', isla: 'gram', n: 'Third conditional & wish', g: 'wish', lv: ['b2'], from: 'b2-2',
  intro: 'El tercer condicional imagina un pasado diferente: If + past perfect, would have + participio. «Wish» e «if only» expresan deseos y arrepentimientos. Should have / could have expresan críticas o posibilidades no aprovechadas en el pasado.',
  err: [['If I would have known…', 'If I had known…', 'En la parte del if, past perfect.'], ['I wish I can fly.', 'I wish I could fly.', 'Wish + pasado para el presente.']],
  sab: 'En el habla rápida, «would have» suena como «would\'ve» /wʊdəv/. Por eso muchos hablantes nativos escriben por error «would of». ¡No lo copies!',
  manos: 'Cadena de consecuencias: el docente dice «If I hadn\'t woken up late…». El siguiente alumno completa y encadena: «…I wouldn\'t have missed the bus. If I hadn\'t missed the bus…».',
  cam: 'B2 First Use of English Part 4 · C1 Advanced Part 4 (key word transformations con wish, if only y should have).',
  jue: ['tiempos', 'quiz'] });

tema({ id: 'reported', isla: 'gram', n: 'Reported speech', g: 'said', lv: ['b2'], from: 'b2-3',
  intro: 'El estilo indirecto cuenta lo que alguien dijo sin citarlo textualmente. Normalmente el tiempo verbal «retrocede» un paso (is → was, will → would), y cambian los pronombres y las expresiones de tiempo (tomorrow → the next day).',
  err: [['He said me that…', 'He told me that… / He said that…', 'Tell lleva persona; say no.'], ['She asked where was the station.', 'She asked where the station was.', 'En preguntas reportadas no hay inversión.']],
  sab: 'Si lo que se reporta sigue siendo verdad, a veces no se cambia el tiempo: «She said she lives in Monterrey» es correcto si todavía vive ahí.',
  manos: 'Teléfono descompuesto en inglés: un alumno dice una frase al oído; cada quien la reporta al siguiente («She said that…»). El último la escribe y comparan con la original.',
  cam: 'B2 First Use of English Part 4 · C1 Advanced Part 4 (verbos de reporte: suggest, deny, admit, warn).',
  jue: ['quiz', 'tiempos'] });

tema({ id: 'relatives', isla: 'gram', n: 'Relative clauses', g: 'who', lv: ['b2'], from: 'b2-4',
  intro: 'Las oraciones de relativo añaden información sobre un sustantivo con who (personas), which (cosas), that (personas o cosas), whose (posesión), where (lugares) y when (tiempos). Las especificativas no llevan comas; las explicativas sí y no aceptan «that».',
  err: [['The man which lives there…', 'The man who lives there…', 'Personas: who.'], ['My mother, that is a doctor, …', 'My mother, who is a doctor, …', 'Con comas no se usa that.']],
  sab: 'En las especificativas puedes omitir el relativo cuando es objeto: «The book (that) I bought» es igual de correcto. Los hablantes nativos casi siempre lo omiten.',
  manos: 'Define it!: en equipos, describan una palabra con una oración de relativo sin decirla («It\'s a person who…», «It\'s a place where…»). Los demás adivinan. Gana el equipo con más aciertos.',
  cam: 'B2 First Use of English Part 2 y 3 · B2 First Writing (para ensayos y reseñas más complejos).',
  jue: ['oraciones', 'quiz'] });

tema({ id: 'inversion', isla: 'gram', n: 'Inversion for emphasis', g: 'Never do', lv: ['c1'], from: 'c1-1',
  intro: 'La inversión negativa coloca un adverbio negativo o restrictivo al inicio (never, rarely, not only, no sooner, under no circumstances) y después invierte auxiliar y sujeto, como en una pregunta. Da énfasis y un tono formal, típico de discursos y ensayos.',
  err: [['Never I have seen…', 'Never have I seen…', 'Auxiliar antes del sujeto.'], ['No sooner had I arrived when…', 'No sooner had I arrived than…', 'No sooner… than.']],
  sab: 'La inversión aparece en discursos célebres. Churchill dijo: «Never in the field of human conflict was so much owed by so many to so few» (1940).',
  manos: 'Discurso de graduación: en equipos escriban un discurso breve con al menos tres inversiones (Not only…, Never before…, Only when…). Léanlo con entonación formal frente al grupo.',
  cam: 'C1 Advanced y C2 Proficiency · Reading & Use of English Part 4 (key word transformations) y Writing (ensayo formal).',
  jue: ['quiz', 'oraciones'] });

tema({ id: 'cleft', isla: 'gram', n: 'Cleft sentences', g: 'It was', lv: ['c1'], from: 'c1-2',
  intro: 'Las oraciones escindidas (cleft sentences) dividen la información para destacar una parte: «It was Ana who solved it», «What I need is time». Son muy útiles para enfatizar y corregir en el habla y en la escritura avanzada.',
  err: [['What I need it is time.', 'What I need is time.', 'Sin pronombre extra.'], ['It was in 2010 when I moved.', 'It was in 2010 that I moved.', 'It-cleft con that.']],
  sab: 'Las cleft sentences también sirven para corregir con amabilidad: «Actually, it was Tuesday that we met, not Monday».',
  manos: 'Corrige con énfasis: el docente dice afirmaciones falsas sobre el grupo («Carlos won the race»). Los alumnos corrigen con cleft: «No, it was Luisa who won the race».',
  cam: 'C1 Advanced · Reading & Use of English Part 4 y Writing (ensayo, propuesta, reseña).',
  jue: ['quiz', 'oraciones'] });

tema({ id: 'deduction', isla: 'gram', n: 'Modals of deduction', g: 'must have', lv: ['c1'], from: 'c1-3',
  intro: 'Los modales de deducción expresan qué tan seguros estamos de algo. Presente: must (casi seguro que sí), might / may / could (posible), can\'t (casi seguro que no). Pasado: must have, might have, can\'t have + participio.',
  err: [["He mustn't be at home.", "He can't be at home.", 'Deducción negativa: can\'t.'], ['She must have forget.', 'She must have forgotten.', 'Modal + have + participio.']],
  sab: 'Sherlock Holmes conoce a Watson con la frase «You have been in Afghanistan, I perceive» (1887). Con un modal de deducción sería: «You must have been in Afghanistan». ¡Los detectives viven de deducir!',
  manos: 'Escena del crimen: el docente muestra una imagen misteriosa (una mesa con objetos tirados). En equipos escriben deducciones: «Someone must have left in a hurry. They can\'t have been hungry.»',
  cam: 'C1 Advanced · Speaking Part 2 (especular sobre fotos) y Reading & Use of English Part 4.',
  jue: ['quiz', 'speaking'] });

tema({ id: 'impersonal', isla: 'gram', n: 'Impersonal passives', g: 'It is said', lv: ['c1'], from: 'c2-2',
  intro: 'Las pasivas impersonales sirven para tomar distancia de la información: «It is said that…», «He is believed to be…». Son típicas del periodismo y de los textos académicos cuando la fuente no es segura o no importa.',
  err: [['It is said he to be…', 'He is said to be…', 'Dos estructuras: It is said that… / He is said to…'], ['She is thought to have leave.', 'She is thought to have left.', 'To have + participio para el pasado.']],
  sab: 'Los periodistas usan estas estructuras para proteger su credibilidad: «The minister is reported to have resigned» indica que la información viene de otra fuente.',
  manos: 'Rumores de la escuela: reescriban titulares de un periódico escolar imaginario con pasivas impersonales («The cafeteria is rumoured to be closing»). Discutan cuándo es ético usarlas.',
  cam: 'C1 Advanced y C2 Proficiency · Reading & Use of English Part 4 (key word transformations).',
  jue: ['quiz'] });

tema({ id: 'subjunctive', isla: 'gram', n: 'Subjunctive & formal structures', g: 'were', lv: ['c1'], from: 'c2-3',
  intro: 'El subjuntivo en inglés casi no cambia de forma, pero aparece después de verbos como suggest, insist, recommend o demand (the verb base form) y en condicionales formales con inversión: «Should you need help…», «Were I to…», «Had I known…».',
  err: [['I suggest that he goes.', 'I suggest that he go. (formal)', 'Subjuntivo: verbo base.'], ['If should you need…', 'Should you need…', 'Inversión sin if.']],
  sab: 'En inglés británico informal es común «I suggest that he should go». En estadounidense y en textos formales se prefiere el subjuntivo puro: «I suggest that he go».',
  manos: 'Cartas formales: el grupo escribe una carta al director con recomendaciones («We recommend that the library be open until 6 pm»). Revisen el registro con una lista de cotejo.',
  cam: 'C2 Proficiency · Writing (carta, informe) y Reading & Use of English Part 4.',
  jue: ['quiz'] });

tema({ id: 'mixed', isla: 'gram', n: 'Mixed conditionals & unreal past', g: 'If I had', lv: ['c1'], from: 'c2-4',
  intro: 'Los condicionales mixtos combinan tiempos: un pasado irreal con un resultado presente (If I had studied medicine, I would be a doctor now) o al revés. El pasado irreal también aparece en «It\'s time», «would rather», «as if» y «suppose».',
  err: [["It's time we go.", "It's time we went.", 'It\'s time + pasado.'], ["I'd rather you don't tell anyone.", "I'd rather you didn't tell anyone.", 'Would rather + otra persona + pasado.']],
  sab: 'El poema «The Road Not Taken» de Robert Frost (1916) es una de las reflexiones más famosas sobre el pasado irreal: qué habría pasado si hubiera tomado el otro camino.',
  manos: 'Línea de tiempo alternativa: cada alumno elige una decisión importante de la historia de México y escribe un condicional mixto sobre cómo sería el país hoy si hubiera sido distinta.',
  cam: 'C2 Proficiency · Reading & Use of English Part 4 y Writing Part 1 (ensayo).',
  jue: ['quiz'] });
/* ---------- Vocabulary ---------- */
tema({ id: 'classroom', isla: 'voc', n: 'Classroom language', g: 'Hi!', lv: ['a1'],
  intro: 'El lenguaje del salón son las frases que usamos todos los días en la clase de inglés: saludar, pedir permiso, pedir ayuda y entender instrucciones. Si el grupo las usa desde el primer día, la clase puede ser casi toda en inglés.',
  reglas: [
    { h: 'Pedir permiso', t: 'Usa «Can I…?» o, más formal, «May I…?».', ok: ['<b>Can I</b> go to the toilet, please?', '<b>May I</b> come in?'], no: ['Can I go to the bathroom? (válido en EE. UU., pero en Reino Unido se dice toilet)'] },
    { h: 'Pedir ayuda', t: 'Cuando no entiendes o no sabes una palabra.', ok: ['How do you say «sacapuntas» in English?', 'What does «borrow» mean?', 'Can you repeat that, please?', 'How do you spell it?'], no: ['How do you say in English «sacapuntas»?'] },
    { h: 'Instrucciones del docente', t: 'Verbos en imperativo: open, close, listen, look, read, write, work in pairs, stand up, sit down.', ok: ['<b>Open</b> your books at page 12.', '<b>Work in pairs</b>.'], no: [] },
    { h: 'Ser amable', t: 'En inglés «please», «thank you» y «sorry» se usan mucho más que en español.', ok: ['Can you pass me the glue, <b>please</b>?', '<b>Sorry</b> I\'m late.'], no: ['Give me the glue.'] },
  ],
  err: [['Teacher, can I go to the bathroom?', 'Excuse me, Miss / Sir, can I go to the toilet, please?', 'En Reino Unido «Teacher» no se usa como vocativo; «Miss» o «Sir» sí.'], ['How do you say in English…?', 'How do you say … in English?', 'El orden cambia.']],
  ej: [
    ['mc', 'You don\'t understand a word. You say…', 'What does it mean?', ['What means it?', 'What is mean?'], 'Pregunta correcta: <b>What does it mean?</b>'],
    ['mc', 'You want to go to the toilet. You say…', 'Can I go to the toilet, please?', ['I go toilet.', 'Give me toilet.'], 'Pedir permiso: <b>Can I…, please?</b>'],
    ['mc', 'The teacher says «Work in pairs». You…', 'work with a partner', ['work alone', 'stand up'], '<b>Pairs</b> = parejas.'],
    ['mc', 'You arrive late. You say…', "Sorry I'm late.", ['Excuse late.', 'I late.'], 'Disculparse: <b>Sorry I\'m late.</b>'],
    ['gap', 'How do you ___ your name? — M-A-R-I-O.', 'spell', '<b>spell</b> = deletrear.'],
    ['gap', 'Can you ___ that, please? I didn\'t hear.', 'repeat', '<b>repeat</b> = repetir.'],
    ['ord', 'How do you say pizarrón in English?', 'How do you say + palabra + in English?'],
  ],
  voc: 'board:pizarrón|pencil case:estuche|rubber:goma (UK)|eraser:goma (US)|sharpener:sacapuntas|glue:pegamento|ruler:regla|borrow:pedir prestado',
  preg: ['What do you say when you don\'t understand?', 'What is in your pencil case?', 'What are the rules of our English class?'],
  lis: ['Open your books at page twenty.', 'Can I borrow your ruler, please?', 'Work in pairs and check your answers.', 'How do you spell your surname?', 'Please put your hand up.'],
  wri: ['Haz un póster con 6 frases útiles para la clase de inglés.', 'Write five classroom rules for your English class.', 'Write a short guide for a new student: useful phrases for an English-only classroom.'],
  sab: 'En Reino Unido, los alumnos llaman a sus maestras «Miss» y a sus maestros «Sir», sin apellido. En Estados Unidos es más común «Mr. / Ms. + apellido».',
  manos: 'Semáforo de inglés: pega en la pared 10 frases del salón. Cada vez que alguien usa una en voz alta durante la clase, su equipo gana un punto en el marcador del Kit de clase.',
  cam: 'Pre A1 Starters a A2 Flyers · Speaking (seguir instrucciones, pedir repetición). «Can you say that again, please?» siempre está permitido en el examen.',
  jue: ['spelling', 'memorama', 'dictado'] });

tema({ id: 'family', isla: 'voc', n: 'Family & describing people', g: 'mum', lv: ['a1', 'a2'],
  intro: 'Para describir personas necesitamos vocabulario de familia, aspecto físico y personalidad. En inglés el adjetivo va antes del sustantivo (a tall boy) y no tiene plural (two tall boys).',
  reglas: [
    { h: 'La familia', t: 'mum, dad, parents, brother, sister, grandparents, uncle, aunt, cousin. «Parents» son los papás, no los parientes (relatives).', ok: ['My <b>parents</b> are teachers.', 'I have three <b>cousins</b>.'], no: ['My parents (= parientes) live in Puebla.'] },
    { h: 'Aspecto físico', t: 'Altura y complexión con be; pelo y ojos con have got / have.', ok: ['She <b>is</b> tall and slim.', 'He <b>has got</b> short curly hair and brown eyes.'], no: ['He is short hair.'] },
    { h: 'Orden de los adjetivos', t: 'Opinión → tamaño → edad → forma → color → origen → material.', ok: ['a <b>beautiful long black</b> dress', 'a <b>nice old Mexican</b> house'], no: ['a black long beautiful dress'] },
    { h: 'Personalidad', t: 'friendly, funny, kind, shy, lazy, hard-working, bossy, generous.', ok: ['My grandma is very <b>kind</b>.', 'Tomás is a bit <b>shy</b>.'], no: [] },
    { h: 'What is she like? vs What does she look like?', t: '«What is she like?» pregunta por la personalidad; «What does she look like?» por el aspecto.', ok: ['What is she like? — She\'s <b>funny</b>.', 'What does she look like? — She\'s <b>tall</b>.'], no: [] },
  ],
  err: [['She has the hair long.', 'She has long hair.', 'Adjetivo antes del sustantivo, sin «the».'], ['My parents in Puebla (= relatives).', 'My relatives in Puebla.', 'Parents = papá y mamá.']],
  ej: [
    ['mc', 'Your mum\'s sister is your…', 'aunt', ['uncle', 'cousin'], '<b>aunt</b> = tía.'],
    ['mc', 'He ___ blue eyes.', 'has got', ['is', 'are'], 'Ojos y pelo con <b>have got</b>.'],
    ['mc', '«What is your brother like?» asks about his…', 'personality', ['appearance', 'age'], '<b>What… like?</b> = personalidad.'],
    ['mc', 'Choose the correct order.', 'a lovely old wooden table', ['a wooden old lovely table', 'an old wooden lovely table'], 'Opinión → edad → material.'],
    ['mc', 'Someone who doesn\'t like working is…', 'lazy', ['shy', 'kind'], '<b>lazy</b> = flojo.'],
    ['gap', 'My uncle\'s children are my ___.', 'cousins', '<b>cousins</b> = primos.'],
    ['gap', 'She is very ___. She always tells jokes.', 'funny', '<b>funny</b> = chistoso.'],
    ['ord', 'My sister has got long curly hair.', 'Sujeto + has got + adjetivos + hair.'],
  ],
  voc: 'parents:papás|relatives:parientes|cousin:primo, prima|aunt:tía|uncle:tío|curly:rizado|shy:tímido|friendly:amigable',
  preg: ['Describe a person in your family. What does he or she look like?', 'Who is the funniest person in your family?', 'What is your best friend like?'],
  lis: ['My grandmother has got short grey hair.', 'He is tall and he has got brown eyes.', 'My aunt is very kind and generous.', 'What does your brother look like?'],
  wri: ['Dibuja a tu familia y escribe cómo es cada persona.', 'Write a description of a famous person without saying the name. Your classmates guess.', 'Write a character description for a short story, including appearance and personality.'],
  sab: 'En inglés no existe una palabra común para «hermanos» incluyendo a hombres y mujeres. Se dice «brothers and sisters» o la palabra más formal «siblings».',
  manos: '¿Quién es quién? Cada alumno escribe en secreto la descripción de un compañero (aspecto y personalidad positiva). El docente lee las descripciones y el grupo adivina.',
  cam: 'Pre A1 Starters y A1 Movers · Listening Part 1 (identificar personas por su descripción) · A2 Key Speaking Part 1.',
  jue: ['memorama', 'spelling', 'quien'] });

tema({ id: 'food', isla: 'voc', n: 'Food & drink', g: 'yum', lv: ['a1', 'a2'],
  intro: 'El vocabulario de comida se usa para hablar de gustos, pedir en un restaurante y escribir recetas. Combínalo con los cuantificadores (some, any, a lot of) y con «would like» para pedir con cortesía.',
  reglas: [
    { h: 'Pedir con cortesía', t: '«I\'d like…» o «Could I have…?» suenan más amables que «I want…».', ok: ["<b>I'd like</b> a glass of water, please.", '<b>Could I have</b> the menu, please?'], no: ['I want a water.'] },
    { h: 'Comidas del día', t: 'breakfast, lunch, dinner (o tea en el norte de Inglaterra). Se usan sin artículo con «have».', ok: ['I <b>have breakfast</b> at seven.', 'What did you have for <b>dinner</b>?'], no: ['I take the breakfast.'] },
    { h: 'Contenedores y porciones', t: 'a bottle of, a glass of, a cup of, a slice of, a piece of, a packet of.', ok: ['<b>a slice of</b> pizza', '<b>a bottle of</b> water'], no: ['a water'] },
    { h: 'Sabores y texturas', t: 'sweet, salty, spicy, sour, bitter, crunchy, juicy.', ok: ['Chiles are <b>spicy</b>.', 'Lemons are <b>sour</b>.'], no: ['Chiles are hot (válido, pero puede confundirse con caliente).'] },
  ],
  err: [['I take breakfast.', 'I have breakfast.', 'Las comidas van con «have».'], ['I want a coffee.', "I'd like a coffee, please.", 'Más amable.']],
  ej: [
    ['mc', 'Chiles are very…', 'spicy', ['sweet', 'sour'], '<b>spicy</b> = picante.'],
    ['mc', 'Can I have ___ of cake, please?', 'a piece', ['a bottle', 'a glass'], '<b>a piece of</b> cake.'],
    ['mc', 'The polite way to order is…', "I'd like a lemonade, please.", ['Give me a lemonade.', 'I want lemonade.'], '<b>I\'d like</b> = me gustaría.'],
    ['mc', 'What do you have in the morning?', 'breakfast', ['dinner', 'dessert'], '<b>breakfast</b> = desayuno.'],
    ['gap', 'Could I have the ___, please? I want to see the dishes.', 'menu', '<b>menu</b> = carta.'],
    ['gap', 'I usually ___ lunch at school.', 'have', '<b>have lunch</b>.'],
    ['ord', 'Could I have a glass of water, please?', 'Could I have + cantidad + of + bebida + please?'],
  ],
  voc: 'breakfast:desayuno|lunch:comida (mediodía)|dinner:cena|spicy:picante|sour:ácido|dessert:postre|bill:la cuenta|dish:platillo',
  preg: ['What is your favourite Mexican dish? How do you make it?', 'What do you usually have for breakfast?', 'Describe a meal you had at a special celebration.'],
  lis: ["I'd like a glass of orange juice, please.", 'Could we have the bill, please?', 'Tacos al pastor are my favourite dish.', 'This soup is too salty.'],
  wri: ['Escribe el menú de tu restaurante ideal con precios en inglés.', 'Write a recipe for a Mexican dish: ingredients and steps.', 'Write a restaurant review for an international food blog.'],
  sab: 'Palabras como «chocolate», «tomato», «avocado» y «chilli» llegaron al inglés desde el náhuatl a través del español: xocolatl, tomatl, ahuacatl y chilli.',
  manos: 'Restaurante en el salón: un equipo diseña un menú en inglés y atiende; los demás son clientes que piden con «I\'d like…» y piden la cuenta. Rotan roles.',
  cam: 'A1 Movers y A2 Flyers · Listening y Speaking · A2 Key Listening Part 1 (conversaciones en tiendas y restaurantes).',
  jue: ['memorama', 'spelling', 'speaking'] });

tema({ id: 'falsos', isla: 'voc', n: 'False friends', g: '≠', lv: ['a2', 'b1', 'b2'],
  intro: 'Los falsos amigos son palabras que se parecen en inglés y en español pero significan cosas distintas. Son una de las causas más comunes de errores de los hispanohablantes. Aprenderlos evita malentendidos… ¡a veces muy vergonzosos!',
  reglas: [
    { h: 'Actually', t: '«Actually» significa «en realidad», no «actualmente» (que es currently / nowadays).', ok: ["<b>Actually</b>, I'm from Toluca, not from Mexico City.", "<b>Currently</b>, I live in León."], no: ['Actually I study at secondary school. (= actualmente)'] },
    { h: 'Embarrassed', t: '«Embarrassed» = avergonzado. Embarazada se dice «pregnant».', ok: ['I was so <b>embarrassed</b> when I fell.', 'My aunt is <b>pregnant</b>.'], no: ['My aunt is embarrassed (= embarazada).'] },
    { h: 'Library / bookshop', t: '«Library» es biblioteca; librería es «bookshop» (UK) o «bookstore» (US).', ok: ['I borrowed it from the <b>library</b>.', 'I bought it at a <b>bookshop</b>.'], no: ['I bought the book at the library.'] },
    { h: 'Realise / carry out', t: '«Realise» = darse cuenta; «realizar» se dice carry out, do, make.', ok: ['I <b>realised</b> I had lost my keys.', 'We <b>carried out</b> an experiment.'], no: ['We realised an experiment.'] },
    { h: 'Assist / attend', t: '«Assist» = ayudar; asistir a clase es «attend».', ok: ['I <b>attend</b> a school in Puebla.'], no: ['I assist to a school in Puebla.'] },
    { h: 'Sensible / sensitive', t: '«Sensible» = sensato; sensible (emocional) es «sensitive».', ok: ['That\'s a <b>sensible</b> decision.', 'My skin is very <b>sensitive</b>.'], no: ['She cries a lot because she is very sensible.'] },
  ],
  ej: [
    ['mc', '«Actually» means…', 'en realidad', ['actualmente', 'activamente'], 'Actualmente = <b>currently / nowadays</b>.'],
    ['mc', 'I left my book at the ___. I need to return it by Friday.', 'library', ['bookshop', 'librery'], 'Devolver un libro: <b>library</b> (biblioteca).'],
    ['mc', 'Mi tía está embarazada = My aunt is…', 'pregnant', ['embarrassed', 'constipated'], '<b>pregnant</b> = embarazada.'],
    ['mc', 'I ___ a very good school in Monterrey.', 'attend', ['assist', 'assist to'], 'Asistir a = <b>attend</b>.'],
    ['mc', '«Tengo un resfriado» = …', 'I have a cold.', ['I am constipated.', 'I am resfriated.'], '«Constipated» = estreñido. ¡Cuidado!'],
    ['mc', '«Carpet» means…', 'alfombra', ['carpeta', 'cartera'], 'Carpeta = <b>folder</b>.'],
    ['gap', 'We carried ___ a survey about screen time.', 'out', 'Realizar = <b>carry out</b>.'],
    ['gap', 'Suddenly I ___ that I didn\'t have my phone. (darse cuenta)', 'realised/realized', '<b>realise</b> = darse cuenta.'],
  ],
  voc: 'actually:en realidad|currently:actualmente|library:biblioteca|bookshop:librería|embarrassed:avergonzado|pregnant:embarazada|attend:asistir a|carpet:alfombra',
  preg: ['Have you ever made a mistake with a false friend? What happened?', 'Which false friend do you think is the most dangerous?', 'Why do you think English and Spanish have so many similar words?'],
  lis: ['Actually, I prefer tea to coffee.', 'Currently I live with my grandparents.', 'I was really embarrassed when my phone rang in class.', 'We attend the same school.'],
  wri: ['Haz tarjetas de falsos amigos: la palabra en inglés, su significado real y un dibujo.', 'Write a funny story about a misunderstanding caused by a false friend.', 'Write a short guide for Spanish speakers: the ten most common false friends and how to avoid them.'],
  sab: 'Se calcula que cerca del 60 % del vocabulario del inglés viene del francés y del latín, por eso hay tantos cognados con el español. La mayoría son amigos verdaderos (hospital, animal, family), pero no todos.',
  manos: 'Cazadores de falsos amigos: en equipos, el docente lee oraciones con falsos amigos mal usados. El equipo que levante primero la tarjeta «FALSE FRIEND!» y diga la palabra correcta gana el punto.',
  cam: 'Todos los niveles. En B2 First y C1 Advanced, el vocabulario preciso (Use of English Part 1) penaliza confusiones de falsos amigos.',
  jue: ['falsos', 'memorama', 'quiz'] });

tema({ id: 'phrasal', isla: 'voc', n: 'Phrasal verbs', g: 'get up', lv: ['b1', 'b2'],
  intro: 'Un phrasal verb es un verbo + una partícula (up, down, on, off, out…) que juntos forman un significado nuevo. «Look» es mirar, pero «look after» es cuidar. Los hablantes nativos los usan todo el tiempo, sobre todo en conversación.',
  reglas: [
    { h: 'Significado nuevo', t: 'Aprende el phrasal verb como una sola palabra, con un ejemplo.', ok: ['<b>give up</b> = dejar de intentar', '<b>find out</b> = averiguar', '<b>look after</b> = cuidar'], no: [] },
    { h: 'Separables', t: 'Con muchos phrasal verbs el objeto puede ir en medio. Si el objeto es un pronombre, debe ir en medio.', ok: ['Turn <b>off</b> the light. / Turn the light <b>off</b>.', 'Turn <b>it</b> off.'], no: ['Turn off it.'] },
    { h: 'Inseparables', t: 'Algunos no se separan nunca.', ok: ['She <b>looks after</b> her brother.', 'I <b>ran into</b> an old friend.'], no: ['She looks her brother after.'] },
    { h: 'Phrasal verbs de tres palabras', t: 'Verbo + dos partículas.', ok: ['I <b>get on with</b> my sister.', "I can't <b>put up with</b> this noise."], no: [] },
    { h: 'Registro', t: 'Son más informales que su equivalente latino: find out (discover), put off (postpone).', ok: ['Informal: They <b>put off</b> the match.', 'Formal: The match was <b>postponed</b>.'], no: [] },
  ],
  err: [['Pick up it.', 'Pick it up.', 'Pronombre en medio.'], ['I looked for the word in the dictionary.', 'I looked up the word in the dictionary.', 'Buscar en un diccionario: look up.']],
  ej: [
    ['mc', "Don't ___! You can do it!", 'give up', ['give in', 'give out'], '<b>give up</b> = rendirse.'],
    ['mc', 'Can you ___ my cat while I\'m on holiday?', 'look after', ['look for', 'look up'], '<b>look after</b> = cuidar.'],
    ['mc', 'I need to ___ what time the film starts.', 'find out', ['find up', 'find on'], '<b>find out</b> = averiguar.'],
    ['mc', 'Choose the correct sentence.', 'Turn it off.', ['Turn off it.', 'Turn it of.'], 'Pronombre entre verbo y partícula.'],
    ['mc', 'The concert was ___ because of the rain.', 'called off', ['called up', 'called on'], '<b>call off</b> = cancelar.'],
    ['gap', 'I get ___ well with my cousins. We never fight.', 'on', '<b>get on (well) with</b> = llevarse bien.'],
    ['gap', 'If you don\'t know a word, look it ___ in the dictionary.', 'up', '<b>look up</b> = buscar información.'],
    ['kwt', 'They postponed the meeting until Friday.', 'PUT', 'They ___ until Friday.', 'put off the meeting/put the meeting off', '<b>put off</b> = posponer.'],
  ],
  voc: 'give up:rendirse, dejar|look after:cuidar|find out:averiguar|turn off:apagar|get on with:llevarse bien con|call off:cancelar|run out of:quedarse sin|put off:posponer',
  preg: ['Who do you get on well with in your family?', 'Have you ever wanted to give up something difficult? What happened?', 'What would you do if you ran out of battery on a school trip?'],
  lis: ['Please turn off your phones before the exam.', 'We ran out of milk, so I went to the shop.', 'I get on really well with my grandmother.', "Don't give up. You're almost there!"],
  wri: ['Escribe 5 instrucciones para cuidar una mascota con phrasal verbs.', 'Write an email to a friend about a day when everything went wrong. Use five phrasal verbs.', 'Rewrite a formal paragraph in an informal style using phrasal verbs.'],
  sab: 'Hay miles de phrasal verbs en inglés. Los investigadores Garnier y Schmitt reunieron los 150 más frecuentes en la lista PHaVE: un excelente punto de partida para estudiar.',
  manos: 'Mimo de phrasal verbs: cada equipo recibe tarjetas (get up, sit down, turn around, put on, take off). Un integrante actúa y el resto dice la oración completa en presente continuo.',
  cam: 'B1 Preliminary Reading Part 5 · B2 First Use of English Part 1 y Part 4 (sustituir verbos por phrasal verbs).',
  jue: ['memorama', 'quiz', 'oraciones'] });

tema({ id: 'collocations', isla: 'voc', n: 'Collocations: make, do, have, take', g: 'make', lv: ['b1', 'b2'],
  intro: 'Las colocaciones son combinaciones de palabras que «van juntas» de manera natural. En inglés se dice «make a mistake» y no «do a mistake»; «take a photo» y no «make a photo». No siempre hay lógica: se aprenden por grupos.',
  reglas: [
    { h: 'make', t: 'Crear o producir algo: make a mistake, make a cake, make friends, make noise, make a decision, make money.', ok: ['I <b>made a mistake</b> in the test.'], no: ['I did a mistake.'] },
    { h: 'do', t: 'Actividades y tareas: do homework, do exercise, do the shopping, do your best, do a favour.', ok: ['Can you <b>do me a favour</b>?', '<b>Do your best</b>!'], no: ['Make your homework.'] },
    { h: 'have', t: 'Experiencias y comidas: have fun, have a shower, have a party, have lunch, have a look.', ok: ['We <b>had a great time</b> at the party.'], no: ['We took fun.'] },
    { h: 'take', t: 'take a photo, take a break, take an exam, take a bus, take care, take part in.', ok: ['Let\'s <b>take a break</b>.', 'I\'m <b>taking</b> the Cambridge exam in June.'], no: ['Let\'s make a break.', 'I\'m presenting the exam. (= presentar examen)'] },
  ],
  err: [['I presented my exam yesterday.', 'I took my exam yesterday.', '«Presentar un examen» = take an exam.'], ['Make a question.', 'Ask a question.', 'Preguntas: ask.']],
  ej: [
    ['mc', "Don't worry, everybody ___ mistakes.", 'makes', ['does', 'takes'], '<b>make a mistake</b>.'],
    ['mc', 'I need to ___ my homework before dinner.', 'do', ['make', 'take'], '<b>do homework</b>.'],
    ['mc', "We're going to ___ the B1 Preliminary exam in May.", 'take', ['present', 'make'], 'Presentar un examen = <b>take an exam</b>.'],
    ['mc', 'Can I ___ a question?', 'ask', ['make', 'do'], 'Preguntar = <b>ask a question</b>.'],
    ['mc', 'Let\'s ___ a break. We\'ve been studying for two hours.', 'take', ['make', 'do'], '<b>take a break</b>.'],
    ['gap', 'We ___ a great time on the school trip.', 'had', '<b>have a great time</b>.'],
    ['gap', 'She wants to ___ friends at her new school.', 'make', '<b>make friends</b>.'],
    ['wf', 'It was a difficult ___ to change schools.', 'DECIDE', 'decision', '<b>make a decision</b>.'],
  ],
  voc: 'make a mistake:cometer un error|do homework:hacer la tarea|take an exam:presentar un examen|have fun:divertirse|make a decision:tomar una decisión|take a break:tomar un descanso|do a favour:hacer un favor|take part in:participar en',
  preg: ['What do you do to have fun at the weekend?', 'What was the most important decision you have made?', 'Have you ever taken part in a competition?'],
  lis: ['I made a few mistakes in my essay.', 'Could you do me a favour?', 'We are going to take a lot of photos.', 'Let\'s have a look at the map.'],
  wri: ['Haz un mapa mental con make, do, have y take.', 'Write about a day when you had a great time. Use at least six collocations.', 'Write a short reflection about a decision that changed your life.'],
  sab: 'Los diccionarios de colocaciones (como el Oxford Collocations Dictionary) son una herramienta favorita de los candidatos a C1 y C2 para sonar más naturales.',
  manos: 'Cuatro esquinas: cada esquina del salón es make, do, have o take. El docente dice un sustantivo («a mistake», «homework», «a photo») y los alumnos corren a la esquina correcta.',
  cam: 'B1 Preliminary Reading Part 5 · B2 First y C1 Advanced Use of English Part 1 (opción múltiple de colocaciones).',
  jue: ['memorama', 'quiz'] });

tema({ id: 'wordformation', isla: 'voc', n: 'Word formation', g: '-tion', lv: ['b2', 'c1'],
  intro: 'La formación de palabras cambia una raíz para crear sustantivos, adjetivos, verbos o adverbios con prefijos y sufijos: happy → happiness → unhappy → happily. Es una parte específica del examen B2 First y C1 Advanced.',
  reglas: [
    { h: 'Sustantivos', t: '-tion, -ment, -ness, -ity, -ance, -er/-or, -ist.', ok: ['decide → deci<b>sion</b>', 'happy → happi<b>ness</b>', 'science → scient<b>ist</b>'], no: ['happyness'] },
    { h: 'Adjetivos', t: '-ful, -less, -ous, -able, -ive, -al, -y.', ok: ['danger → danger<b>ous</b>', 'rely → reli<b>able</b>', 'help → help<b>ful</b> / help<b>less</b>'], no: ['dangerful'] },
    { h: 'Adverbios', t: 'Adjetivo + -ly.', ok: ['careful → careful<b>ly</b>', 'easy → eas<b>ily</b>'], no: ['carefuly'] },
    { h: 'Prefijos negativos', t: 'un-, in-, im-, il-, ir-, dis-, mis-.', ok: ['<b>un</b>happy, <b>im</b>possible, <b>il</b>legal, <b>ir</b>responsible, <b>dis</b>agree'], no: ['unpossible', 'inlegal'] },
    { h: 'Estrategia de examen', t: 'Lee la oración, decide qué tipo de palabra falta, si va en plural o en negativo, y revisa la ortografía.', ok: ['The film was <b>unbelievably</b> boring. (adverbio + negativo)'], no: [] },
  ],
  err: [['It\'s unpossible.', "It's impossible.", 'Antes de p, im-.'], ['He drives very careful.', 'He drives very carefully.', 'Para describir el verbo, adverbio.']],
  ej: [
    ['wf', 'Smoking is very ___ for your health.', 'HARM', 'harmful', 'Adjetivo: <b>harmful</b>.'],
    ['wf', 'Always check that the source is ___.', 'RELY', 'reliable', 'Adjetivo de rely: <b>reliable</b>.'],
    ['wf', 'Her ___ was the best surprise of the night.', 'ARRIVE', 'arrival', 'Sustantivo: <b>arrival</b>.'],
    ['wf', 'It is ___ to park here. You will get a fine.', 'LEGAL', 'illegal', 'Negativo de legal: <b>illegal</b>.'],
    ['wf', 'She solved the problem very ___.', 'EASY', 'easily', 'Adverbio: <b>easily</b>.'],
    ['wf', 'The ___ who wrote the story was only seventeen.', 'JOURNAL', 'journalist', 'Persona: <b>journalist</b>.'],
    ['mc', 'Which word is a noun?', 'happiness', ['happily', 'unhappy'], '<b>-ness</b> forma sustantivos.'],
    ['mc', 'The opposite of «responsible» is…', 'irresponsible', ['unresponsible', 'disresponsible'], 'Antes de r: <b>ir-</b>.'],
  ],
  voc: 'prefix:prefijo|suffix:sufijo|root:raíz|noun:sustantivo|adjective:adjetivo|adverb:adverbio|reliable:confiable|harmful:dañino',
  preg: ['Can you think of three words that come from «create»?', 'Which suffixes are the same in Spanish and in English?', 'Why is word formation useful when you read?'],
  lis: ['The information was completely unreliable.', 'Thank you for your kindness.', 'She explained it clearly and carefully.', 'Pollution is a serious environmental problem.'],
  wri: ['Haz una familia de palabras con «help»: helpful, helpless, helper…', 'Write ten sentences using words formed from: create, act, care, possible, hope.', 'Write a short article paragraph and underline every word with a prefix or suffix.'],
  sab: 'El sufijo -ness es de origen germánico (happiness) y -ity de origen latino (curiosity). Muchas veces el inglés tiene dos palabras casi iguales de cada origen: freedom / liberty.',
  manos: 'Árbol de palabras: en cartulina, cada equipo pone una raíz en el tronco (act, create, nation) y cuelga en las ramas todas las palabras que pueda formar. Gana el árbol más frondoso y bien escrito.',
  cam: 'B2 First y C1 Advanced · Reading & Use of English Part 3 (Word formation, 8 preguntas).',
  jue: ['quiz', 'spelling'] });

tema({ id: 'idioms', isla: 'voc', n: 'Idioms & fixed expressions', g: '🍰', lv: ['c1'], from: 'c2-1',
  intro: 'Los modismos son expresiones cuyo significado no se deduce de sus palabras: «a piece of cake» significa «muy fácil». En niveles avanzados se valora usarlos con precisión y en el registro adecuado; usarlos mal suena peor que no usarlos.',
  err: [['It\'s raining dogs and cats.', "It's raining cats and dogs.", 'Las expresiones fijas no cambian de orden.'], ['Break the leg!', 'Break a leg!', 'Expresión fija: a leg.']],
  sab: '«Break a leg» se le dice a un actor antes de salir al escenario para desearle suerte. Existía la superstición de que desear «good luck» traía mala suerte.',
  manos: 'Ilustra el modismo: cada equipo dibuja el significado literal de un modismo (to let the cat out of the bag) y el grupo adivina cuál es y qué significa realmente.',
  cam: 'C1 Advanced y C2 Proficiency · Reading & Use of English Part 1–2 (expresiones fijas) y Speaking.',
  jue: ['memorama', 'quiz'] });
/* ---------- Pronunciation ---------- */
tema({ id: 'alphabet', isla: 'pron', n: 'The alphabet & spelling', g: 'ABC', lv: ['a1'],
  intro: 'El alfabeto inglés tiene 26 letras (sin ñ). Los nombres de las letras suenan distinto que en español, y es muy importante saberlos: en los exámenes Cambridge te piden deletrear tu nombre o escribir palabras que alguien deletrea en el audio.',
  reglas: [
    { h: 'Las vocales', t: 'Sus nombres en inglés confunden mucho: A /eɪ/, E /iː/, I /aɪ/, O /əʊ/, U /juː/.', ok: ['A suena «ei», E suena «i», I suena «ai».'], no: ['Decir «i» para la letra I.'] },
    { h: 'Letras difíciles', t: 'G /dʒiː/ y J /dʒeɪ/; H /eɪtʃ/; R /ɑː/; W /ˈdʌbəljuː/; Y /waɪ/; Z: «zed» en Reino Unido y «zee» en EE. UU.', ok: ['G = «yi», J = «yei».', 'W = «dabliu».'], no: ['Confundir G con J al deletrear.'] },
    { h: 'Letras dobles', t: 'Se dice «double»: double L, double S, double O.', ok: ['Will: W-I-<b>double L</b>.', 'Good: G-<b>double O</b>-D.'], no: ['W-I-L-L (válido, pero «double L» es lo más común).'] },
    { h: 'Preguntar cómo se escribe', t: '«How do you spell it?» / «Can you spell that, please?»', ok: ['How do you <b>spell</b> your surname? — R-U-I-Z.'], no: ['How do you write your name in letters?'] },
  ],
  err: [['Spelling «G» as /x/.', 'G /dʒiː/', 'La G se llama «yi».'], ['Saying «i» for E.', 'E /iː/', 'La E se llama «i».']],
  ej: [
    ['mc', 'Which letter sounds /aɪ/?', 'I', ['E', 'A'], 'La I se dice «ai».'],
    ['mc', 'Which letter sounds /iː/?', 'E', ['I', 'Y'], 'La E se dice «i».'],
    ['mc', 'How do you spell «book»?', 'B, double O, K', ['B, O, K', 'B, U, K'], 'Dos o: <b>double O</b>.'],
    ['mc', 'In British English, the last letter is called…', 'zed', ['zee', 'zeta'], 'UK: <b>zed</b>; US: <b>zee</b>.'],
    ['mc', 'G and J: which one is /dʒeɪ/?', 'J', ['G', 'H'], 'J = «yei»; G = «yi».'],
    ['gap', 'How do you ___ «Mexico»?', 'spell', 'Deletrear: <b>spell</b>.'],
    ['ord', 'Can you spell that please', 'Can + you + spell + that + please.'],
  ],
  voc: 'spell:deletrear|letter:letra|vowel:vocal|consonant:consonante|double:doble|capital letter:mayúscula|surname:apellido|alphabet:alfabeto',
  preg: ['How do you spell your name and surname?', 'Which English letter is the most difficult for you?', 'Can you spell the name of your town?'],
  lis: ['My name is Grace. G-R-A-C-E.', 'How do you spell your surname?', 'It is spelt with a double L.', 'The word is jeans: J-E-A-N-S.'],
  wri: ['Escribe tu nombre completo y cómo se deletrea en inglés.', 'Write five tricky words and how to spell them letter by letter.', 'Write a short guide for Spanish speakers about the letters that sound different in English.'],
  sab: 'La ñ no existe en inglés. Si tu apellido es Muñoz, en un formulario en inglés se escribe «Munoz» o se explica: «M-U-N with a tilde-O-Z».',
  manos: 'Dictado deletreado: en parejas, uno deletrea palabras del atlas y el otro las escribe. Luego cambian. Después jueguen al Spelling Bee del atlas con todo el grupo.',
  cam: 'Pre A1 Starters y A1 Movers · Listening Part 2 (escribir nombres que se deletrean) · Speaking: «How do you spell your name?»',
  jue: ['spelling', 'dictado', 'lab'] });

tema({ id: 'phonics', isla: 'pron', n: 'Phonics: short & long vowels', g: 'a_e', lv: ['a1'],
  intro: 'Phonics es el método que se usa en los países de habla inglesa para enseñar a leer: relacionar letras con sonidos. Una de las claves son las vocales cortas (cat, pet, sit, hot, cup) y largas, que muchas veces llevan una «e mágica» al final (cake, Pete, kite, home, cute).',
  reglas: [
    { h: 'Vocales cortas', t: 'Una vocal entre consonantes suele sonar corta: a /æ/, e /e/, i /ɪ/, o /ɒ/, u /ʌ/.', ok: ['c<b>a</b>t, b<b>e</b>d, s<b>i</b>t, h<b>o</b>t, c<b>u</b>p'], no: [] },
    { h: 'La «e mágica»', t: 'Una e al final (que no suena) hace que la vocal anterior diga su nombre.', ok: ['cap → c<b>a</b>p<b>e</b>', 'kit → k<b>i</b>t<b>e</b>', 'hop → h<b>o</b>p<b>e</b>', 'cub → c<b>u</b>b<b>e</b>'], no: ['Pronunciar la e final de «cake».'] },
    { h: 'Dígrafos de vocal', t: 'Dos vocales juntas, un sonido largo: ee, ea, ai, ay, oa, ow, oo.', ok: ['s<b>ee</b>, t<b>ea</b>, r<b>ai</b>n, pl<b>ay</b>, b<b>oa</b>t, sn<b>ow</b>, m<b>oo</b>n'], no: [] },
    { h: 'Dígrafos de consonante', t: 'sh, ch, th, ph, wh, ck, ng.', ok: ['<b>sh</b>ip, <b>ch</b>air, <b>th</b>ink, <b>ph</b>one, <b>wh</b>ale, du<b>ck</b>, ki<b>ng</b>'], no: [] },
  ],
  ej: [
    ['mc', 'Which word has a long vowel?', 'kite', ['kit', 'sit'], 'La e mágica alarga la i: <b>kite</b>.'],
    ['mc', 'Add a magic e to «hop»:', 'hope', ['hoop', 'hopy'], 'hop → <b>hope</b>.'],
    ['mc', 'Which word has the same vowel sound as «see»?', 'tea', ['ten', 'tin'], '<b>ee</b> y <b>ea</b> suenan /iː/.'],
    ['mc', 'Which word starts with the sound /ʃ/?', 'shoe', ['chair', 'sun'], '<b>sh</b> = /ʃ/.'],
    ['mc', 'In «phone», ph sounds like…', 'f', ['p', 'h'], '<b>ph</b> = /f/.'],
    ['gap', 'c_t (animal que hace miau)', 'cat', 'Vocal corta a: <b>cat</b>.'],
    ['gap', 'r_ _n (cae del cielo)', 'rain', '<b>ai</b> = /eɪ/.'],
  ],
  voc: 'cat:gato|cake:pastel|kite:papalote|boat:barco|ship:barco grande|chair:silla|phone:teléfono|moon:luna',
  preg: ['Say three words with the sound /iː/.', 'Which words in your name have short vowels?', 'Can you think of a word with «sh»?'],
  lis: ['The cat sat on the mat.', 'I can see a kite in the sky.', 'The boat is on the lake.', 'She has a red cap and a blue cape.'],
  wri: ['Escribe 5 parejas de palabras con y sin e mágica (cap / cape).', 'Write a tongue twister with the sound /ʃ/.', 'Write a short guide with five phonics rules and examples for younger students.'],
  sab: 'En Inglaterra, los niños de 5 a 6 años presentan el «Phonics Screening Check»: leen en voz alta 40 palabras, ¡incluidas palabras inventadas que solo se pueden leer con phonics!',
  manos: 'Clasificación con aros: pon en el piso dos aros de hula-hula, «short» y «long». El docente dice palabras y los alumnos saltan al aro correcto. Después hagan lo mismo con tarjetas en el pizarrón.',
  cam: 'Pre A1 Starters y A1 Movers · Reading & Writing Part 3 (deletrear palabras con letras desordenadas) y Listening.',
  jue: ['spelling', 'pares', 'lab'] });

tema({ id: 'minimal', isla: 'pron', n: 'Minimal pairs for Spanish speakers', g: 'ship', lv: ['a2', 'b1'],
  intro: 'Los pares mínimos son palabras que solo cambian en un sonido: ship / sheep. Para los hispanohablantes son difíciles porque el español tiene 5 vocales y el inglés alrededor de 12, además de sonidos como /v/, /ð/, /θ/, /ʃ/ y /z/. Escucharlos y producirlos mejora mucho la comprensión.',
  reglas: [
    { h: '/ɪ/ vs /iː/', t: 'La /ɪ/ es corta y relajada; la /iː/ es larga y con sonrisa.', ok: ['ship / sheep', 'live / leave', 'fill / feel', 'sit / seat'], no: ['Pronunciar «ship» como «chip» o «shiip».'] },
    { h: '/æ/ vs /ʌ/', t: '/æ/ abre mucho la boca (entre a y e); /ʌ/ es una a corta y relajada.', ok: ['cat / cut', 'bag / bug', 'hat / hut'], no: [] },
    { h: '/b/ vs /v/', t: 'En inglés la v se hace con los dientes de arriba sobre el labio de abajo.', ok: ['berry / very', 'boat / vote', 'ban / van'], no: ['Pronunciar «very» como «beri».'] },
    { h: '/θ/ y /ð/ (th)', t: 'La lengua sale un poco entre los dientes. /θ/ sin voz (think), /ð/ con voz (this).', ok: ['think / sink', 'three / tree', 'they / day'], no: ['Decir «tink» o «dey».'] },
    { h: 'S + consonante', t: 'En inglés no se agrega una e al inicio.', ok: ['school, Spain, student, special'], no: ['eschool, Espain, estudent'] },
    { h: '/ʃ/ vs /tʃ/', t: '/ʃ/ es un «shh» continuo; /tʃ/ empieza con un golpe, como la ch del español.', ok: ['share / chair', 'wash / watch', 'ship / chip'], no: [] },
  ],
  ej: [
    ['mc', 'Which word has the long sound /iː/?', 'sheep', ['ship', 'chip'], '<b>ee</b> = /iː/.'],
    ['mc', 'Which word starts with /v/?', 'vote', ['boat', 'both'], 'Labio y dientes: <b>vote</b>.'],
    ['mc', 'Which is correct?', '/skuːl/ school', ['/eskuːl/', '/skol/'], 'Sin «e» inicial.'],
    ['mc', '«Three» and «tree» are different because of…', 'the th sound', ['the r sound', 'the double e'], 'th = /θ/.'],
    ['mc', 'Which word has the same vowel as «cut»?', 'bus', ['cat', 'bad'], '/ʌ/: c<b>u</b>t, b<b>u</b>s.'],
    ['mc', 'Which pair is a minimal pair?', 'wash / watch', ['wash / washing', 'watch / clock'], 'Solo cambia un sonido.'],
  ],
  voc: 'sheep:oveja|ship:barco|leave:irse, dejar|live:vivir|vote:votar|boat:bote|think:pensar|sink:hundirse, fregadero',
  preg: ['Which English sound is the most difficult for you?', 'Can you say «three free throws» three times?', 'Why do you think Spanish speakers say «eschool»?'],
  lis: ['There is a sheep on the ship.', 'I live here, but I want to leave.', 'I think the boat will sink.', 'Can you watch the baby while I wash the dishes?'],
  wri: ['Haz tarjetas ilustradas con 4 pares mínimos.', 'Write five funny sentences that mix minimal pairs (The sheep is on the ship).', 'Write tips for Spanish speakers to improve their English pronunciation.'],
  sab: 'El español tiene 5 sonidos vocálicos y el inglés británico estándar tiene alrededor de 20 contando los diptongos. Por eso las vocales son el gran reto de pronunciación para los hispanohablantes.',
  manos: 'Espejo y sonrisa: con un espejo de mano (o la cámara del celular), practiquen /iː/ sonriendo y /ɪ/ relajados. Luego jueguen «Pares mínimos» del atlas por equipos: el docente reproduce, los equipos levantan la tarjeta 1 o 2.',
  cam: 'Todos los niveles · Listening (distinguir palabras parecidas) y Speaking (criterio Pronunciation: inteligibilidad).',
  jue: ['pares', 'lab', 'dictado'] });

tema({ id: 'ed', isla: 'pron', n: 'Past tense -ed endings', g: '/ɪd/', lv: ['a2'],
  intro: 'La terminación -ed del pasado regular se pronuncia de tres maneras: /t/, /d/ o /ɪd/. Solo se agrega una sílaba extra (/ɪd/) cuando el verbo termina en sonido t o d. Decir «work-ed» con dos sílabas es un error muy común.',
  reglas: [
    { h: '/ɪd/ (sílaba extra)', t: 'Después de los sonidos /t/ y /d/.', ok: ['wan<b>ted</b>, nee<b>ded</b>, star<b>ted</b>, deci<b>ded</b>'], no: [] },
    { h: '/t/', t: 'Después de sonidos sin voz: /p/, /k/, /s/, /ʃ/, /tʃ/, /f/.', ok: ['worked /wɜːkt/, stopped, washed, watched, laughed'], no: ['work-ed (dos sílabas)'] },
    { h: '/d/', t: 'Después de sonidos con voz y vocales.', ok: ['played /pleɪd/, cleaned, lived, opened, called'], no: ['play-ed (dos sílabas)'] },
    { h: 'Truco de la garganta', t: 'Toca tu garganta: si el último sonido vibra, es /d/; si no vibra, es /t/.', ok: ['Plaaay (vibra) → /d/', 'Wassh (no vibra) → /t/'], no: [] },
  ],
  ej: [
    ['mc', 'How many syllables in «worked»?', '1', ['2', '3'], 'worked = /wɜːkt/, una sílaba.'],
    ['mc', 'Which verb ends in /ɪd/?', 'wanted', ['played', 'stopped'], 'Termina en t: <b>/ɪd/</b>.'],
    ['mc', 'In «played», -ed sounds…', '/d/', ['/t/', '/ɪd/'], 'Después de vocal: <b>/d/</b>.'],
    ['mc', 'In «watched», -ed sounds…', '/t/', ['/d/', '/ɪd/'], 'Después de /tʃ/: <b>/t/</b>.'],
    ['mc', 'Which verb has an extra syllable?', 'decided', ['opened', 'looked'], 'Termina en d: <b>/ɪd/</b>.'],
    ['mc', 'Which group ends in /t/?', 'helped, kissed, cooked', ['needed, wanted, started', 'lived, opened, cleaned'], 'Sonidos sin voz → /t/.'],
  ],
  voc: 'worked:trabajó|played:jugó|wanted:quiso|needed:necesitó|watched:vio|lived:vivió|started:empezó|laughed:se rio',
  preg: ['What did you do yesterday? Use three regular verbs.', 'Which -ed ending is the easiest for you?', 'Tell your partner about last weekend and listen to their -ed endings.'],
  lis: ['I walked to school and talked to my friends.', 'She wanted to go, but she needed to study.', 'We played football and watched a film.', 'They visited the museum and loved it.'],
  wri: ['Escribe 3 columnas (/t/, /d/, /ɪd/) con 4 verbos cada una.', 'Write a diary entry about yesterday and mark each -ed sound.', 'Write a short anecdote and record yourself reading it aloud.'],
  sab: 'El adjetivo «naked» (desnudo) y «learned» (erudito, como adjetivo) son excepciones: se pronuncian con sílaba extra aunque no terminen en t o d: /ˈneɪkɪd/, /ˈlɜːnɪd/.',
  manos: 'Tres sillas: tres sillas al frente etiquetadas /t/, /d/ y /ɪd/. El docente dice un verbo y un alumno corre a sentarse en la correcta. El grupo comprueba tocándose la garganta.',
  cam: 'A2 Key y B1 Preliminary · Speaking (criterio de pronunciación) · Listening (reconocer el pasado).',
  jue: ['ruleta', 'lab', 'dictado'] });

tema({ id: 'sendings', isla: 'pron', n: 'Plural & 3rd person -s', g: '/ɪz/', lv: ['a1', 'a2'],
  intro: 'La -s del plural y de la tercera persona (she works) se pronuncia de tres maneras: /s/, /z/ o /ɪz/. Solo se agrega una sílaba extra después de sonidos como s, z, sh, ch, j y x. Escuchar y decir bien la -s ayuda a no olvidarla al hablar.',
  reglas: [
    { h: '/ɪz/ (sílaba extra)', t: 'Después de /s/, /z/, /ʃ/, /tʃ/, /dʒ/ y /ks/.', ok: ['bus<b>es</b>, box<b>es</b>, watch<b>es</b>, wash<b>es</b>, page<b>s</b>'], no: [] },
    { h: '/s/', t: 'Después de sonidos sin voz: /p/, /t/, /k/, /f/, /θ/.', ok: ['cats, books, stops, laughs'], no: [] },
    { h: '/z/', t: 'Después de sonidos con voz y vocales.', ok: ['dogs, plays, girls, trees, runs'], no: [] },
    { h: 'No la olvides', t: 'Con he / she / it, el verbo siempre lleva -s, y se tiene que oír.', ok: ['She <b>likes</b> pizza.', 'My dad <b>watches</b> the news.'], no: ['She like pizza.'] },
  ],
  ej: [
    ['mc', 'Which word has an extra syllable?', 'boxes', ['books', 'dogs'], 'Después de x: <b>/ɪz/</b>.'],
    ['mc', 'In «dogs», the -s sounds…', '/z/', ['/s/', '/ɪz/'], 'Después de g (con voz): <b>/z/</b>.'],
    ['mc', 'In «cats», the -s sounds…', '/s/', ['/z/', '/ɪz/'], 'Después de t (sin voz): <b>/s/</b>.'],
    ['mc', 'How many syllables in «watches»?', '2', ['1', '3'], 'watch-es: dos sílabas.'],
    ['gap', 'My brother ___ (wash) the car on Sundays.', 'washes', 'wash → <b>washes</b> /ɪz/.'],
    ['gap', 'She ___ (go) to school by bus.', 'goes', 'go → <b>goes</b>.'],
  ],
  voc: 'buses:autobuses|boxes:cajas|watches:relojes, mira|dogs:perros|books:libros|pages:páginas|classes:clases|glasses:lentes, vasos',
  preg: ['What does your best friend like? Use he / she + -s.', 'How many classes do you have on Mondays?', 'What does your family do on Sundays?'],
  lis: ['She watches TV and plays the piano.', 'There are three buses and two taxis.', 'He fixes bikes and washes cars.', 'My cat likes boxes.'],
  wri: ['Escribe 6 oraciones sobre un familiar en tercera persona.', 'Write a profile of a classmate: what he or she does every day.', 'Write a fact file about an animal using the third person singular.'],
  sab: 'La regla de /s/ y /z/ es la misma que la de -ed (/t/ y /d/): todo depende de si el último sonido vibra o no en tu garganta.',
  manos: 'Cadena de rutinas: cada alumno dice algo que hace un compañero («Ana brushes her teeth»). El grupo levanta 1 dedo para /s/, 2 para /z/ y 3 para /ɪz/.',
  cam: 'Pre A1 Starters a A2 Key · Speaking (precisión gramatical y pronunciación).',
  jue: ['lab', 'dictado', 'arcade'] });

tema({ id: 'stress', isla: 'pron', n: 'Word stress & weak forms', g: 'ˈpho·to', lv: ['b1', 'b2'],
  intro: 'En inglés, una sílaba de cada palabra se pronuncia más fuerte (stress) y las demás se debilitan, muchas veces con el sonido /ə/ (schwa). En la oración, las palabras de contenido se acentúan y las gramaticales (a, to, of, can, was) se reducen. Ese ritmo es lo que hace que el inglés «suene a inglés».',
  reglas: [
    { h: 'El acento cambia el significado', t: 'Algunas palabras son sustantivo con acento en la 1.ª sílaba y verbo en la 2.ª.', ok: ['a <b>RE</b>cord / to re<b>CORD</b>', 'a <b>PRE</b>sent / to pre<b>SENT</b>'], no: [] },
    { h: 'Familias de palabras', t: 'El acento se mueve al cambiar la terminación.', ok: ['<b>PHO</b>tograph → pho<b>TO</b>graphy → photo<b>GRA</b>phic'], no: [] },
    { h: 'Schwa /ə/', t: 'Es el sonido más común del inglés: una vocal débil y relajada.', ok: ['b<b>a</b>nana /bəˈnɑːnə/', 'teach<b>er</b> /ˈtiːtʃə/', 'p<b>o</b>lice /pəˈliːs/'], no: ['Pronunciar todas las vocales completas.'] },
    { h: 'Formas débiles', t: 'Las palabras gramaticales se reducen en la oración.', ok: ['I want <b>to</b> go = /tə/', 'a cup <b>of</b> tea = /əv/', 'I <b>can</b> swim = /kən/'], no: [] },
    { h: 'Palabras que confunden', t: 'Acentos distintos al español.', ok: ['<b>CHO</b>colate, <b>VE</b>getable, ho<b>TEL</b>, <b>IN</b>teresting, e<b>VENT</b>'], no: ['choco-LA-te', 'vege-TA-ble'] },
  ],
  ej: [
    ['mc', 'Where is the stress in «vegetable»?', 'VEG-e-ta-ble', ['ve-ge-TA-ble', 've-ge-ta-BLE'], 'Primera sílaba: <b>VEG</b>etable.'],
    ['mc', 'The verb «to present» is stressed…', 'pre-SENT', ['PRE-sent', 'PRE-SENT'], 'Verbo: segunda sílaba.'],
    ['mc', 'The most common vowel sound in English is…', 'schwa /ə/', ['/iː/', '/æ/'], 'La <b>schwa</b>.'],
    ['mc', 'Where is the stress in «photography»?', 'pho-TO-gra-phy', ['PHO-to-gra-phy', 'pho-to-GRA-phy'], 'pho<b>TO</b>graphy.'],
    ['mc', 'In «I want to go», «to» is usually pronounced…', '/tə/', ['/tuː/', '/tɒ/'], 'Forma débil.'],
    ['mc', 'Which word is stressed on the second syllable?', 'hotel', ['chocolate', 'interesting'], 'ho<b>TEL</b>.'],
  ],
  voc: 'stress:acento|syllable:sílaba|schwa:schwa (vocal débil)|weak form:forma débil|rhythm:ritmo|intonation:entonación|record:grabar, récord|present:presentar, regalo',
  preg: ['Say the names of five subjects at school. Where is the stress?', 'Which English words do you often stress incorrectly?', 'Why is rhythm important when you listen to native speakers?'],
  lis: ['I bought a present for my teacher.', 'Can you record the interview?', 'I would like a cup of tea, please.', 'Photography is my favourite hobby.'],
  wri: ['Copia 10 palabras del atlas y subraya la sílaba fuerte.', 'Write a list of ten words that Spanish speakers often stress incorrectly.', 'Mark stress and weak forms in a short speech before you deliver it.'],
  sab: 'El inglés es un idioma de «ritmo acentual»: el tiempo entre sílabas fuertes tiende a ser parecido. El español es de «ritmo silábico»: todas las sílabas duran más o menos lo mismo.',
  manos: 'Ritmo con palmadas: el grupo dice frases con palmadas solo en las sílabas fuertes: «CATS chase MICE», «the CATS will have CHASED the MICE». Ambas tardan casi lo mismo en decirse.',
  cam: 'B1 Preliminary a C2 Proficiency · Speaking (criterio Pronunciation: acento, ritmo y entonación) y Listening (formas débiles).',
  jue: ['lab', 'dictado'] });

tema({ id: 'silent', isla: 'pron', n: 'Silent letters', g: 'k̶now', lv: ['a2', 'b1'],
  intro: 'Muchas palabras en inglés tienen letras que se escriben pero no se pronuncian: la k de «know», la b de «climb» o la w de «write». Son restos de cómo se pronunciaba el inglés hace siglos. Conocer los patrones ayuda a leer y a escribir sin errores.',
  reglas: [
    { h: 'kn-', t: 'La k no suena antes de n al inicio.', ok: ['<b>k</b>now, <b>k</b>nife, <b>k</b>nee, <b>k</b>nock'], no: ['k-now'] },
    { h: '-mb', t: 'La b no suena después de m al final.', ok: ['clim<b>b</b>, thum<b>b</b>, com<b>b</b>, lam<b>b</b>'], no: [] },
    { h: 'wr-', t: 'La w no suena antes de r.', ok: ['<b>w</b>rite, <b>w</b>rong, <b>w</b>rist'], no: [] },
    { h: '-gh-', t: 'Muchas veces gh no suena.', ok: ['ni<b>gh</b>t, dau<b>gh</b>ter, li<b>gh</b>t, thou<b>gh</b>'], no: [] },
    { h: 'Otras', t: 'h en hour / honest; l en walk / talk / half; t en listen / castle.', ok: ['<b>h</b>our, wa<b>l</b>k, lis<b>t</b>en'], no: ['li-sten con t'] },
  ],
  ej: [
    ['mc', 'Which letter is silent in «knife»?', 'k', ['n', 'f'], '<b>k</b>nife.'],
    ['mc', 'Which letter is silent in «listen»?', 't', ['s', 'n'], 'lis<b>t</b>en.'],
    ['mc', 'Which word has a silent b?', 'climb', ['bubble', 'table'], 'clim<b>b</b>.'],
    ['mc', 'Which word has a silent w?', 'write', ['window', 'water'], '<b>w</b>rite.'],
    ['gap', 'I don\'t ___ the answer. (saber)', 'know', 'Con k muda: <b>know</b>.'],
    ['gap', 'It\'s eleven o\'clock at ___. (noche)', 'night', 'gh muda: <b>night</b>.'],
  ],
  voc: 'know:saber|knife:cuchillo|climb:escalar|write:escribir|wrong:incorrecto|hour:hora|listen:escuchar|island:isla',
  preg: ['Which silent letter surprised you the most?', 'Can you spell «Wednesday»? Which letter is silent?', 'Why do you think English has silent letters?'],
  lis: ['I know how to climb that tree.', 'Listen to the answer and write it down.', 'We walked for half an hour.', 'My daughter is very honest.'],
  wri: ['Haz un póster de «letras ninja» (silent letters) con dibujos.', 'Write a short story using at least eight words with silent letters.', 'Research the history of one silent letter and explain it in a paragraph.'],
  sab: 'Hace unos 600 años, la k de «knight» sí se pronunciaba. La ortografía del inglés se fijó con la imprenta, pero la pronunciación siguió cambiando: por eso hoy no coinciden.',
  manos: 'Letras ninja: el docente escribe palabras en el pizarrón y los alumnos, por equipos, tachan las letras mudas con un plumón. Después lean las palabras en voz alta juntos.',
  cam: 'A2 Key y B1 Preliminary · Writing (la ortografía cuenta) y Listening.',
  jue: ['spelling', 'arcade', 'dictado'] });

tema({ id: 'intonation', isla: 'pron', n: 'Intonation in questions', g: '↗↘', lv: ['b1', 'b2'],
  intro: 'La entonación es la «melodía» de la voz. En inglés, las preguntas de sí / no suelen subir al final (↗) y las preguntas con wh- suelen bajar (↘). La entonación también muestra emociones: interés, sorpresa o duda. Una entonación plana puede sonar aburrida o poco amable.',
  reglas: [
    { h: 'Yes / No questions ↗', t: 'La voz sube al final.', ok: ['Do you like pizza? ↗', 'Are you ready? ↗'], no: [] },
    { h: 'Wh- questions ↘', t: 'La voz baja al final.', ok: ['Where do you live? ↘', 'What time is it? ↘'], no: [] },
    { h: 'Question tags', t: 'Si bajas, buscas confirmación; si subes, es una pregunta real.', ok: ["It's cold, isn't it? ↘ (estoy seguro)", "You're coming, aren't you? ↗ (no estoy seguro)"], no: [] },
    { h: 'Listas', t: 'Sube en cada elemento y baja en el último.', ok: ['I need eggs ↗, milk ↗ and bread ↘.'], no: [] },
    { h: 'Mostrar interés', t: 'Respuestas cortas con entonación viva.', ok: ['Really? ↗', 'Oh, that\'s great! ↘'], no: ['Really. (plano y sin interés)'] },
  ],
  ej: [
    ['mc', 'In «Where are you from?», the voice usually…', 'goes down ↘', ['goes up ↗', 'stays flat'], 'Wh- questions: <b>↘</b>.'],
    ['mc', 'In «Are you hungry?», the voice usually…', 'goes up ↗', ['goes down ↘', 'stays flat'], 'Yes / No: <b>↗</b>.'],
    ['mc', '«Nice day, isn\'t it?» ↘ means the speaker…', 'expects you to agree', ['really doesn\'t know', 'is angry'], 'Tag que baja: busca acuerdo.'],
    ['mc', 'In a list, the voice goes down on…', 'the last item', ['every item', 'the first item'], 'Sube, sube y baja al final.'],
    ['mc', 'Which tag is correct? «You like music, ___?»', "don't you", ["aren't you", "do you"], 'Afirmativo → tag negativo con do.'],
    ['gap', "She can swim, ___ she?", "can't", 'Tag: <b>can\'t she?</b>'],
  ],
  voc: 'intonation:entonación|rise:subir|fall:bajar|question tag:pregunta de confirmación|polite:amable|bored:aburrido|surprised:sorprendido|interested:interesado',
  preg: ['Ask your partner three yes / no questions and three wh- questions.', 'How can intonation make you sound more polite?', 'Say «Really?» in three different ways: surprised, bored and angry.'],
  lis: ['Are you coming to the party?', 'Where did you buy those shoes?', "It's a beautiful day, isn't it?", 'I need pens, paper, glue and scissors.'],
  wri: ['Escribe 5 preguntas y dibuja la flecha de entonación.', 'Write a short dialogue with question tags and mark the intonation.', 'Write a role-play script showing polite and impolite intonation.'],
  sab: 'En la mayoría de los idiomas las preguntas de sí / no suben al final, pero en algunas zonas de Irlanda del Norte y Escocia, ¡muchas oraciones afirmativas también suben!',
  manos: 'Flechas humanas: el docente dice preguntas y el grupo dibuja la flecha en el aire con el brazo (↗ o ↘). Después, en parejas, hagan entrevistas exagerando la entonación.',
  cam: 'B1 Preliminary a C1 Advanced · Speaking (Interactive Communication y Pronunciation).',
  jue: ['lab', 'speaking'] });
/* ---------- Reading & Writing ---------- */
tema({ id: 'punctuation', isla: 'rw', n: 'Capital letters & punctuation', g: 'A.', lv: ['a1', 'a2'],
  intro: 'En inglés se usan mayúsculas en más casos que en español: el pronombre «I», los días, los meses, los idiomas y las nacionalidades. Los signos de interrogación y exclamación solo van al final de la oración, nunca al inicio.',
  reglas: [
    { h: 'Siempre con mayúscula', t: 'Inicio de oración, «I», nombres, días, meses, idiomas, nacionalidades y países.', ok: ['On <b>M</b>onday <b>I</b> have <b>E</b>nglish.', 'She is <b>M</b>exican and speaks <b>S</b>panish.'], no: ['on monday i have english.'] },
    { h: 'Preguntas y exclamaciones', t: 'Solo un signo, al final.', ok: ['How are you<b>?</b>', 'What a great idea<b>!</b>'], no: ['¿How are you?', '¡What a great idea!'] },
    { h: 'El apóstrofo', t: 'Para contracciones (it\'s, don\'t) y para el posesivo (Ana\'s).', ok: ["<b>It's</b> my sister<b>'s</b> book.", "I <b>don't</b> know."], no: ["Its my sisters book."] },
    { h: 'La coma en listas', t: 'Separa elementos; antes de «and» es opcional (la «Oxford comma»).', ok: ['I like pizza, tacos and sushi.', 'I like pizza, tacos, and sushi.'], no: [] },
    { h: 'Títulos', t: 'En los títulos en inglés se suelen poner con mayúscula las palabras importantes.', ok: ['<b>T</b>he <b>L</b>ord of the <b>R</b>ings', '<b>M</b>y <b>B</b>est <b>D</b>ay <b>E</b>ver'], no: [] },
  ],
  err: [['i like english.', 'I like English.', 'I e idiomas con mayúscula.'], ['¿Do you like it?', 'Do you like it?', 'Sin signo de apertura.'], ['in july', 'in July', 'Meses con mayúscula.']],
  ej: [
    ['mc', 'Which sentence is correct?', 'I speak Spanish and English.', ['i speak spanish and english.', 'I speak spanish and english.'], 'I e idiomas con mayúscula.'],
    ['mc', 'Which sentence is correct?', 'Where do you live?', ['¿Where do you live?', '¿Where do you live'], 'Un solo signo, al final.'],
    ['mc', 'Which needs a capital letter?', 'Tuesday', ['school', 'teacher'], 'Los días: <b>Tuesday</b>.'],
    ['mc', "Choose the correct one.", "It's Luis's bike.", ["Its Luis bike.", "It's Luis bike's."], "Contracción + posesivo."],
    ['gap', 'My birthday is in ___ (agosto).', 'August', 'Meses con mayúscula: <b>August</b>.'],
    ['gap', 'We are ___ (mexicanos).', 'Mexican', 'Nacionalidades con mayúscula.'],
  ],
  voc: 'capital letter:mayúscula|full stop:punto (UK)|period:punto (US)|comma:coma|question mark:signo de interrogación|exclamation mark:signo de exclamación|apostrophe:apóstrofo|brackets:paréntesis',
  preg: ['What is your favourite day of the week? Why?', 'Which languages do people speak in your family?', 'Which punctuation rule in English is different from Spanish?'],
  lis: ['My name is Laura and I am Mexican.', 'On Fridays I have English and Music.', 'Do you speak French?', "It's my brother's birthday in May."],
  wri: ['Corrige 5 oraciones sin mayúsculas ni puntos y cópialas bien.', 'Write a short profile with your name, nationality, languages and birthday.', 'Proofread a paragraph and correct ten punctuation mistakes.'],
  sab: 'El pronombre «I» se escribe con mayúscula desde la Edad Media. Una explicación es que una «i» minúscula sola se perdía fácilmente en los manuscritos.',
  manos: 'Detectives de errores: el docente proyecta un mensaje con 10 errores de mayúsculas y signos. Los equipos los cazan en tres minutos y explican cada corrección.',
  cam: 'Pre A1 Starters a B1 Preliminary · Writing: la puntuación y la ortografía forman parte de la calificación de «Language».',
  jue: ['arcade', 'dictado'] });

tema({ id: 'connectors', isla: 'rw', n: 'Linking words', g: 'but', lv: ['a2', 'b1', 'b2'],
  intro: 'Los conectores unen ideas y hacen que un texto fluya. Los básicos son and, but, because, so y or. En niveles más altos se usan however, although, moreover, therefore y on the other hand. En los exámenes Cambridge se califican en el criterio «Organisation».',
  reglas: [
    { h: 'Añadir', t: 'and, also, too, as well as, moreover, in addition.', ok: ['I like football <b>and</b> basketball.', '<b>Moreover</b>, it is cheap.'], no: [] },
    { h: 'Contrastar', t: 'but, although, however, on the other hand, while, whereas.', ok: ['It was cold, <b>but</b> we went out.', '<b>Although</b> it was cold, we went out.', 'It was cold. <b>However</b>, we went out.'], no: ['Although it was cold, but we went out.'] },
    { h: 'Causa y consecuencia', t: 'because, as, since / so, therefore, as a result.', ok: ['I stayed home <b>because</b> I was ill.', 'I was ill, <b>so</b> I stayed home.'], no: ['Because I was ill. (oración incompleta)'] },
    { h: 'Secuencia', t: 'first, then, after that, next, finally, in the end.', ok: ['<b>First</b>, we went to the museum. <b>Then</b> we had lunch.'], no: [] },
    { h: 'However y although', t: '«However» empieza una nueva oración y lleva coma. «Although» une dos ideas en la misma oración.', ok: ['The film was long. <b>However,</b> it was great.'], no: ['The film was long however it was great.'] },
  ],
  err: [['Although it rained, but we played.', 'Although it rained, we played.', 'No uses although y but juntos.'], ['Despite of the rain…', 'Despite the rain… / In spite of the rain…', '«Despite» no lleva «of».']],
  ej: [
    ['mc', 'I wanted to go, ___ I was too tired.', 'but', ['so', 'because'], 'Contraste: <b>but</b>.'],
    ['mc', 'It was raining, ___ we stayed inside.', 'so', ['but', 'although'], 'Consecuencia: <b>so</b>.'],
    ['mc', '___ it was expensive, we bought it.', 'Although', ['However', 'Despite'], '<b>Although</b> + oración.'],
    ['mc', 'The hotel was nice. ___, the food was terrible.', 'However', ['Although', 'Because'], 'Nueva oración: <b>However</b>.'],
    ['mc', '___ the rain, the match continued.', 'Despite', ['Although', 'Despite of'], '<b>Despite</b> + sustantivo.'],
    ['gap', 'I didn\'t go to school ___ I had a fever.', 'because', 'Causa: <b>because</b>.'],
    ['gap', 'First, mix the eggs. ___, add the flour.', 'Then/Next/After that', 'Secuencia.'],
    ['kwt', 'Although she was tired, she finished the race.', 'DESPITE', '___ tired, she finished the race.', 'despite being/despite feeling', '<b>Despite</b> + -ing.'],
  ],
  voc: 'however:sin embargo|although:aunque|therefore:por lo tanto|moreover:además|whereas:mientras que|despite:a pesar de|in addition:además|as a result:como resultado',
  preg: ['Describe your weekend using first, then and finally.', 'Say one good thing and one bad thing about your town using «however».', 'Why are linking words important in an essay?'],
  lis: ['I like summer because I can go to the beach.', 'Although it was late, we kept talking.', 'The test was difficult. However, I passed.', 'First we had lunch, and then we went to the cinema.'],
  wri: ['Escribe 5 oraciones con and, but, because, so y or.', 'Write a paragraph about the advantages and disadvantages of social media using five linking words.', 'Write a balanced paragraph on online learning using contrast and addition connectors.'],
  sab: 'Los examinadores de Cambridge cuentan la variedad de conectores, no la cantidad. Repetir «and» diez veces baja la calificación; usar bien «whereas» o «nevertheless» la sube.',
  manos: 'Dominó de conectores: tarjetas con mitades de oraciones y conectores. Los equipos arman cadenas lógicas. Gana el equipo que forme el párrafo más largo y coherente.',
  cam: 'A2 Key a C2 Proficiency · Writing: criterio «Organisation» · B1 Preliminary Reading Part 4 (frases faltantes con conectores).',
  jue: ['oraciones', 'quiz'] });

tema({ id: 'email', isla: 'rw', n: 'Writing an informal email', g: '@', lv: ['a2', 'b1'],
  intro: 'El email informal es una de las tareas más frecuentes en los exámenes Cambridge: A2 Key Part 6 (25 palabras o más) y B1 Preliminary Part 1 (unas 100 palabras). La clave es responder todos los puntos que te piden, con saludo, cierre y un tono amistoso.',
  reglas: [
    { h: 'Saludo y apertura', t: 'Hi / Hello / Dear + nombre. Una frase para conectar.', ok: ['Hi Tom,', "Thanks for your email. It was great to hear from you!"], no: ['Dear Sir, (es formal)'] },
    { h: 'Responde TODOS los puntos', t: 'Subraya las preguntas o notas del examen y contéstalas en orden.', ok: ["You asked about the party. It's on Saturday at 5 pm.", "I think you should bring a jacket because…"], no: ['Olvidar uno de los puntos: pierdes calificación de contenido.'] },
    { h: 'Lenguaje informal', t: 'Contracciones, preguntas al lector, expresiones amistosas.', ok: ["I can't wait!", "What do you think?", "Guess what?"], no: ['I would be grateful if you could… (muy formal)'] },
    { h: 'Despedida', t: 'Frase de cierre + firma.', ok: ['Write soon!', 'See you on Saturday!', 'Love, / Best wishes, / Bye for now,'], no: ['Yours faithfully, (formal)'] },
  ],
  err: [['Dear friend Tom,', 'Hi Tom,', 'Más natural en un email informal.'], ['I wait your answer.', 'Write back soon! / I look forward to hearing from you.', 'Frase de cierre correcta.']],
  ej: [
    ['mc', 'The best opening for an email to a friend is…', 'Hi Sam,', ['Dear Sir or Madam,', 'To whom it may concern,'], 'Informal: <b>Hi + nombre</b>.'],
    ['mc', 'Which is an informal closing?', 'See you soon!', ['Yours faithfully,', 'I remain at your disposal.'], 'Cierre amistoso.'],
    ['mc', 'In A2 Key Writing Part 6, you must…', 'answer all three points', ['write 200 words', 'write a formal letter'], 'Responder los 3 puntos.'],
    ['mc', 'Which sentence shows interest in the reader?', 'How was your holiday?', ['I am very tired.', 'My name is Ana.'], 'Preguntar al lector es muy natural.'],
    ['gap', 'Thanks for your email. It was great to ___ from you.', 'hear', '<b>hear from</b> = tener noticias de.'],
    ['gap', 'I can\'t ___ to see you!', 'wait', '<b>I can\'t wait</b> = ya quiero.'],
    ['ord', 'Thanks for inviting me to your party.', 'Thanks for + -ing.'],
  ],
  texto: { t: 'Model email (B1 Preliminary)', x: `Hi Carla,
Thanks for your email! It was great to hear from you. I'm really happy you're coming to Guadalajara next month.
You asked about the weather. In July it's usually warm, but it often rains in the afternoon, so bring an umbrella and a light jacket.
I think we should visit Tlaquepaque on Saturday. There are amazing craft shops and you can try tortas ahogadas. On Sunday, if you like, we could go to a football match. What do you think?
I can't wait to see you!
Love,
Mariana`, q: [['Why is Mariana writing?', 'To answer Carla\'s questions about her visit', 'To invite Carla to a party', 'To complain about the weather', 'Responde el email de Carla sobre su visita.'], ['What should Carla bring?', 'An umbrella and a light jacket', 'A swimming costume', 'A football', '«bring an umbrella and a light jacket».'], ['Which phrase is informal?', "I can't wait to see you!", 'Yours faithfully', 'I am writing to inform you', 'Contracción y emoción: informal.'], ['How many paragraphs does the body have?', 'Three', 'One', 'Five', 'Apertura, clima y planes.']] },
  voc: 'email:correo electrónico|reply:responder|invite:invitar|suggest:sugerir|hear from:tener noticias de|look forward to:esperar con ganas|attach:adjuntar|subject:asunto',
  preg: ['Who do you usually write messages to?', 'How is writing an email different from sending a chat message?', 'What makes an email friendly?'],
  lis: ['Thanks for your message. It was great to hear from you.', 'You asked me about my new school.', 'Why don\'t you come with us on Saturday?', 'Write back soon!'],
  wri: ['Escríbele a un amigo para invitarlo a tu cumpleaños: cuándo, dónde y qué traer (25+ palabras).', 'Your English friend asks about your favourite place in your city. Write an email of about 100 words: what it is, why you like it and when you could go together.', 'Write an email to a friend who is moving to your city. Give advice about schools, transport and things to do (140–190 words).'],
  sab: 'En B1 Preliminary el email de la Parte 1 trae cuatro notas al margen del texto de entrada. Una estrategia sencilla es escribir un párrafo por cada nota.',
  manos: 'Correo del salón: cada alumno escribe un email a un compañero sorteado con tres preguntas. El compañero responde contestando todos los puntos. El docente revisa con la checklist del atlas.',
  cam: 'A2 Key Writing Part 6 (25+ palabras) · B1 Preliminary Writing Part 1 (unas 100 palabras) · B2 First Writing Part 2 (email / carta).',
  jue: ['oraciones', 'quiz'] });

tema({ id: 'story', isla: 'rw', n: 'Writing a story', g: 'Once…', lv: ['a2', 'b1', 'b2'],
  intro: 'Escribir una historia es una tarea de A2 Key (Part 7, con 3 imágenes), B1 Preliminary (Part 2, con una primera oración dada) y B2 First for Schools. Una buena historia tiene inicio, problema, clímax y final, y usa tiempos narrativos, conectores de secuencia y vocabulario expresivo.',
  reglas: [
    { h: 'Estructura', t: 'Inicio (quién, dónde, cuándo) → problema → clímax → final.', ok: ['One sunny morning… / Suddenly… / In the end…'], no: ['Escribir todo en un solo párrafo sin final.'] },
    { h: 'Tiempos narrativos', t: 'Past simple para los hechos, past continuous para el fondo, past perfect para lo que pasó antes.', ok: ['It <b>was raining</b> when I <b>left</b>. I <b>had forgotten</b> my umbrella.'], no: [] },
    { h: 'Conectores de tiempo', t: 'First, then, suddenly, after a while, as soon as, finally, in the end.', ok: ['<b>Suddenly</b>, the lights went out.'], no: ['And then… and then… and then…'] },
    { h: 'Vocabulario vivo', t: 'Adjetivos y adverbios: terrified, delighted, slowly, nervously.', ok: ['I was <b>terrified</b>.', 'She opened the door <b>slowly</b>.'], no: ['I was very very scared.'] },
    { h: 'Primera oración dada', t: 'En B1 y B2 debes empezar con la oración del examen, sin cambiarla, y la historia debe tener relación con ella.', ok: ['«When I opened the box, I couldn\'t believe my eyes.»'], no: [] },
  ],
  err: [['In the end, I wake up.', 'In the end, I woke up.', 'Mantén el pasado.'], ['Suddenly, was a noise.', 'Suddenly, there was a noise.', 'Sujeto obligatorio.']],
  ej: [
    ['mc', 'Which is a good story opening?', 'It was a cold, dark night in December.', ['I am going to tell a story.', 'This is my story about a dog.'], 'Crea ambiente desde el inicio.'],
    ['mc', 'I ___ dinner when the phone rang.', 'was having', ['had', 'have'], 'Fondo: past continuous.'],
    ['mc', 'Which word introduces a surprise?', 'Suddenly', ['Firstly', 'Moreover'], '<b>Suddenly</b> = de repente.'],
    ['mc', 'When we arrived, the film ___ already started.', 'had', ['has', 'was'], 'Antes de otra acción pasada: past perfect.'],
    ['mc', 'Which adjective is the strongest?', 'terrified', ['scared', 'worried'], 'Muy asustado: <b>terrified</b>.'],
    ['gap', 'In the ___, everybody was happy.', 'end', '<b>In the end</b> = al final.'],
    ['ord', 'Suddenly the lights went out.', 'Conector + sujeto + verbo.'],
  ],
  voc: 'suddenly:de repente|in the end:al final|terrified:aterrado|delighted:encantado|slowly:lentamente|scream:gritar|realise:darse cuenta|mystery:misterio',
  preg: ['What is the best story you have ever read?', 'Tell your partner about a funny thing that happened to you.', 'What makes a story exciting?'],
  lis: ['It was a dark and stormy night.', 'Suddenly, we heard a strange noise.', 'When I opened the door, I couldn\'t believe my eyes.', 'In the end, we all laughed about it.'],
  wri: ['Mira 3 imágenes y escribe la historia de un perrito perdido (35+ palabras).', 'Write a story that begins: «When I opened the box, I couldn\'t believe my eyes.» (about 100 words).', 'Write a story that ends: «…and that was the last time I trusted a map.» (140–190 words).'],
  sab: 'El escritor Ernest Hemingway supuestamente ganó una apuesta escribiendo una historia de seis palabras: «For sale: baby shoes, never worn.» No hay pruebas de que fuera él, pero el reto de las historias de seis palabras sigue siendo popular en las clases de escritura.',
  manos: 'Historias en tres imágenes: cada equipo recibe tres dibujos (o los dibuja otro equipo). Escriben la historia con conectores de secuencia y la leen dramatizada. Usen «Ordena la historia» del atlas para calentar.',
  cam: 'A2 Key Writing Part 7 · B1 Preliminary Writing Part 2 · B2 First for Schools Writing Part 2.',
  jue: ['cuento', 'tiempos', 'oraciones'] });

tema({ id: 'article', isla: 'rw', n: 'Articles & reviews', g: '★★★', lv: ['b1', 'b2'],
  intro: 'Un artículo se escribe para una revista o sitio web y busca interesar al lector; una reseña da una opinión y una recomendación sobre una película, libro, restaurante o app. Ambos aparecen en B1 Preliminary y B2 First, y piden un título atractivo, un tono cercano y una opinión clara.',
  reglas: [
    { h: 'Título y gancho', t: 'Un título llamativo y una pregunta o dato al inicio para atrapar al lector.', ok: ['<b>Can you live without your phone?</b>', 'Have you ever wondered…?'], no: ['Title: Article about phones'] },
